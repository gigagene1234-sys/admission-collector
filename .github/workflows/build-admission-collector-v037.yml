name: Build Admission Collector v0.3.7

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-admission-collector-v037.yml"
      - "scripts/apply_v037.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply v0.3.7 navigation watchdog patch
        run: python3 scripts/apply_v037.py

      - name: Verify v0.3.7 invariants
        shell: bash
        run: |
          set -euo pipefail
          cmp -s MainActivity.kt app/src/main/java/com/admissionhub/collector/MainActivity.kt
          grep -q 'private const val VERSION = "0.3.7"' MainActivity.kt
          grep -q 'versionName = "0.3.7"' app/build.gradle.kts
          grep -q 'versionCode = 14' app/build.gradle.kts
          grep -q 'BATCH_NAVIGATION_TIMEOUT_MS = 15_000L' MainActivity.kt
          grep -q 'armBatchNavigationWatchdog(url)' MainActivity.kt
          grep -q '페이지 로딩 지연 감지' MainActivity.kt
          grep -q 'authenticated-webview-covered' MainActivity.kt
          test "$(grep -c 'private lateinit var webView: WebView' MainActivity.kt)" -eq 1
          grep -q 'ADMISSION_SIGNING_STORE_FILE' app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_SECRET"
          test -f signing/admission-upload.keystore.enc
          STORE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -pass env:ANDROID_SIGNING_SECRET \
            -in signing/admission-upload.keystore.enc \
            -out "$STORE"
          keytool -list -keystore "$STORE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build v0.3.7 APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Persist v0.3.7 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MainActivity.kt app/build.gradle.kts app/src/main/java/com/admissionhub/collector/MainActivity.kt scripts/apply_v037.py
          if git diff --cached --quiet; then
            echo "v0.3.7 source already persisted"
          else
            git commit -m "Apply v0.3.7 navigation watchdog [skip ci]"
            git push origin HEAD:main
          fi

      - name: Upload v0.3.7 APK
        uses: actions/upload-artifact@v4
        with:
          name: admission-collector-v0.3.7-navigation-watchdog-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
