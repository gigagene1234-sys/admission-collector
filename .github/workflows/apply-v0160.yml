name: Apply Admission Hub v0.16.0

on:
  push:
    branches: [codex/v0160-dashboard-official-login]
    paths:
      - ".github/scripts/patch_v0160.py"
      - ".github/workflows/apply-v0160.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: admission-hub-v0160-apply
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v0160-dashboard-official-login
          fetch-depth: 0
      - name: Apply product patch
        run: python3 .github/scripts/patch_v0160.py
      - name: Commit patched product
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git commit -m "feat: v0.16.0 official dashboard and login recovery"
          git push origin HEAD:codex/v0160-dashboard-official-login
