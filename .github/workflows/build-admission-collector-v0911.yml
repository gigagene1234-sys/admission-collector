name: Build Admission Collector v0.9.11 Mission State Persistence

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-admission-collector-v0911.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}
    outputs:
      source_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply v0.9.11 single-purpose patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/patch_v0911.py
          # Compile-safe rendering of nullable mission origin; this only corrects the
          # persistence payload expression generated by the patch script.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt')
          s=p.read_text()
          old='.put("missionOriginRoute", jinhakMissionOriginRoute.ifBlank { JSONObject.NULL })'
          new='.put("missionOriginRoute", if (jinhakMissionOriginRoute.isBlank()) JSONObject.NULL else jinhakMissionOriginRoute)'
          if old not in s: raise SystemExit('missionOriginRoute compile-fix anchor missing')
          p.write_text(s.replace(old,new,1))
          PY

      - name: Verify only Mission State Persistence changed
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          python3 - <<'PY'
          import subprocess
          allowed={
            'app/src/main/java/com/admissionhub/collector/MainActivity.kt',
            'app/src/main/java/com/admissionhub/collector/jinhak/JinhakMissionTargetLedger.kt',
            'app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt',
            'app/build.gradle.kts',
            'app/src/main/AndroidManifest.xml',
          }
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          extra=changed-allowed
          missing={
            'app/src/main/java/com/admissionhub/collector/MainActivity.kt',
            'app/src/main/java/com/admissionhub/collector/jinhak/JinhakMissionTargetLedger.kt',
            'app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt',
          }-changed
          if extra: raise SystemExit('Unexpected files changed: '+', '.join(sorted(extra)))
          if missing: raise SystemExit('Persistence files not changed: '+', '.join(sorted(missing)))
          print('single-purpose file boundary passed')
          PY

      - name: Verify v0.9.11 persistence invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          m=Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt').read_text()
          l=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakMissionTargetLedger.kt').read_text()
          s=Path('app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt').read_text()
          g=Path('app/build.gradle.kts').read_text()
          manifest=Path('app/src/main/AndroidManifest.xml').read_text()
          req={
            'version':'private const val VERSION = "0.9.11"' in m and 'private const val BUILD_CODE = 109110' in m,
            'gradle':'versionCode = 109110' in g and 'versionName = "0.9.11"' in g,
            'label':'Admission Collector v0.9.11 Mission State Persistence' in manifest,
            'db-v5':'"admission_collector_local_v1.db",\n    null,\n    5' in s,
            'target-table':'CREATE TABLE IF NOT EXISTS jinhak_mission_targets' in s,
            'runtime-table':'CREATE TABLE IF NOT EXISTS jinhak_mission_runtime' in s,
            'monotonic-db':'existing.first > rank' in s and 'state_rank' in s,
            'target-upsert':'fun upsertJinhakMissionTarget' in s,
            'target-load':'fun loadJinhakMissionTargets' in s,
            'runtime-store':'fun storeJinhakMissionRuntime' in s,
            'runtime-load':'fun loadJinhakMissionRuntime' in s,
            'ledger-restore':'fun restorePersisted(payloads: List<JSONObject>)' in l,
            'ledger-monotonic':'private fun canTransition(from: State, to: State)' in l,
            'mutation-hook':'jinhakMissionTargetLedger.setMutationListener' in m,
            'activity-resume-restore':'restoreJinhakMissionPersistence(sessionId, "activity-resume")' in m,
            'batch-start-restore':'restoreJinhakMissionPersistence(it, "batch-start")' in m,
            'post-reset-restore':'restoreJinhakMissionPersistence(it, "post-batch-reset")' in m,
            'checkpoint-runtime':'persistJinhakMissionRuntimeState("runtime-checkpoint")' in m,
            'diagnostic':'missionPersistence' in m,
            'renderer-v0910-preserved':'webview-renderer-recovered-in-place' in m and 'activityRecreated", false' in m,
            'mission-routing-preserved':'originInferredMissionTargets' in m,
            'auth-recovery-preserved':'protected-core-stable' in m and 'scheduleJinhakLoginRecovery' in m,
          }
          failed=[k for k,v in req.items() if not v]
          if failed: raise SystemExit('Missing invariant(s): '+', '.join(failed))
          if 'handler.postDelayed({ recreate() }, 250L)' in m:
            raise SystemExit('Renderer Recovery regressed')
          if '.put("username", credentials.username)' in m or '.put("password", credentials.password)' in m:
            raise SystemExit('credential export invariant failed')
          # State order must be strictly monotonic and terminal states outrank transient states.
          ranks={'pending':0,'clicked':10,'deferred':20,'failed':30,'skipped':40,'confirmed':50}
          assert list(ranks.values()) == sorted(set(ranks.values()))
          assert ranks['confirmed'] > ranks['failed'] > ranks['deferred'] > ranks['clicked'] > ranks['pending']
          print('v0.9.11 persistence invariants passed')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_SECRET"
          STORE_FILE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ANDROID_SIGNING_SECRET -in signing/admission-upload.keystore.enc -out "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Test and build patched source
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify patched APK
        shell: bash
        run: |
          set -euo pipefail
          SRC=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$SRC" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$SRC" | tee patched-badging.txt
          grep -q "versionCode='109110'" patched-badging.txt
          grep -q "versionName='0.9.11'" patched-badging.txt
          grep -q "application-label:'Admission Collector v0.9.11 Mission State Persistence'" patched-badging.txt

      - name: Commit v0.9.11 source
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/admissionhub/collector/MainActivity.kt \
                  app/src/main/java/com/admissionhub/collector/jinhak/JinhakMissionTargetLedger.kt \
                  app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt \
                  app/build.gradle.kts app/src/main/AndroidManifest.xml
          git commit -m "Implement v0.9.11 mission state persistence"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  independent-main-build:
    needs: patch-build-commit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Refresh exact committed main
        run: |
          git fetch origin main
          git reset --hard origin/main
          test "$(git rev-parse HEAD)" = "${{ needs.patch-build-commit.outputs.source_sha }}"
      - name: Reverify committed Mission State Persistence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          m=Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt').read_text()
          l=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakMissionTargetLedger.kt').read_text()
          s=Path('app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt').read_text()
          g=Path('app/build.gradle.kts').read_text()
          assert 'private const val VERSION = "0.9.11"' in m
          assert 'versionCode = 109110' in g
          assert 'CREATE TABLE IF NOT EXISTS jinhak_mission_targets' in s
          assert 'CREATE TABLE IF NOT EXISTS jinhak_mission_runtime' in s
          assert 'fun restorePersisted(payloads: List<JSONObject>)' in l
          assert 'restoreJinhakMissionPersistence(it, "batch-start")' in m
          assert 'webview-renderer-recovered-in-place' in m
          assert 'handler.postDelayed({ recreate() }, 250L)' not in m
          print('committed v0.9.11 verified')
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          STORE_FILE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ANDROID_SIGNING_SECRET -in signing/admission-upload.keystore.enc -out "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build committed main
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify and package final APK
        shell: bash
        run: |
          set -euo pipefail
          SRC=app/build/outputs/apk/debug/app-debug.apk
          OUT=Admission-Collector-v0.9.11-Mission-State-Persistence.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$SRC" | tee apksigner.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$SRC" | tee badging.txt
          grep -q "versionCode='109110'" badging.txt
          grep -q "versionName='0.9.11'" badging.txt
          grep -q "application-label:'Admission Collector v0.9.11 Mission State Persistence'" badging.txt
          cp "$SRC" "$OUT"
          sha256sum "$OUT" | tee Admission-Collector-v0.9.11-Mission-State-Persistence.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: admission-collector-main-v0.9.11-final
          path: |
            Admission-Collector-v0.9.11-Mission-State-Persistence.apk
            Admission-Collector-v0.9.11-Mission-State-Persistence.sha256
            apksigner.txt
            badging.txt
          retention-days: 14
      - name: Publish v0.9.11 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          NOTES="v0.9.11 is intentionally single-purpose: Mission State Persistence. The v0.9.10 real-device export showed a valid 30-target ledger progressing to clicked/failed/confirmed states and then regressing after runtime lifecycle resets, including confirmed=1 -> 0 and identities=30 -> 0. v0.9.11 persists every application mission target in SQLite keyed by unified session and target ID, with monotonic state ranks that prevent lower progress from overwriting confirmed/failed/skipped work. Minimal recovery runtime (active target, current batch target, mission origin/return flag and report bridge context) is stored locally and restored before the first Jinhak batch after Activity/process resume and again after volatile batch reset. Confirmed coverage is rebuilt from persisted targets. Runtime checkpoints also persist the mission cursor. Diagnostics expose aggregate persistence counts only; credentials, cookies and session secrets are never stored in these mission tables or exported. v0.9.10 in-place WebView renderer recovery and all v0.9.9 routing/auth safety invariants remain. No stall-fence, Slow Lane, retry, canonical, analysis or dashboard behavior is intentionally changed. Test/build/signature verification and an independent committed-main rebuild passed. Real-device lifecycle recovery remains to be verified. Commit: $SHA"
          gh release create v0.9.11 Admission-Collector-v0.9.11-Mission-State-Persistence.apk Admission-Collector-v0.9.11-Mission-State-Persistence.sha256 --target "$SHA" --title "Admission Collector v0.9.11 — Mission State Persistence" --notes "$NOTES"
