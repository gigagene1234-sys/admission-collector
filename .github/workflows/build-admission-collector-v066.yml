name: Build Admission Collector v0.6.6 Memory-Safe Autonomous Explorer

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-admission-collector-v066.yml"
      - "scripts/apply_v066.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply v0.6.6 patch
        run: python3 scripts/apply_v066.py

      - name: Verify v0.6.6 source invariants
        shell: bash
        run: |
          set -euo pipefail
          cmp -s MainActivity.kt app/src/main/java/com/admissionhub/collector/MainActivity.kt
          grep -q 'private const val VERSION = "0.6.6"' MainActivity.kt
          grep -q 'private const val BUILD_CODE = 10660' MainActivity.kt
          grep -q 'versionCode = 10660' app/build.gradle.kts
          grep -q 'versionName = "0.6.6"' app/build.gradle.kts
          grep -q 'Admission Collector v0.6.6 Memory-Safe Autonomous Explorer' app/src/main/AndroidManifest.xml
          grep -q 'JINHAK_ABSOLUTE_TARGET_MS = 35_000L' MainActivity.kt
          grep -q 'private fun armJinhakAbsoluteTargetWatchdog' MainActivity.kt
          grep -q 'jinhak-absolute-target-timeout' MainActivity.kt
          grep -q 'private fun stopBatchForUnifiedFinish' MainActivity.kt
          grep -q 'unifiedFinishInProgress' MainActivity.kt
          grep -q 'fullExportMaterializedInMemory' MainActivity.kt
          grep -q 'recordsMaterializedInMemory' MainActivity.kt
          grep -q 'fun writeUnifiedExport' app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt
          grep -q 'SELECT json FROM records WHERE run_id=?' app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt
          grep -q 'Thread {' MainActivity.kt
          grep -q 'version: "0.3.9"' cloudflare/src/index.js

      - name: Verify memory-safety and traversal boundaries
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          m=Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt').read_text()
          a=m.index('    private fun finishUnifiedCollection(')
          b=m.index('    private fun isAdigaBlockingErrorMessage', a)
          finish=m[a:b]
          if 'buildUnifiedExport(' in finish:
              raise SystemExit('full unified materialization still used during finish')
          if 'stopBatch(' in finish:
              raise SystemExit('reentrant heavy stopBatch still used during unified finish')
          for required in ['stopBatchForUnifiedFinish','fullExportMaterializedInMemory','memorySafeFinish']:
              if required not in finish:
                  raise SystemExit(f'missing memory-safe finish marker: {required}')

          a=m.index('    private fun finalizeBatchJson(')
          b=m.index('    private fun collectSnapshot(', a)
          finalize=m[a:b]
          if 'val persistedRecords = localRunId?.let { localStore.loadRecords(it) }' in finalize:
              raise SystemExit('Local-First finalize still unconditionally materializes all records')
          if 'recordsMaterializedInMemory' not in finalize:
              raise SystemExit('summary-only Local-First marker missing')

          if 'armJinhakAbsoluteTargetWatchdog(url)' not in m:
              raise SystemExit('absolute target watchdog not wired into page starts')
          if 'currentBatchTarget ?: expectedUrl' not in m:
              raise SystemExit('absolute watchdog not keyed to batch target')

          snap=Path('app/src/main/java/com/admissionhub/collector/capture/SnapshotScript.kt').read_text()
          a=snap.index('    function departmentContextFor(el,rootText){')
          b=snap.index('    function universityContextFor(el,rootText){', a)
          section=snap[a:b]
          for forbidden in ['previousElementSibling','nextElementSibling','structuredCardText(prev','structuredCardText(next']:
              if forbidden in section:
                  raise SystemExit(f'cross-card department inheritance reintroduced: {forbidden}')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_SECRET"
          STORE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -pass env:ANDROID_SIGNING_SECRET \
            -in signing/admission-upload.keystore.enc \
            -out "$STORE"
          keytool -list -keystore "$STORE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build v0.6.6 APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "versionCode='10660'" /tmp/badging.txt
          grep -q "versionName='0.6.6'" /tmp/badging.txt
          sha256sum "$APK" | tee /tmp/apk.sha256

      - name: Persist generated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MainActivity.kt app/build.gradle.kts app/src/main/AndroidManifest.xml \
            app/src/main/java/com/admissionhub/collector/MainActivity.kt \
            app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt \
            scripts/apply_v066.py
          if git diff --cached --quiet; then
            echo "source already persisted"
          else
            git commit -m "Apply v0.6.6 memory-safe autonomous explorer [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: admission-collector-v0.6.6-memory-safe-autonomous-explorer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
