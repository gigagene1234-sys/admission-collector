name: Read Jinhak Diagnostic

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/read-jinhak-diagnostic.yml"
      - ".diagnostics/jinhak-read-request.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-jinhak-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WORKER_URL: https://admission-collector-offload.gigagene1234.workers.dev
      INGEST_TOKEN: ${{ secrets.ADMISSION_INGEST_TOKEN }}
    steps:
      - name: Read latest Jinhak cloud state
        shell: bash
        run: |
          set -euo pipefail
          test -n "$INGEST_TOKEN"
          mkdir -p out

          read_provider() {
            provider="$1"
            prefix="$2"
            curl -fsS -H "Authorization: Bearer $INGEST_TOKEN" \
              "$WORKER_URL/v1/runs/latest?provider=$provider" > "out/${prefix}-latest.json"
            run_id="$(python3 - "out/${prefix}-latest.json" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding='utf-8') as f: p=json.load(f)
          print(p.get('runId') or '')
          PY
          )"
            python3 - "out/${prefix}-latest.json" "$prefix" <<'PY'
          import json,sys
          path,prefix=sys.argv[1],sys.argv[2]
          with open(path,encoding='utf-8') as f: p=json.load(f)
          print(prefix.upper()+"_LATEST="+json.dumps({
              'runId':p.get('runId'),
              'provider':p.get('provider'),
              'collectorVersion':p.get('collectorVersion'),
              'status':p.get('status'),
              'updatedAt':p.get('updatedAt'),
              'recoveredPending':p.get('recoveredPending'),
          },ensure_ascii=False,separators=(',',':')))
          PY
            if [ -z "$run_id" ]; then
              echo "${prefix^^}_NO_RUN"
              return 0
            fi
            curl -fsS -H "Authorization: Bearer $INGEST_TOKEN" \
              "$WORKER_URL/v1/runs/$run_id/status" > "out/${prefix}-status.json"
            python3 - "out/${prefix}-status.json" "$prefix" <<'PY'
          import json,sys
          path,prefix=sys.argv[1],sys.argv[2]
          with open(path,encoding='utf-8') as f: p=json.load(f)
          run=p.get('run') or {}
          errors=p.get('recentErrors') or []
          print(prefix.upper()+"_STATUS="+json.dumps({
              'run_id':run.get('run_id'),
              'provider':run.get('provider'),
              'collector_version':run.get('collector_version'),
              'status':run.get('status'),
              'uploaded_chunks':run.get('uploaded_chunks'),
              'processed_chunks':run.get('processed_chunks'),
              'record_count':run.get('record_count'),
              'accepted_records':run.get('accepted_records'),
              'error_count':run.get('error_count'),
              'created_at':run.get('created_at'),
              'updated_at':run.get('updated_at'),
              'metadata_json':run.get('metadata_json'),
              'recent_error_count':len(errors),
          },ensure_ascii=False,separators=(',',':')))
          for i,e in enumerate(errors[-20:]):
              detail=e.get('detail_json')
              try: detail=json.loads(detail) if isinstance(detail,str) else detail
              except Exception: pass
              print(prefix.upper()+f"_ERROR_{i}="+json.dumps({
                  'error_type':e.get('error_type'),
                  'created_at':e.get('created_at'),
                  'detail':detail,
              },ensure_ascii=False,separators=(',',':')))
          PY
          }

          read_provider "jinhak" "jinhak"
          read_provider "jinhak-diagnostic" "jinhak-diagnostic"
