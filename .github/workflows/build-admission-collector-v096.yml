name: Build Admission Collector v0.9.6 Auth Resume Fence

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-admission-collector-v096.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}
    outputs:
      source_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply v0.9.6 patch
        run: python3 .github/scripts/patch_v096.py
      - name: Verify v0.9.6 source invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          m=Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt').read_text()
          g=Path('app/build.gradle.kts').read_text()
          manifest=Path('app/src/main/AndroidManifest.xml').read_text()
          cred=Path('app/src/main/java/com/admissionhub/collector/session/CredentialVault.kt').read_text()
          snap=Path('app/src/main/java/com/admissionhub/collector/capture/SnapshotScript.kt').read_text()
          adapter=Path('app/src/main/java/com/admissionhub/collector/provider/JinhakAdapter.kt').read_text()
          year=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakReportYearGuard.kt').read_text()
          topology=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakSiteTopology.kt').read_text()
          req={
            'version':'private const val VERSION = "0.9.6"' in m,
            'build':'private const val BUILD_CODE = 10960' in m,
            'gradle':'versionCode = 10960' in g and 'versionName = "0.9.6"' in g,
            'label':'Admission Collector v0.9.6 Auth Resume Fence' in manifest,
            'surface-probe':'private fun probeLoginSurface' in m,
            'page-finished-probe':'scheduleLoginSurfaceDetection(provider, "page-finished")' in m,
            'no-forced-login-url':'webView.loadUrl(providerLoginUrl' not in m,
            'no-legacy-opener':'openStartupLoginPage(' not in m,
            'batch-auth-gate':'continueBatchAfterRenderedLoginGuard(url, 0)' in m,
            'batch-pause-preserves-target':'pauseBatchForRenderedLoginSurface' in m and 'currentTarget' in m,
            'cross-version-fence':'cross-version-resume-blocked' in m,
            'auth-telemetry':'credentialAutoLoginSuccesses' in m and 'loginSurfaceDetections' in m,
            'credential-vault':'AES/GCM/NoPadding' in cred and 'admission_collector_credentials_v1' in cred,
            'same-card':'unique-card-container' in snap,
            'jinhak-broad-off':'override val supportsBatchCrawl = false' in adapter,
            'saved-app-seed':'/four-year-university/library' in topology,
            'year-guard':'historical-multi-year-or-unresolved' in year,
            'semantic-guard':'applicantAverageGrade' in adapter,
          }
          failed=[k for k,v in req.items() if not v]
          if failed: raise SystemExit('Missing invariant(s): '+', '.join(failed))
          if '.put("username", credentials.username)' in m or '.put("password", credentials.password)' in m:
            raise SystemExit('credential value leak into runtime JSON')
          if '.put("cookie"' in m.lower() or '.put("sessiontoken"' in m.lower():
            raise SystemExit('session secret leak into diagnostics')
          print('v0.9.6 source invariants passed')
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_SECRET"
          STORE_FILE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ANDROID_SIGNING_SECRET -in signing/admission-upload.keystore.enc -out "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Test and build patched source
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify patched APK
        shell: bash
        run: |
          set -euo pipefail
          SRC=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$SRC" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$SRC" | tee patched-badging.txt
          grep -q "versionCode='10960'" patched-badging.txt
          grep -q "versionName='0.9.6'" patched-badging.txt
          grep -q "application-label:'Admission Collector v0.9.6 Auth Resume Fence'" patched-badging.txt
      - name: Commit v0.9.6 source
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/admissionhub/collector/MainActivity.kt app/build.gradle.kts app/src/main/AndroidManifest.xml
          git commit -m "Implement v0.9.6 auth resume fence"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  independent-main-build:
    needs: patch-build-commit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Refresh exact committed main
        run: |
          git fetch origin main
          git reset --hard origin/main
          test "$(git rev-parse HEAD)" = "${{ needs.patch-build-commit.outputs.source_sha }}"
      - name: Reverify committed source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          m=Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt').read_text()
          assert 'private const val VERSION = "0.9.6"' in m
          assert 'continueBatchAfterRenderedLoginGuard(url, 0)' in m
          assert 'cross-version-resume-blocked' in m
          assert 'credentialAutoLoginSuccesses' in m
          assert 'webView.loadUrl(providerLoginUrl' not in m
          assert 'openStartupLoginPage(' not in m
          print('committed v0.9.6 verified')
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          STORE_FILE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ANDROID_SIGNING_SECRET -in signing/admission-upload.keystore.enc -out "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build committed main
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify and package final APK
        shell: bash
        run: |
          set -euo pipefail
          SRC=app/build/outputs/apk/debug/app-debug.apk
          OUT=Admission-Collector-v0.9.6-Auth-Resume-Fence.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$SRC" | tee apksigner.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$SRC" | tee badging.txt
          grep -q "versionCode='10960'" badging.txt
          grep -q "versionName='0.9.6'" badging.txt
          grep -q "application-label:'Admission Collector v0.9.6 Auth Resume Fence'" badging.txt
          cp "$SRC" "$OUT"
          sha256sum "$OUT" | tee Admission-Collector-v0.9.6-Auth-Resume-Fence.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: admission-collector-main-v0.9.6-final
          path: |
            Admission-Collector-v0.9.6-Auth-Resume-Fence.apk
            Admission-Collector-v0.9.6-Auth-Resume-Fence.sha256
            apksigner.txt
            badging.txt
          retention-days: 14
      - name: Publish v0.9.6 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          NOTES="v0.9.6 is driven by the real-device mixed v0.9.3/v0.9.5 export. It blocks cross-version resume so a new collector version always gets a clean unified session while preserving the old local data. It also places a rendered-login-surface gate before batch snapshot processing: when a protected target naturally renders a login form, the batch pauses without changing currentBatchTarget, local encrypted credentials are submitted only on that rendered form, and successful login resumes the exact interrupted target. No provider login URL is proactively loaded or clicked. Final diagnostics now expose login-surface detections, credential auto-login attempts/submissions/successes/failures, rendered-login batch pauses and cross-version resume blocks without exporting credentials/cookies/tokens. Existing session bundle, mission bootstrap, same-card binding, historical-year guard, applicantAverageGrade guard, website-first Live bridge, and supportsBatchCrawl=false remain. Tests/build/signature verification and independent committed-main rebuild passed. Real-device E2E remains to be verified. Commit: $SHA"
          gh release create v0.9.6 Admission-Collector-v0.9.6-Auth-Resume-Fence.apk Admission-Collector-v0.9.6-Auth-Resume-Fence.sha256 --target "$SHA" --title "Admission Collector v0.9.6 — Auth Resume Fence" --notes "$NOTES"
