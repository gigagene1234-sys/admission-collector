name: Inspect Jinhak Cloud Recovery Temp

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/inspect-jinhak-cloud-recovery-temp.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: cloudflare
        run: npm install --no-audit --no-fund
      - name: Inspect Jinhak cloud state
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          echo '=== JINHAK RECORD TOTAL ==='
          npx wrangler d1 execute admission-collector-db --remote --command "SELECT COUNT(*) AS total_jinhak_records, COUNT(DISTINCT run_id) AS run_count, MIN(created_at) AS first_created_at, MAX(created_at) AS last_created_at FROM records WHERE provider='jinhak';" --json
          echo '=== JINHAK RECORDS BY RUN ==='
          npx wrangler d1 execute admission-collector-db --remote --command "SELECT run_id, COUNT(*) AS records_count, MIN(created_at) AS first_created_at, MAX(created_at) AS last_created_at FROM records WHERE provider='jinhak' GROUP BY run_id ORDER BY last_created_at DESC LIMIT 20;" --json
          echo '=== JINHAK RELATED RUNS ==='
          npx wrangler d1 execute admission-collector-db --remote --command "SELECT run_id,provider,collector_version,status,created_at,updated_at,uploaded_chunks,processed_chunks,received_records,unique_records,duplicate_records,error_count FROM runs WHERE provider LIKE 'jinhak%' OR provider LIKE 'unified%' OR provider='runtime-diagnostic' ORDER BY updated_at DESC LIMIT 20;" --json
