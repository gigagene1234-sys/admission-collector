name: Apply Admission Hub v0.14 Product Patch

on:
  push:
    branches: [codex/v0140-adiga-xlsx]
    paths:
      - ".github/workflows/apply-v0140.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: admission-hub-v0140-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded v0.14 source patch
        run: python3 .github/scripts/patch_v0140.py
      - name: Verify patch scope before commit
        shell: bash
        run: |
          set -euo pipefail
          git diff -- app/src/main/java/com/admissionhub/collector/MainActivity.kt app/src/main/java/com/admissionhub/collector/hub/HubDashboardModel.kt app/src/main/java/com/admissionhub/collector/score/ApplicationReviewEngine.kt app/src/main/AndroidManifest.xml app/build.gradle.kts
          test -z "$(git diff --name-only | grep -vE '^(app/src/main/java/com/admissionhub/collector/MainActivity.kt|app/src/main/java/com/admissionhub/collector/hub/HubDashboardModel.kt|app/src/main/java/com/admissionhub/collector/score/ApplicationReviewEngine.kt|app/src/main/AndroidManifest.xml|app/build.gradle.kts)$' || true)"
      - name: Commit product source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/admissionhub/collector/MainActivity.kt \
                  app/src/main/java/com/admissionhub/collector/hub/HubDashboardModel.kt \
                  app/src/main/java/com/admissionhub/collector/score/ApplicationReviewEngine.kt \
                  app/src/main/AndroidManifest.xml app/build.gradle.kts
          git diff --cached --exit-code && { echo 'Expected v0.14 patch produced no changes'; exit 1; } || true
          git commit -m "feat: wire v0.14 Adiga diagnostics and XLSX activity"
          git push origin HEAD:codex/v0140-adiga-xlsx
