name: Apply Admission Hub v0.15.0 Full Auto Evidence

on:
  push:
    branches: [codex/v0150-full-auto-evidence]
    paths:
      - ".github/scripts/patch_v0150.py"
      - ".github/workflows/apply-v0150.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: admission-hub-v0150-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize patch runner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/patch_v0150.py')
          s=p.read_text()
          old='s = replace_once(s, \'text = "통합 동기화 시작"\', \'text = "어디가 + 진학사 자동 수집"\', \'primary unified label\')'
          new='s = s.replace(\'text = "통합 동기화 시작"\', \'text = "어디가 + 진학사 자동 수집"\')'
          if old not in s:
              raise SystemExit('primary unified label normalization anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Apply v0.15.0 product patch
        run: python3 .github/scripts/patch_v0150.py
      - name: Verify focused source diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only
          grep -q 'private const val VERSION = "0.15.0"' app/src/main/java/com/admissionhub/collector/MainActivity.kt
          grep -q 'versionName = "0.15.0"' app/build.gradle.kts
          grep -q 'AUTO_RECOGNIZED_DRAFT' app/src/main/java/com/admissionhub/collector/score/UnifiedExcelScoreActivity.kt
          grep -q 'OfficialEvidenceAutoLinker.relinkSelected' app/src/main/java/com/admissionhub/collector/score/AdigaAutoScoreMaterializer.kt
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app .github/scripts/patch_v0150.py
          git diff --cached --quiet && { echo 'Expected v0.15.0 product changes'; exit 1; }
          git commit -m "feat: v0.15.0 full automatic dual-provider evidence flow"
          git pull --rebase origin codex/v0150-full-auto-evidence
          git push origin HEAD:codex/v0150-full-auto-evidence
