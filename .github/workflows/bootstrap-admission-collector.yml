name: Build Admission Collector

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply staged MainActivity
        shell: bash
        run: |
          set -euo pipefail

          test -f MainActivity.kt
          mkdir -p app/src/main/java/com/admissionhub/collector
          cp MainActivity.kt app/src/main/java/com/admissionhub/collector/MainActivity.kt

          SOURCE_VERSION="$(grep -oP 'private const val VERSION = "\K[^"]+' MainActivity.kt | head -n1)"
          GRADLE_VERSION="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -n1)"

          test -n "$SOURCE_VERSION"
          test -n "$GRADLE_VERSION"
          test "$SOURCE_VERSION" = "$GRADLE_VERSION"

          echo "source/gradle version verified: $SOURCE_VERSION"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: admission-collector-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
