name: Build Admission Hub v0.16.1 Real Device Fix

on:
  push:
    branches: [codex/v0160-dashboard-official-login]
    paths:
      - "app/**"
      - ".github/scripts/verify_v0161.py"
      - ".github/scripts/verify_apk_v0161.sh"
      - ".github/workflows/build-admission-hub-v0161.yml"
      - "docs/releases/v0.16.1.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: admission-hub-v0161
  cancel-in-progress: true

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}
      APK_NAME: Admission-Hub-v0.16.1-Real-Device-Fix.apk
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify v0.16.1 product contracts
        run: python3 .github/scripts/verify_v0161.py

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_SECRET"
          STORE_FILE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ANDROID_SIGNING_SECRET -in signing/admission-upload.keystore.enc -out "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Test all application and regression contracts
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Compile signed product
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK package version label and stable signer
        run: bash .github/scripts/verify_apk_v0161.sh

      - name: Clean rebuild and retest exact committed source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git reset --hard "$GITHUB_SHA"
          python3 .github/scripts/verify_v0161.py
          gradle --no-daemon clean :app:testDebugUnitTest :app:assembleDebug
          bash .github/scripts/verify_apk_v0161.sh
          git diff --exit-code

      - name: Package APK and verification report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/$APK_NAME"
          (cd dist && sha256sum "$APK_NAME" > "$APK_NAME.sha256")
          python3 - <<'PY'
          import glob,json,os,xml.etree.ElementTree as E
          suites=[E.parse(f).getroot() for f in glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml')]
          counts={k:sum(int(s.get(k,'0')) for s in suites) for k in ['tests','failures','errors','skipped']}
          assert counts['tests']>=99, counts
          assert counts['failures']==counts['errors']==counts['skipped']==0, counts
          report={
            'productCommit':os.environ['GITHUB_SHA'],
            'versionName':'0.16.1','versionCode':116100,'tests':counts,
            'signerSha256':'db6cd5efceda108657662d06f857e5f0277301cb6ab97a75c8a01994c96e4995',
            'exactCommittedSourceRebuild':True,
            'realDeviceEvidenceAddressed':True,
            'legacyImportedTranscriptReassessedAtCalculation':True,
            'transcriptRowsOrGradesInferred':False,
            'jinhakSameUrlProductDomFence':True,
            'jinhakHigh3CredentialPreflight':True,
            'jinhakReauthCircuitMaxCycles':3,
            'urlLowerGradeFence':True,
            'officialPublishedFallback':True,
            'officialFallbackUsesUniversityOrAdigaOfficialSourcesOnly':True,
            'officialNonNumericAvailabilityStates':['officially-suppressed','new-program-no-prior-result'],
            'jinhakPromotedToOfficial':False,
            'historicalBindingRelaxed':False,
            'slotsMutatedByOfficialMaterializer':False,
            'probabilityInferred':False,
            'deviceAcceptance':'pending-real-galaxy-high3-login-conversion-and-official-outcome'
          }
          open('dist/verification-v0.16.1.json','w').write(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(report,ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: admission-hub-v0.16.1-real-device-fix
          path: |
            dist/*
            app/build/test-results/testDebugUnitTest/*.xml

      - name: Publish verified v0.16.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v0.16.1 >/dev/null 2>&1 && gh release delete v0.16.1 -y --cleanup-tag || true
          gh release create v0.16.1 "dist/$APK_NAME" "dist/$APK_NAME.sha256" dist/verification-v0.16.1.json \
            --target "$GITHUB_SHA" --title "Admission Hub v0.16.1 — Real-device High3 + Official Evidence Repair" \
            --notes-file docs/releases/v0.16.1.md
