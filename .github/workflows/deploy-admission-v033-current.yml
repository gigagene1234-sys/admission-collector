name: Deploy Admission Collector v0.3.3 Current Worker

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-admission-v033-current.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-current:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ADMISSION_INGEST_TOKEN: ${{ secrets.ADMISSION_INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Cloudflare dependencies
        working-directory: cloudflare
        run: npm install --no-audit --no-fund
      - name: Deploy current Worker and secret
        working-directory: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          node --check src/index.js
          npx wrangler deploy 2>&1 | tee /tmp/deploy.log
          printf '%s' "$ADMISSION_INGEST_TOKEN" | npx wrangler secret put INGEST_TOKEN
      - name: Verify v0.3.3 recovery API on production
        shell: bash
        run: |
          set -euo pipefail
          WORKER_URL="https://admission-collector-offload.gigagene1234.workers.dev"
          curl --retry 6 --retry-delay 2 --retry-all-errors --fail --silent --show-error "$WORKER_URL/health" > /tmp/health.json
          cat /tmp/health.json
          node -e "const x=require('/tmp/health.json'); if(!x.ok || x.version!=='0.3.3') { console.error(x); process.exit(1) }"
          curl --retry 4 --retry-delay 2 --retry-all-errors --fail --silent --show-error \
            "$WORKER_URL/v1/runs/latest?provider=adiga" \
            -H "Authorization: Bearer $ADMISSION_INGEST_TOKEN" > /tmp/latest.json
          cat /tmp/latest.json
          node -e "const x=require('/tmp/latest.json'); if(!Object.prototype.hasOwnProperty.call(x,'runId')) { console.error(x); process.exit(1) }"
          echo "Production v0.3.3 recovery API verified."
