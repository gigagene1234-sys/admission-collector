name: Harden v0.3.8 Legacy Client Compatibility

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/harden-v038-legacy-client.yml"
      - "scripts/harden_v038_legacy.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply compatibility hardening
        run: python3 scripts/harden_v038_legacy.py
      - name: Validate Worker
        run: |
          node --check cloudflare/src/index.js
          grep -q 'scopeProviderFingerprint' cloudflare/src/index.js
          test -f cloudflare/migrations/0003_repair_legacy_adiga_fingerprints.sql
      - name: Persist compatibility hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/src/index.js cloudflare/migrations/0003_repair_legacy_adiga_fingerprints.sql
          git commit -m "Harden v0.3.8 against legacy Adiga fingerprints"
          git push origin HEAD:main
