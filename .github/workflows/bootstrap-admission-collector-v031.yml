name: Build Admission Collector

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply v0.3.1 source bundle when present
        shell: bash
        run: |
          set -euo pipefail

          BUNDLE="Admission-Collector-v0.3.1-source.zip"
          if [ -f "$BUNDLE" ]; then
            rm -rf /tmp/admission-collector-v031
            mkdir -p /tmp/admission-collector-v031
            unzip -q -o "$BUNDLE" -d /tmp/admission-collector-v031
            rsync -a /tmp/admission-collector-v031/ ./
            echo "V031_BUNDLE_APPLIED=1" >> "$GITHUB_ENV"
          else
            echo "V031_BUNDLE_APPLIED=0" >> "$GITHUB_ENV"
          fi

          test -f MainActivity.kt
          test -f app/src/main/java/com/admissionhub/collector/MainActivity.kt
          test -f app/src/main/java/com/admissionhub/collector/provider/AdigaAdapter.kt
          test -f app/src/main/java/com/admissionhub/collector/provider/JinhakAdapter.kt
          test -f app/src/main/java/com/admissionhub/collector/provider/ProviderAdapter.kt
          test -f app/src/main/java/com/admissionhub/collector/capture/SnapshotScript.kt
          test -f app/src/main/java/com/admissionhub/collector/parser/GenericAdmissionParser.kt
          test -f app/src/main/java/com/admissionhub/collector/parser/RecordUtils.kt

          SOURCE_VERSION="$(grep -oP 'private const val VERSION = "\K[^"]+' MainActivity.kt | head -n1)"
          NESTED_VERSION="$(grep -oP 'private const val VERSION = "\K[^"]+' app/src/main/java/com/admissionhub/collector/MainActivity.kt | head -n1)"
          GRADLE_VERSION="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -n1)"

          test -n "$SOURCE_VERSION"
          test "$SOURCE_VERSION" = "$NESTED_VERSION"
          test "$SOURCE_VERSION" = "$GRADLE_VERSION"
          test "$SOURCE_VERSION" = "0.3.1"
          cmp -s MainActivity.kt app/src/main/java/com/admissionhub/collector/MainActivity.kt

          echo "COLLECTOR_VERSION=$SOURCE_VERSION" >> "$GITHUB_ENV"
          echo "v0.3.1 source verified"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Commit verified v0.3.1 source
        if: env.V031_BUNDLE_APPLIED == '1'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add MainActivity.kt app/build.gradle.kts app/src/main/java/com/admissionhub/collector
          git rm -f Admission-Collector-v0.3.1-source.zip

          if git diff --cached --quiet; then
            echo "No v0.3.1 source changes to commit"
          else
            git commit -m "Apply v0.3.1 collector improvements [skip ci]"
            git push
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: admission-collector-v0.3.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
