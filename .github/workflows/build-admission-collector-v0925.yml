name: Build Admission Collector v0.9.25 Mission Coverage Terminal Seal

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-admission-collector-v0925.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair patch helper and apply v0.9.25
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/patch_v0925.py')
          s=p.read_text()
          start=s.index("store = replace_once(\n    store,\n    '    private fun nullableInt(obj: JSONObject, key: String): Int? =\\n',")
          end=s.index("store = replace_once(\n    store,\n    '        out.put(\"jinhakDiagnosticsSummary\"")
          replacement='''store = replace_once(\n    store,\n    '            .put("sessionSecretStored", false)\\n    }\\n\\n    private fun nullableInt',\n    '            .put("sessionSecretStored", false)\\n            .put("coverage", jinhakMissionCoveragePersistenceSummary(sessionId))\\n    }\\n\\n    private fun nullableInt',\n    'mission persistence summary coverage'\n)\nstore = replace_once(\n    store,\n    '    private fun nullableInt(obj: JSONObject, key: String): Int? =\\n',\n    coverage_methods + '    private fun nullableInt(obj: JSONObject, key: String): Int? =\\n',\n    'coverage persistence methods'\n)\n'''
          p.write_text(s[:start]+replacement+s[end:])
          PY
          python3 .github/scripts/patch_v0925.py
          python3 - <<'PY'
          from pathlib import Path
          m=Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt')
          s=m.read_text()
          old='''        jinhakApplicationMissionReturns += 1\n        recordRuntimeEvent("jinhak-application-mission-return", JSONObject()'''
          new='''        jinhakApplicationMissionReturns += 1\n        handler.post { maybeSealJinhakCoreCoverage("mission-return") }\n        recordRuntimeEvent("jinhak-application-mission-return", JSONObject()'''
          if s.count(old) != 1: raise SystemExit('mission-return closure hook mismatch')
          s=s.replace(old,new,1)
          m.write_text(s)

          c=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakMissionCellSupervisor.kt')
          cs=c.read_text()
          bad='terminalReason.ifBlank { JSONObject.NULL }'
          if bad not in cs: raise SystemExit('terminalReason hotfix anchor missing')
          cs=cs.replace(bad, 'if (terminalReason.isBlank()) JSONObject.NULL else terminalReason', 1)
          c.write_text(cs)

          s=m.read_text()
          old='''.put("coveragePersistence", localStore.jinhakMissionCoveragePersistenceSummary(sessionId)),\n                    false\n                )'''
          new='''.put("coveragePersistence", localStore.jinhakMissionCoveragePersistenceSummary(sessionId)),\n                    false,\n                    false\n                )'''
          if s.count(old) != 1: raise SystemExit('terminal recordSyncState hotfix anchor missing')
          m.write_text(s.replace(old,new,1))
          PY

      - name: Verify source architecture and roadmap invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          m=Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt').read_text()
          s=Path('app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt').read_text()
          c=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakMissionCellSupervisor.kt').read_text()
          cov=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakMissionCoverageLedger.kt').read_text()
          g=Path('app/build.gradle.kts').read_text()
          manifest=Path('app/src/main/AndroidManifest.xml').read_text()
          j=Path('app/src/main/java/com/admissionhub/collector/provider/JinhakAdapter.kt').read_text()
          req={
            'version':'private const val VERSION = "0.9.25"' in m and 'private const val BUILD_CODE = 109250' in m,
            'gradle':'versionCode = 109250' in g and 'versionName = "0.9.25"' in g,
            'label':'Admission Collector v0.9.25 Mission Coverage Terminal Seal' in manifest,
            'coverage-ledger':'class JinhakMissionCoverageLedger' in cov and 'CORE_LANES' in cov,
            'sqlite-coverage':'jinhak_mission_coverage' in s and 'upsertJinhakMissionCoverage' in s and 'loadJinhakMissionCoverage' in s,
            'coverage-restore':'restoreJinhakMissionCoveragePersistence' in m,
            'coverage-closure':'maybeSealJinhakCoreCoverage' in m and 'jinhak-core-coverage-closure' in m,
            'terminal-seal':'sealJinhakTerminalState' in m and 'JINHAK_TERMINAL_SEAL' in m and 'fun sealComplete' in c,
            'phase7-audit':'coreCoverageAudit' in m and 'missingByLane' in cov,
            'v0924-report-bridge':'inheritedReportLaneActions' in m and 'report-lane-navigation' in Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakAgentNavigator.kt').read_text(),
            'v0923-auth':'finishJinhakPostMissionLoginIfReady' in m,
            'v0922-stability':'JINHAK_SINGLE_WEBVIEW_STABILITY_MODE = true' in m,
            'adapter':'override val supportsBatchCrawl = false' in j and 'override val supportsUserSessionMissionTraversal = true' in j,
          }
          failed=[k for k,v in req.items() if not v]
          if failed: raise SystemExit('Missing invariant(s): '+', '.join(failed))
          forbidden=['.put("password", credentials.password)', '.putString("processCookie"', '.putString("processToken"']
          hits=[x for x in forbidden if x in m]
          if hits: raise SystemExit('privacy invariant failed: '+', '.join(hits))
          print('v0.9.25 roadmap/source invariants passed')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_SECRET"
          STORE_FILE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ANDROID_SIGNING_SECRET -in signing/admission-upload.keystore.enc -out "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile patched source
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify patched APK metadata and signer
        shell: bash
        run: |
          set -euo pipefail
          SRC=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$SRC" | tee patched-apksigner.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$SRC" | tee patched-badging.txt
          grep -q "versionCode='109250'" patched-badging.txt
          grep -q "versionName='0.9.25'" patched-badging.txt
          grep -q "application-label:'Admission Collector v0.9.25 Mission Coverage Terminal Seal'" patched-badging.txt
          grep -qi "db6cd5efceda108657662d06f857e5f0277301cb6ab97a75c8a01994c96e4995" patched-apksigner.txt

      - name: Commit v0.9.25 product source
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/admissionhub/collector/MainActivity.kt \
            app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt \
            app/src/main/java/com/admissionhub/collector/jinhak/JinhakMissionCellSupervisor.kt \
            app/src/main/java/com/admissionhub/collector/jinhak/JinhakMissionCoverageLedger.kt \
            app/build.gradle.kts \
            app/src/main/AndroidManifest.xml
          git commit -m "Implement v0.9.25 Mission Coverage Terminal Seal"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Rebuild exact committed main
        shell: bash
        run: |
          set -euo pipefail
          SHA='${{ steps.commit.outputs.sha }}'
          git fetch origin main
          git reset --hard origin/main
          test "$(git rev-parse HEAD)" = "$SHA"
          gradle --no-daemon :app:assembleDebug

      - name: Package final APK
        shell: bash
        run: |
          set -euo pipefail
          SRC=app/build/outputs/apk/debug/app-debug.apk
          OUT=Admission-Collector-v0.9.25-Mission-Coverage-Terminal-Seal.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$SRC" | tee apksigner.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$SRC" | tee badging.txt
          grep -q "versionCode='109250'" badging.txt
          grep -q "versionName='0.9.25'" badging.txt
          grep -q "application-label:'Admission Collector v0.9.25 Mission Coverage Terminal Seal'" badging.txt
          grep -qi "db6cd5efceda108657662d06f857e5f0277301cb6ab97a75c8a01994c96e4995" apksigner.txt
          cp "$SRC" "$OUT"
          sha256sum "$OUT" | tee Admission-Collector-v0.9.25-Mission-Coverage-Terminal-Seal.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: admission-collector-main-v0.9.25-final
          path: |
            Admission-Collector-v0.9.25-Mission-Coverage-Terminal-Seal.apk
            Admission-Collector-v0.9.25-Mission-Coverage-Terminal-Seal.sha256
            apksigner.txt
            badging.txt
          retention-days: 14

      - name: Publish v0.9.25 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          NOTES="v0.9.25 follows the v0.9.24 real-device result where all 27 saved applications obtained saved-application + current-prediction + mock-support + actual-admit + score-analysis coverage, but the crawl continued into a generic tail, incurred a renderer crash/auth redirect, and exported completed session state while mission cells still looked active. This release persists each confirmed application/lane in SQLite, restores that coverage after process death, adds a Phase-7-style core coverage audit, ends the Jinhak crawl once all discovered application identities have the five proven core lanes and the navigation target ledger has no outstanding target, and terminal-seals action/snapshot ownership before final diagnostics. A final JINHAK_TERMINAL_SEAL summary records clean process-journal state for future progress UI/resume logic. v0.9.24 report-lane binding, v0.9.23 auth closure, v0.9.22 single-WebView stability, same-card rules, observation preservation, supportsBatchCrawl=false and credential/session privacy safeguards remain preserved. Commit: $SHA"
          gh release create v0.9.25 Admission-Collector-v0.9.25-Mission-Coverage-Terminal-Seal.apk Admission-Collector-v0.9.25-Mission-Coverage-Terminal-Seal.sha256 --target "$SHA" --title "Admission Collector v0.9.25 — Mission Coverage Terminal Seal" --notes "$NOTES"
