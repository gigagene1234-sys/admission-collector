name: Build Admission Collector v0.9.20 Crash-Safe Checkpoint

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-admission-collector-v0920.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}
    outputs:
      source_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply v0.9.20 crash-safe checkpoint patch
        run: python3 .github/scripts/patch_v0920.py

      - name: Disambiguate renderer cooldown callback label
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt')
          s=p.read_text()
          old='''                        handler.postDelayed({
                            if (runtimeRendererCircuitGeneration != circuitGeneration ||
                                !unifiedRunning || provider != ProviderId.JINHAK) return@postDelayed'''
          new='''                        handler.postDelayed(resumeRendererCircuit@{
                            if (runtimeRendererCircuitGeneration != circuitGeneration ||
                                !unifiedRunning || provider != ProviderId.JINHAK) return@resumeRendererCircuit'''
          if s.count(old) != 1:
              raise SystemExit(f'renderer label anchor count={s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY

      - name: Verify bounded change surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          allowed={
            'app/src/main/java/com/admissionhub/collector/MainActivity.kt',
            'app/src/main/java/com/admissionhub/collector/cloud/CloudOffloadCoordinator.kt',
            'app/build.gradle.kts',
            'app/src/main/AndroidManifest.xml',
            '.github/workflows/read-jinhak-diagnostic.yml',
          }
          extra=changed-allowed
          missing=allowed-changed
          if extra: raise SystemExit('Unexpected files changed: '+', '.join(sorted(extra)))
          if missing: raise SystemExit('Required files not changed: '+', '.join(sorted(missing)))
          print('v0.9.20 file boundary passed')
          PY

      - name: Verify v0.9.20 invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          m=Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt').read_text()
          c=Path('app/src/main/java/com/admissionhub/collector/cloud/CloudOffloadCoordinator.kt').read_text()
          a=Path('app/src/main/java/com/admissionhub/collector/provider/JinhakAdapter.kt').read_text()
          p=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakSlowLanePool.kt').read_text()
          l=Path('app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt').read_text()
          s=Path('app/src/main/java/com/admissionhub/collector/capture/SnapshotScript.kt').read_text()
          g=Path('app/build.gradle.kts').read_text()
          manifest=Path('app/src/main/AndroidManifest.xml').read_text()
          rd=Path('.github/workflows/read-jinhak-diagnostic.yml').read_text()
          req={
            'version':'private const val VERSION = "0.9.20"' in m and 'private const val BUILD_CODE = 109200' in m,
            'gradle':'versionCode = 109200' in g and 'versionName = "0.9.20"' in g,
            'label':'Admission Collector v0.9.20 Crash-Safe Checkpoint' in manifest,
            'jinhak-no-batch':'supportsBatchCrawl = false' in a,
            'jinhak-mission':'supportsUserSessionMissionTraversal = true' in a,
            'cloud-checkpoint':'fun sendRecordCheckpoint(' in c and 'crash-safe-record-checkpoint' in c,
            'cloud-run-isolation':'recordCheckpointRunIds' in c and 'pendingRecordCheckpoints' in c,
            'three-checkpoints':m.count('checkpointJinhakCaptureToCloud("') == 3,
            'checkpoint-record':'jinhak-capture-checkpoint' in m and 'rawEvidence", digest.toString()' in m,
            'renderer-window':'JINHAK_RENDERER_CRASH_WINDOW_MS = 90_000L' in m,
            'renderer-cooldown':'JINHAK_RENDERER_CIRCUIT_COOLDOWN_MS = 30_000L' in m,
            'renderer-bounded':'MAX_JINHAK_RENDERER_CIRCUIT_BREAKS_PER_SESSION = 2' in m,
            'renderer-events':'jinhak-renderer-circuit-paused' in m and 'jinhak-renderer-circuit-resume' in m,
            'renderer-label':'resumeRendererCircuit@{' in m and 'return@resumeRendererCircuit' in m,
            'mission-cell-preserved':'jinhakMissionCells.onRendererGone' in m and 'missionCells' in m,
            'auth-proof-preserved':'persistJinhakAuthProofCheckpoint' in m and 'restoreJinhakAuthProofCheckpoint' in m,
            'target-redirect-preserved':'quarantineJinhakTargetSpecificAuthRedirect' in m,
            'mission-stall-preserved':'recoverOrStopJinhakMissionStall' in m,
            'renderer-slow-lane-preserved':'const val DEFAULT_MAX_WORKERS = 1' in p and 'rendererCircuitOpen' in p,
            'mission-persistence-preserved':'CREATE TABLE IF NOT EXISTS jinhak_mission_targets' in l and 'monotonicStateGuard' in l,
            'same-card-preserved':'same-card-action-not-found' in m and 'MAX_JINHAK_SAME_CARD_REPLAY_ATTEMPTS = 3' in m,
            'susi-core-preserved':'isDefaultSusiCoreTraversalUrl' in m,
            'snapshot-privacy':'safeCloneText' in s and 'input,textarea,select,option,form' in s,
            'checkpoint-privacy':'browserSessionMaterialAccepted", false' in c and 'credentialExported", false' in c and 'sessionSecretExported", false' in c,
            'diagnostic-file-parse-staged':'out/status.json' in rd and 'json.load(f)' in rd and 'python3 - "$status"' not in rd,
          }
          failed=[k for k,v in req.items() if not v]
          if failed: raise SystemExit('Missing invariant(s): '+', '.join(failed))
          forbidden=[
            '.put("username", credentials.username)',
            '.put("password", credentials.password)',
            '.putString("username",',
            '.putString("password",',
            '.put("cookie",',
            '.put("localStorage",',
            '.put("sessionStorage",',
          ]
          hits=[x for x in forbidden if x in m or x in c]
          if hits: raise SystemExit('credential/session export invariant failed: '+', '.join(hits))
          print('v0.9.20 invariants passed')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_SECRET"
          STORE_FILE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ANDROID_SIGNING_SECRET -in signing/admission-upload.keystore.enc -out "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Test and build patched source
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Verify patched APK metadata and signer
        shell: bash
        run: |
          set -euo pipefail
          SRC=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$SRC" | tee patched-apksigner.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$SRC" | tee patched-badging.txt
          grep -q "versionCode='109200'" patched-badging.txt
          grep -q "versionName='0.9.20'" patched-badging.txt
          grep -q "application-label:'Admission Collector v0.9.20 Crash-Safe Checkpoint'" patched-badging.txt
          CERT=$(grep -m1 'Signer #1 certificate SHA-256 digest:' patched-apksigner.txt | sed 's/.*digest: //' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          test "$CERT" = "db6cd5efceda108657662d06f857e5f0277301cb6ab97a75c8a01994c96e4995"

      - name: Commit v0.9.20 source
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          # The patch script also stages a diagnostic-workflow fix for verification, but the
          # GitHub Actions app token is not permitted to push workflow-file changes. Restore
          # that one file here; v0.9.20 app/source changes remain unchanged and verified.
          git restore .github/workflows/read-jinhak-diagnostic.yml
          if git diff --name-only | grep -q '^\.github/workflows/'; then
            echo 'Unexpected workflow file remains modified' >&2
            git diff --name-only
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/admissionhub/collector/MainActivity.kt \
                  app/src/main/java/com/admissionhub/collector/cloud/CloudOffloadCoordinator.kt \
                  app/build.gradle.kts app/src/main/AndroidManifest.xml
          git commit -m "Implement v0.9.20 Crash-Safe Checkpoint"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  independent-main-build:
    needs: patch-build-commit
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Refresh exact committed main
        run: |
          git fetch origin main
          git reset --hard origin/main
          test "$(git rev-parse HEAD)" = "${{ needs.patch-build-commit.outputs.source_sha }}"

      - name: Reverify committed v0.9.20
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          m=Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt').read_text()
          c=Path('app/src/main/java/com/admissionhub/collector/cloud/CloudOffloadCoordinator.kt').read_text()
          a=Path('app/src/main/java/com/admissionhub/collector/provider/JinhakAdapter.kt').read_text()
          assert 'private const val VERSION = "0.9.20"' in m
          assert 'private const val BUILD_CODE = 109200' in m
          assert 'checkpointJinhakCaptureToCloud(' in m
          assert m.count('checkpointJinhakCaptureToCloud("') == 3
          assert 'jinhak-renderer-circuit-paused' in m
          assert 'MAX_JINHAK_RENDERER_CIRCUIT_BREAKS_PER_SESSION = 2' in m
          assert 'resumeRendererCircuit@{' in m and 'return@resumeRendererCircuit' in m
          assert 'fun sendRecordCheckpoint(' in c
          assert 'supportsBatchCrawl = false' in a
          assert 'supportsUserSessionMissionTraversal = true' in a
          print('committed v0.9.20 verified')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_SECRET"
          STORE_FILE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ANDROID_SIGNING_SECRET -in signing/admission-upload.keystore.enc -out "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build committed main
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify and package final APK
        shell: bash
        run: |
          set -euo pipefail
          SRC=app/build/outputs/apk/debug/app-debug.apk
          OUT=Admission-Collector-v0.9.20-Crash-Safe-Checkpoint.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$SRC" | tee apksigner.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$SRC" | tee badging.txt
          grep -q "versionCode='109200'" badging.txt
          grep -q "versionName='0.9.20'" badging.txt
          grep -q "application-label:'Admission Collector v0.9.20 Crash-Safe Checkpoint'" badging.txt
          CERT=$(grep -m1 'Signer #1 certificate SHA-256 digest:' apksigner.txt | sed 's/.*digest: //' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          test "$CERT" = "db6cd5efceda108657662d06f857e5f0277301cb6ab97a75c8a01994c96e4995"
          cp "$SRC" "$OUT"
          sha256sum "$OUT" | tee Admission-Collector-v0.9.20-Crash-Safe-Checkpoint.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: admission-collector-main-v0.9.20-final
          path: |
            Admission-Collector-v0.9.20-Crash-Safe-Checkpoint.apk
            Admission-Collector-v0.9.20-Crash-Safe-Checkpoint.sha256
            apksigner.txt
            badging.txt
          retention-days: 14

      - name: Publish v0.9.20 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          NOTES="v0.9.20 is a crash-safety release based on the observed v0.9.19 Jinhak run where the main WebView renderer crashed twice while the SQLite mission ledger and auth proof survived. It adds incremental provider-isolated Jinhak record checkpoints to Cloudflare after each locally persisted Jinhak capture. The cloud payload is the existing bounded privacy-sanitized Jinhak digest; no DOM/HTML/query/cookie/token/localStorage/sessionStorage/form values/credentials are added. The checkpoint path does not mutate the coordinator active run, preventing cross-provider contamination. Foreground renderer recovery is now bounded: a second Jinhak renderer death inside a 90-second window opens a circuit, synchronously preserves mission/runtime diagnostics, replaces the dead browser surface without immediately reloading the failing route, waits 30 seconds, then resumes from the mission origin/core path. Repeated circuit breaks are bounded and end in a resumable safe stop instead of renderer thrashing. Existing v0.9.19 Mission Cell ownership, v0.9.18 Auth Proof Resume Gate, v0.9.16 target auth redirect quarantine, v0.9.15 stall fence, v0.9.14 slow-lane renderer circuit, v0.9.13 same-card replay, v0.9.11 monotonic SQLite mission persistence, Susi-only traversal and strict same-card binding are preserved. Commit: $SHA"
          gh release create v0.9.20 Admission-Collector-v0.9.20-Crash-Safe-Checkpoint.apk Admission-Collector-v0.9.20-Crash-Safe-Checkpoint.sha256 --target "$SHA" --title "Admission Collector v0.9.20 — Crash-Safe Checkpoint" --notes "$NOTES"
