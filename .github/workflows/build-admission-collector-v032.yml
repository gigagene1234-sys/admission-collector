name: Build Admission Collector v0.3.2

on:
  push:
    branches:
      - feature/v0.3.2-cloud-offload
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply deterministic v0.3.2 patch
        run: |
          python3 scripts/apply_v032.py
          python3 scripts/fix_v032_resume.py

      - name: Verify source invariants
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/java/com/admissionhub/collector/cloud/CloudOffloadClient.kt
          test -f app/src/main/java/com/admissionhub/collector/cloud/CloudOffloadCoordinator.kt
          test -f cloudflare/src/index.js
          test -f cloudflare/migrations/0001_init.sql
          cmp -s MainActivity.kt app/src/main/java/com/admissionhub/collector/MainActivity.kt

          SOURCE_VERSION="$(grep -oP 'private const val VERSION = "\K[^"]+' MainActivity.kt | head -n1)"
          NESTED_VERSION="$(grep -oP 'private const val VERSION = "\K[^"]+' app/src/main/java/com/admissionhub/collector/MainActivity.kt | head -n1)"
          GRADLE_VERSION="$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -n1)"

          test "$SOURCE_VERSION" = "0.3.2"
          test "$NESTED_VERSION" = "0.3.2"
          test "$GRADLE_VERSION" = "0.3.2"
          grep -q 'CloudOffloadCoordinator' MainActivity.kt
          grep -q 'cloudOffload.uploadPage' MainActivity.kt
          grep -q 'cloudOffload.uploadError' MainActivity.kt
          grep -q 'cloudOffload.resumePlan' MainActivity.kt
          grep -q 'batchCloudPagesSkipped' MainActivity.kt
          grep -q '${batchCloudPlansPending}개 목록' MainActivity.kt
          grep -q 'DEFAULT_WORKER_URL = "https://admission-collector-offload.gigagene1234.workers.dev"' app/src/main/java/com/admissionhub/collector/cloud/CloudOffloadCoordinator.kt

      - name: Validate Cloudflare Worker source
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/src/index.js
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          sql = Path('cloudflare/migrations/0001_init.sql').read_text()
          db = sqlite3.connect(':memory:')
          db.executescript(sql)
          db.close()
          print('D1 schema syntax OK')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Persist generated v0.3.2 source on feature branch
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/v0.3.2-cloud-offload' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MainActivity.kt app/build.gradle.kts app/src/main/java/com/admissionhub/collector/MainActivity.kt
          if git diff --cached --quiet; then
            echo "Generated source already persisted"
          else
            git commit -m "Apply v0.3.2 cloud offload integration [skip ci]"
            git push origin HEAD:feature/v0.3.2-cloud-offload
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: admission-collector-v0.3.2-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
