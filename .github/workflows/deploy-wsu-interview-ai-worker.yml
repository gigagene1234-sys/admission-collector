name: Deploy WSU Interview AI Worker

on:
  workflow_dispatch:
  push:
    branches:
      - wsu-interview-web
    paths:
      - "tools/wsu-rail-interview-ai-worker/src/**"
      - "tools/wsu-rail-interview-ai-worker/generate-v1.3.mjs"
      - "tools/wsu-rail-interview-ai-worker/ai-ui.js"
      - "tools/wsu-rail-interview-ai-worker/package.json"
      - "tools/wsu-rail-interview-ai-worker/wrangler.toml"
      - ".github/workflows/deploy-wsu-interview-ai-worker.yml"

permissions:
  contents: write

concurrency:
  group: wsu-interview-ai-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: wsu-interview-web
          fetch-depth: 0

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Missing GitHub Actions secret: CLOUDFLARE_API_TOKEN" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: tools/wsu-rail-interview-ai-worker
        run: npm install --no-audit --no-fund

      - name: Validate Worker source
        working-directory: tools/wsu-rail-interview-ai-worker
        run: npm run check

      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const response = await fetch('https://api.cloudflare.com/client/v4/accounts?per_page=50', {
            headers: { Authorization: `Bearer ${token}` }
          });
          const body = await response.json();
          if (!response.ok || !body.success) {
            throw new Error(`Unable to list Cloudflare accounts: ${JSON.stringify(body.errors || body)}`);
          }
          const accounts = Array.isArray(body.result) ? body.result : [];
          if (accounts.length !== 1) {
            throw new Error(`Expected exactly one accessible Cloudflare account, found ${accounts.length}`);
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_ACCOUNT_ID=${accounts[0].id}\n`);
          NODE

      - name: Deploy Worker
        working-directory: tools/wsu-rail-interview-ai-worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee /tmp/wsu-worker-deploy.log


      - name: Resolve Worker URL
        shell: bash
        run: |
          set -euo pipefail
          WORKER_URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/wsu-worker-deploy.log | tail -n 1 || true)"
          if [ -z "$WORKER_URL" ]; then
            WORKER_URL="$(node --input-type=module <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${accountId}/workers/subdomain`, {
            headers: { Authorization: `Bearer ${token}` }
          });
          const body = await response.json();
          if (!response.ok || !body.success || !body.result?.subdomain) process.exit(0);
          process.stdout.write(`https://wsu-interview-ai.${body.result.subdomain}.workers.dev`);
          NODE
            )"
          fi
          if [ -z "$WORKER_URL" ]; then
            echo "Could not resolve Worker URL" >&2
            exit 1
          fi
          echo "WORKER_URL=$WORKER_URL" >> "$GITHUB_ENV"
          echo "$WORKER_URL" > tools/wsu-rail-interview-ai-worker/AI_WORKER_ENDPOINT.txt
          echo "Worker URL: $WORKER_URL"

      - name: Health check
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            curl --silent --show-error "$WORKER_URL/health" -o /tmp/health.json || true
            cat /tmp/health.json || true
            echo
            if node -e "const fs=require('fs'); const j=JSON.parse(fs.readFileSync('/tmp/health.json','utf8')); process.exit(j.ok && j.service==='wsu-interview-ai' && j.version==='1.4.0' ? 0 : 1)" 2>/dev/null; then
              break
            fi
            echo "Waiting for v1.4.0 propagation (attempt $attempt/20)..."
            sleep 3
          done
          node - <<'NODE'
          const fs = require('fs');
          const j = JSON.parse(fs.readFileSync('/tmp/health.json', 'utf8'));
          if (!j.ok || j.service !== 'wsu-interview-ai') process.exit(1);
          if (j.version !== '1.4.0') process.exit(1);
          if (!j.providers?.workersAI) process.exit(1);
          if (j.models?.generation !== '@cf/zai-org/glm-4.7-flash') process.exit(1);
          if (j.models?.verifier !== '@cf/meta/llama-3.3-70b-instruct-fp8-fast') process.exit(1);
          if (JSON.stringify(j).toLowerCase().includes('gemini')) process.exit(1);
          NODE

      - name: Smoke test deployed app UI
        shell: bash
        run: |
          set -euo pipefail
          curl --max-time 60 --silent --show-error "$WORKER_URL/" -o /tmp/app.html
          grep -q '/ai-ui.js' /tmp/app.html
          curl --max-time 60 --silent --show-error "$WORKER_URL/ai-ui.js" -o /tmp/ai-ui.js
          grep -q 'AI 답안 수정' /tmp/ai-ui.js
          grep -q "fetch('/api/rewrite'" /tmp/ai-ui.js
          grep -q '이 수정안 적용' /tmp/ai-ui.js

      - name: Smoke test rewrite endpoint
        shell: bash
        run: |
          set -euo pipefail
          (
            cd tools/wsu-rail-interview-ai-worker
            timeout 90s npx wrangler tail wsu-interview-ai --format json > /tmp/wsu-tail.log 2>&1 || true
          ) &
          TAIL_PID=$!
          sleep 4
          HTTP_CODE="$(curl --max-time 180 --retry 1 --retry-delay 2 --silent --show-error \
            -o /tmp/rewrite.json -w '%{http_code}' \
            -X POST "$WORKER_URL/api/rewrite" \
            -H "Content-Type: application/json" \
            --data '{"question":{"id":1,"text":"본인의 강점은 무엇인가?","target":"강점과 근거를 명확히 설명","method":"강점→경험→배움","risk":"과장 금지"},"currentAnswer":"저의 강점은 궁금증을 후속 탐구로 이어가는 태도입니다.","userInstruction":"핵심은 유지하고 더 자연스럽게 다듬어줘.","records":[]}' )"
          cat /tmp/rewrite.json
          echo
          echo "rewrite HTTP $HTTP_CODE"
          sleep 3
          kill "$TAIL_PID" 2>/dev/null || true
          wait "$TAIL_PID" 2>/dev/null || true
          echo "----- Worker tail -----"
          cat /tmp/wsu-tail.log 2>/dev/null || true
          echo "----- End Worker tail -----"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            exit 1
          fi
          node - <<'NODE'
          const fs = require('fs');
          const j = JSON.parse(fs.readFileSync('/tmp/rewrite.json', 'utf8'));
          if (!j.revisedAnswer || !j.assessment) process.exit(1);
          if (!Array.isArray(j.reviewPath) || !j.reviewPath.includes('glm')) process.exit(1);
          NODE

      - name: Smoke test Llama verification path
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE="$(curl --max-time 180 --silent --show-error \
            -o /tmp/rewrite-verified.json -w '%{http_code}' \
            -X POST "$WORKER_URL/api/rewrite" \
            -H "Content-Type: application/json" \
            --data '{"question":{"id":6,"text":"문제를 해결한 경험을 말해보세요.","target":"문제 인식과 해결 과정","method":"문제→재정의→배움","risk":"과장 금지"},"currentAnswer":"로봇의 안전 기준을 탐구했습니다.","userInstruction":"선택한 근거를 활용해 자연스럽게 다듬어줘.","records":[{"id":"smoke-draft","subject":"탐구","title":"자율주행 로봇 안전 탐구","sourceKind":"draft","sourceLabel":"별도 작성본","summary":"차량 중심의 자율주행 단계가 다양한 로봇에 그대로 적용되기 어렵다고 보고 인간 개입과 안전 통제를 중심으로 다시 살펴봄","fullText":"","limits":"새 공식 분류 체계를 만들었다고 표현하지 않음"}]}' )"
          cat /tmp/rewrite-verified.json
          echo
          echo "verified rewrite HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            exit 1
          fi
          node - <<'NODE'
          const fs = require('fs');
          const j = JSON.parse(fs.readFileSync('/tmp/rewrite-verified.json', 'utf8'));
          if (!j.revisedAnswer || !j.assessment) process.exit(1);
          if (!Array.isArray(j.reviewPath) || !j.reviewPath.includes('glm') || !j.reviewPath.includes('llama-verifier')) process.exit(1);
          if (!j.risk || !['medium','high'].includes(j.risk.level)) process.exit(1);
          NODE

      - name: Persist Worker endpoint
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- tools/wsu-rail-interview-ai-worker/AI_WORKER_ENDPOINT.txt; then
            echo "Worker endpoint already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/wsu-rail-interview-ai-worker/AI_WORKER_ENDPOINT.txt
          git commit -m "Record WSU interview AI Worker endpoint [skip ci]"
          git push origin HEAD:wsu-interview-web

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo "## WSU Interview AI Worker"
            echo "- Worker: $WORKER_URL"
            echo "- Cloudflare Workers AI: bound"
            echo "- Architecture: GLM generation -> risk engine -> conditional Llama verification"
            echo "- External AI API keys: not required"
            echo "- Health check: passed"
            echo "- Rewrite smoke test: passed"
          } >> "$GITHUB_STEP_SUMMARY"
