name: Fix v0.14.2 Login Probe

on:
  push:
    branches: [codex/v0142-one-step-score-auth]
    paths:
      - ".github/workflows/fix-v0142-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore login surface probe
        run: python3 .github/scripts/fix_v0142_probe.py
      - name: Verify bounded change
        shell: bash
        run: |
          set -euo pipefail
          git diff -- app/src/main/java/com/admissionhub/collector/MainActivity.kt
          test "$(git diff --name-only | tr '\n' ' ')" = "app/src/main/java/com/admissionhub/collector/MainActivity.kt "
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/admissionhub/collector/MainActivity.kt
          git commit -m "fix: restore login surface probe for auto login"
          git push origin HEAD:codex/v0142-one-step-score-auth
