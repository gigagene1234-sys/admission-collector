name: Build Admission Collector v0.9.10 Renderer Recovery

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-admission-collector-v0910.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}
    outputs:
      source_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply v0.9.10 single-purpose patch
        run: python3 .github/scripts/patch_v0910.py

      - name: Verify only Renderer Recovery changed
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | sort | tee changed-files.txt
          printf '%s\n' \
            app/build.gradle.kts \
            app/src/main/AndroidManifest.xml \
            app/src/main/java/com/admissionhub/collector/MainActivity.kt | sort > expected-files.txt
          diff -u expected-files.txt changed-files.txt

      - name: Verify v0.9.10 source invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          m=Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt').read_text()
          g=Path('app/build.gradle.kts').read_text()
          manifest=Path('app/src/main/AndroidManifest.xml').read_text()
          ledger=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakMissionTargetLedger.kt').read_text()
          seq=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakMissionLaneSequencer.kt').read_text()
          adapter=Path('app/src/main/java/com/admissionhub/collector/provider/JinhakAdapter.kt').read_text()
          snap=Path('app/src/main/java/com/admissionhub/collector/capture/SnapshotScript.kt').read_text()
          req={
            'version':'private const val VERSION = "0.9.10"' in m and 'private const val BUILD_CODE = 109100' in m,
            'gradle':'versionCode = 109100' in g and 'versionName = "0.9.10"' in g,
            'label':'Admission Collector v0.9.10 Renderer Recovery' in manifest,
            'no-activity-recreate':'handler.postDelayed({ recreate() }, 250L)' not in m,
            'in-place-recovery':'webview-renderer-recovered-in-place' in m and 'parent.addView(replacement, childIndex, oldLayoutParams)' in m,
            'state-preserved':'val wasBatchRunning = batchRunning' in m and 'batchRunning = wasBatchRunning' in m and 'currentBatchTarget = currentBatchTarget?.takeIf { it.isNotBlank() } ?: resumeUrl' in m,
            'renderer-diagnostics':'WebView.getCurrentWebViewPackage()' in m and 'priorityAtExit' in m and 'webViewVersion' in m,
            'no-renderer-terminal-document-error':'localStore.markDocument(runId, key, "error", 0, "webview-renderer-gone")' not in m,
            'mission-routing-preserved':'laneForCandidateAtOrigin' in ledger and 'laneForCandidateAtOrigin' in seq,
            'same-card-preserved':'unique-card-container' in snap,
            'batch-crawl-off':'override val supportsBatchCrawl = false' in adapter,
            'auth-recovery-preserved':'protected-core-stable' in m and 'scheduleJinhakLoginRecovery' in m,
          }
          failed=[k for k,v in req.items() if not v]
          if failed: raise SystemExit('Missing invariant(s): '+', '.join(failed))
          if '.put("username", credentials.username)' in m or '.put("password", credentials.password)' in m:
            raise SystemExit('credential leak invariant failed')
          print('v0.9.10 Renderer Recovery invariants passed')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_SECRET"
          STORE_FILE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ANDROID_SIGNING_SECRET -in signing/admission-upload.keystore.enc -out "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Test and build patched source
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Verify patched APK
        shell: bash
        run: |
          set -euo pipefail
          SRC=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$SRC" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$SRC" | tee patched-badging.txt
          grep -q "versionCode='109100'" patched-badging.txt
          grep -q "versionName='0.9.10'" patched-badging.txt
          grep -q "application-label:'Admission Collector v0.9.10 Renderer Recovery'" patched-badging.txt

      - name: Commit v0.9.10 source
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/admissionhub/collector/MainActivity.kt app/build.gradle.kts app/src/main/AndroidManifest.xml
          git commit -m "Implement v0.9.10 renderer recovery"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  independent-main-build:
    needs: patch-build-commit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Refresh exact committed main
        run: |
          git fetch origin main
          git reset --hard origin/main
          test "$(git rev-parse HEAD)" = "${{ needs.patch-build-commit.outputs.source_sha }}"

      - name: Reverify committed Renderer Recovery
        run: |
          python3 - <<'PY'
          from pathlib import Path
          m=Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt').read_text()
          g=Path('app/build.gradle.kts').read_text()
          assert 'private const val VERSION = "0.9.10"' in m
          assert 'private const val BUILD_CODE = 109100' in m
          assert 'versionName = "0.9.10"' in g
          assert 'webview-renderer-recovered-in-place' in m
          assert 'parent.addView(replacement, childIndex, oldLayoutParams)' in m
          assert 'handler.postDelayed({ recreate() }, 250L)' not in m
          assert 'batchRunning = wasBatchRunning' in m
          assert 'laneForCandidateAtOrigin' in Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakMissionTargetLedger.kt').read_text()
          print('committed v0.9.10 source verified')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_SECRET"
          STORE_FILE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ANDROID_SIGNING_SECRET -in signing/admission-upload.keystore.enc -out "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build committed main
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify and package final APK
        shell: bash
        run: |
          set -euo pipefail
          SRC=app/build/outputs/apk/debug/app-debug.apk
          OUT=Admission-Collector-v0.9.10-Renderer-Recovery.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$SRC" | tee apksigner.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$SRC" | tee badging.txt
          grep -q "versionCode='109100'" badging.txt
          grep -q "versionName='0.9.10'" badging.txt
          grep -q "application-label:'Admission Collector v0.9.10 Renderer Recovery'" badging.txt
          cp "$SRC" "$OUT"
          sha256sum "$OUT" | tee Admission-Collector-v0.9.10-Renderer-Recovery.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: admission-collector-main-v0.9.10-final
          path: |
            Admission-Collector-v0.9.10-Renderer-Recovery.apk
            Admission-Collector-v0.9.10-Renderer-Recovery.sha256
            apksigner.txt
            badging.txt
          retention-days: 14

      - name: Publish v0.9.10 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          NOTES="v0.9.10 is intentionally single-purpose: Renderer Recovery. The v0.9.9 real-device run proved mission-ledger routing can create 30 application identities/targets and enter bound prediction reports, but Android reported a WebView renderer failure. The previous onRenderProcessGone handler destroyed the main WebView and called Activity.recreate(), which discarded in-memory navigation and mission runtime state. v0.9.10 removes Activity recreation. Renderer loss is treated as an interrupted render: execution is briefly paused, the dead main WebView is replaced in the same parent/index, the existing Activity/unified session/queue/mission objects remain alive, pre-crash batch/login flags are restored, and the exact current target is reloaded. Renderer death no longer marks the target as a terminal document error. Runtime diagnostics now record didCrash, rendererPriorityAtExit, WebView package/version, resume path, and in-place recovery result. No mission routing, login, Slow Lane, canonical, analysis, dashboard, or retry feature is intentionally changed in this version. Gradle test/build, APK version/signature verification and independent committed-main rebuild passed. Real-device renderer-loss recovery remains to be validated. Commit: $SHA"
          gh release create v0.9.10 Admission-Collector-v0.9.10-Renderer-Recovery.apk Admission-Collector-v0.9.10-Renderer-Recovery.sha256 --target "$SHA" --title "Admission Collector v0.9.10 — Renderer Recovery" --notes "$NOTES"
