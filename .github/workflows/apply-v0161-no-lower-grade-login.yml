name: Apply Admission Hub v0.16.1 No Lower Grade Login

on:
  push:
    branches: [codex/v0160-dashboard-official-login]
    paths:
      - ".github/scripts/patch_v0161_no_lower_grade_login.py"
      - ".github/workflows/apply-v0161-no-lower-grade-login.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: admission-hub-v0161-no-lower-grade-login
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v0160-dashboard-official-login
          fetch-depth: 0
      - name: Apply lower-grade login fence
        run: python3 .github/scripts/patch_v0161_no_lower_grade_login.py
      - name: Verify focused source change
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "app/src/main/java/com/admissionhub/collector/MainActivity.kt"
      - name: Commit product patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/admissionhub/collector/MainActivity.kt
          git commit -m "fix: never expose Jinhak lower-grade login context"
          git push origin HEAD:codex/v0160-dashboard-official-login
