name: Build Admission Collector v0.9.12 Jinhak Bootstrap Recovery

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-admission-collector-v0912.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}
    outputs:
      source_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply v0.9.12 bootstrap recovery patch
        run: python3 .github/scripts/patch_v0912.py

      - name: Verify bounded change surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          allowed={
            'app/src/main/java/com/admissionhub/collector/MainActivity.kt',
            'app/src/main/java/com/admissionhub/collector/capture/SnapshotScript.kt',
            'app/build.gradle.kts',
            'app/src/main/AndroidManifest.xml',
          }
          extra=changed-allowed
          missing=allowed-changed
          if extra: raise SystemExit('Unexpected files changed: '+', '.join(sorted(extra)))
          if missing: raise SystemExit('Required files not changed: '+', '.join(sorted(missing)))
          print('v0.9.12 file boundary passed')
          PY

      - name: Verify v0.9.12 invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          m=Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt').read_text()
          s=Path('app/src/main/java/com/admissionhub/collector/capture/SnapshotScript.kt').read_text()
          l=Path('app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt').read_text()
          g=Path('app/build.gradle.kts').read_text()
          manifest=Path('app/src/main/AndroidManifest.xml').read_text()
          req={
            'version':'private const val VERSION = "0.9.12"' in m and 'private const val BUILD_CODE = 109120' in m,
            'gradle':'versionCode = 109120' in g and 'versionName = "0.9.12"' in g,
            'label':'Admission Collector v0.9.12 Jinhak Bootstrap Recovery' in manifest,
            'no-bare-500':'var serverError=/(500\\s*' not in s,
            'strict-title-500':'titleServerError' in s and 'HTTP\\s+ERROR\\s+500' in s,
            'strict-body-500':'bodyServerError' in s and '500\\s+Internal\\s+Server\\s+Error' in s,
            'jinhak-run-before-snapshot':'providerRunInitializedBeforeSnapshot' in m,
            'bounded-bootstrap-retry':'MAX_JINHAK_BOOTSTRAP_PAGE_RETRIES = 2' in m and 'jinhak-bootstrap-core-retry' in m,
            'zero-success-fence':'jinhak-bootstrap-no-success' in m,
            'final-persistence-diagnostics':'.put("missionPersistence", localStore.jinhakMissionPersistenceSummary(sessionId))' in m,
            'error-type-diagnostics':'jinhakPageStateErrorTypes' in m,
            'persistence-preserved':'CREATE TABLE IF NOT EXISTS jinhak_mission_targets' in l and 'state_rank' in l,
            'renderer-recovery-preserved':'webview-renderer-recovered-in-place' in m,
            'auth-gate-preserved':'protected-core-stable' in m and 'scheduleJinhakLoginRecovery' in m,
            'susi-core-preserved':'isDefaultSusiCoreTraversalUrl' in m,
          }
          failed=[k for k,v in req.items() if not v]
          if failed: raise SystemExit('Missing invariant(s): '+', '.join(failed))
          if 'handler.postDelayed({ recreate() }, 250L)' in m:
            raise SystemExit('renderer recovery regressed')
          if '.put("username", credentials.username)' in m or '.put("password", credentials.password)' in m:
            raise SystemExit('credential export invariant failed')
          print('v0.9.12 invariants passed')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_SECRET"
          STORE_FILE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ANDROID_SIGNING_SECRET -in signing/admission-upload.keystore.enc -out "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Test and build patched source
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Verify patched APK
        shell: bash
        run: |
          set -euo pipefail
          SRC=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$SRC" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$SRC" | tee patched-badging.txt
          grep -q "versionCode='109120'" patched-badging.txt
          grep -q "versionName='0.9.12'" patched-badging.txt
          grep -q "application-label:'Admission Collector v0.9.12 Jinhak Bootstrap Recovery'" patched-badging.txt

      - name: Commit v0.9.12 source
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/admissionhub/collector/MainActivity.kt \
                  app/src/main/java/com/admissionhub/collector/capture/SnapshotScript.kt \
                  app/build.gradle.kts app/src/main/AndroidManifest.xml
          git commit -m "Implement v0.9.12 Jinhak bootstrap recovery"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  independent-main-build:
    needs: patch-build-commit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Refresh exact committed main
        run: |
          git fetch origin main
          git reset --hard origin/main
          test "$(git rev-parse HEAD)" = "${{ needs.patch-build-commit.outputs.source_sha }}"

      - name: Reverify committed v0.9.12
        run: |
          python3 - <<'PY'
          from pathlib import Path
          m=Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt').read_text()
          s=Path('app/src/main/java/com/admissionhub/collector/capture/SnapshotScript.kt').read_text()
          g=Path('app/build.gradle.kts').read_text()
          assert 'private const val VERSION = "0.9.12"' in m
          assert 'versionCode = 109120' in g
          assert 'jinhak-bootstrap-no-success' in m
          assert 'jinhak-bootstrap-core-retry' in m
          assert '.put("missionPersistence", localStore.jinhakMissionPersistenceSummary(sessionId))' in m
          assert 'titleServerError' in s and 'bodyServerError' in s
          assert 'var serverError=/(500\\s*' not in s
          assert 'webview-renderer-recovered-in-place' in m
          print('committed v0.9.12 verified')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          STORE_FILE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ANDROID_SIGNING_SECRET -in signing/admission-upload.keystore.enc -out "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build committed main
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify and package final APK
        shell: bash
        run: |
          set -euo pipefail
          SRC=app/build/outputs/apk/debug/app-debug.apk
          OUT=Admission-Collector-v0.9.12-Jinhak-Bootstrap-Recovery.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$SRC" | tee apksigner.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$SRC" | tee badging.txt
          grep -q "versionCode='109120'" badging.txt
          grep -q "versionName='0.9.12'" badging.txt
          grep -q "application-label:'Admission Collector v0.9.12 Jinhak Bootstrap Recovery'" badging.txt
          cp "$SRC" "$OUT"
          sha256sum "$OUT" | tee Admission-Collector-v0.9.12-Jinhak-Bootstrap-Recovery.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: admission-collector-main-v0.9.12-final
          path: |
            Admission-Collector-v0.9.12-Jinhak-Bootstrap-Recovery.apk
            Admission-Collector-v0.9.12-Jinhak-Bootstrap-Recovery.sha256
            apksigner.txt
            badging.txt
          retention-days: 14

      - name: Publish v0.9.12 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          NOTES="v0.9.12 is a bounded recovery release based on the v0.9.11 real-device export admission-unified-v0.9.11-1788480400484.json. That run authenticated Jinhak successfully but produced attemptedSnapshots=3, successfulSnapshots=0, errorEvents=3, missionTargetLedger.targets=0 and therefore never exercised Mission State Persistence. It also omitted missionPersistence from the final unified diagnostics even though live diagnostics contained it. v0.9.12 tightens SnapshotScript server-error detection so a bare visible numeric 500 cannot be mistaken for HTTP 500, initializes the Jinhak local run before the first snapshot, retries an unpopulated core Susi bootstrap route at most twice, refuses to label a zero-success Jinhak bootstrap as completed, and exports aggregate page-state error classes plus the SQLite missionPersistence summary in final diagnostics. Existing v0.9.11 monotonic mission persistence, v0.9.10 in-place renderer recovery, authentication gates, Susi-only core routing and credential privacy invariants are preserved. Commit: $SHA"
          gh release create v0.9.12 Admission-Collector-v0.9.12-Jinhak-Bootstrap-Recovery.apk Admission-Collector-v0.9.12-Jinhak-Bootstrap-Recovery.sha256 --target "$SHA" --title "Admission Collector v0.9.12 — Jinhak Bootstrap Recovery" --notes "$NOTES"
