name: Build Admission Collector v0.7.1 Autonomous Crawl Rollback

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-admission-collector-v071.yml"
      - "scripts/apply_v071_autocrawl_analysis_ready.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.7.1 rollback and analysis-ready patch
        run: python3 scripts/apply_v071_autocrawl_analysis_ready.py

      - name: Verify source invariants
        shell: bash
        run: |
          set -euo pipefail
          MAIN=app/src/main/java/com/admissionhub/collector/MainActivity.kt
          STORE=app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt
          JINHAK=app/src/main/java/com/admissionhub/collector/provider/JinhakAdapter.kt
          SYNC=app/src/main/java/com/admissionhub/collector/sync/UnifiedSyncState.kt
          grep -q 'private const val VERSION = "0.7.1"' "$MAIN"
          grep -q 'private const val BUILD_CODE = 10710' "$MAIN"
          grep -q 'versionCode = 10710' app/build.gradle.kts
          grep -q 'versionName = "0.7.1"' app/build.gradle.kts
          grep -q 'Admission Collector v0.7.1 Autonomous Analysis Ready' app/src/main/AndroidManifest.xml
          grep -q 'override val supportsBatchCrawl = true' "$JINHAK"
          grep -q 'override fun isBatchNavigable' "$JINHAK"
          grep -q 'JINHAK_AUTONOMOUS_CRAWL' "$SYNC"
          grep -q '진학사 자동 크롤러 시작' "$MAIN"
          grep -q 'batchPageType = snapshot.optString' "$MAIN"
          grep -q 'assistant-xlsx-dashboard-generation' "$STORE"
          grep -q 'recommendedWorkbookSheets' "$STORE"
          ! grep -q '사용자가 직접 여는 입시 데이터 화면만 자동 분석' "$MAIN"

      - name: Verify retained safety and memory guards
        shell: bash
        run: |
          set -euo pipefail
          MAIN=app/src/main/java/com/admissionhub/collector/MainActivity.kt
          STORE=app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt
          grep -q 'JINHAK_ABSOLUTE_TARGET_MS = 35_000L' "$MAIN"
          grep -q 'onRenderProcessGone' "$MAIN"
          grep -q 'installRuntimeCrashGuard' "$MAIN"
          grep -q 'onTrimMemory' "$MAIN"
          grep -q 'writeUnifiedExport' "$STORE"
          grep -q 'writeObservations' "$STORE"
          grep -q 'doNotInferMissingBindings' "$STORE"
          python3 - <<'PY'
          from pathlib import Path
          a=Path('app/src/main/java/com/admissionhub/collector/provider/JinhakAdapter.kt').read_text()
          forbidden=['payment','billing','purchase','order','refund','withdraw','logout','signout']
          for token in forbidden:
              if token not in a:
                  raise SystemExit(f'missing navigation safety token: {token}')
          main=Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt').read_text()
          if 'localStore.writeUnifiedExport(streamSession, writer)' not in main:
              raise SystemExit('streaming unified export regression')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_SECRET"
          STORE_FILE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -pass env:ANDROID_SIGNING_SECRET \
            -in signing/admission-upload.keystore.enc \
            -out "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK version and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "versionCode='10710'" /tmp/badging.txt
          grep -q "versionName='0.7.1'" /tmp/badging.txt
          grep -q "application-label:'Admission Collector v0.7.1 Autonomous Analysis Ready'" /tmp/badging.txt
          sha256sum "$APK" | tee /tmp/apk.sha256

      - name: Commit generated v0.7.1 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/admissionhub/collector/MainActivity.kt \
            app/src/main/java/com/admissionhub/collector/provider/JinhakAdapter.kt \
            app/src/main/java/com/admissionhub/collector/sync/UnifiedSyncState.kt \
            app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt \
            app/build.gradle.kts
          if ! git diff --cached --quiet; then
            git commit -m "Apply v0.7.1 autonomous Jinhak rollback and analysis-ready export [skip ci]"
            git push origin HEAD:main
          fi

      - name: Upload APK
        if: always() && steps.build.outcome != 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: admission-collector-v0.7.1-autonomous-analysis-ready-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
