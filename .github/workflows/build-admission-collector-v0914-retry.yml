name: Build Admission Collector v0.9.14 WebView Renderer Circuit Breaker Retry

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-admission-collector-v0914-retry.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}
    outputs:
      source_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply v0.9.14 renderer circuit-breaker patch
        run: |
          python3 .github/scripts/patch_v0914.py
          python3 .github/scripts/patch_v0914_live.py

      - name: Verify bounded change surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          allowed={
            'app/src/main/java/com/admissionhub/collector/MainActivity.kt',
            'app/src/main/java/com/admissionhub/collector/jinhak/JinhakSlowLanePool.kt',
            'app/build.gradle.kts',
            'app/src/main/AndroidManifest.xml',
          }
          extra=changed-allowed
          missing=allowed-changed
          if extra: raise SystemExit('Unexpected files changed: '+', '.join(sorted(extra)))
          if missing: raise SystemExit('Required files not changed: '+', '.join(sorted(missing)))
          print('v0.9.14 file boundary passed')
          PY

      - name: Verify v0.9.14 invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          m=Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt').read_text()
          p=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakSlowLanePool.kt').read_text()
          l=Path('app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt').read_text()
          s=Path('app/src/main/java/com/admissionhub/collector/capture/SnapshotScript.kt').read_text()
          g=Path('app/build.gradle.kts').read_text()
          manifest=Path('app/src/main/AndroidManifest.xml').read_text()
          req={
            'version':'private const val VERSION = "0.9.14"' in m and 'private const val BUILD_CODE = 109140' in m,
            'gradle':'versionCode = 109140' in g and 'versionName = "0.9.14"' in g,
            'label':'Admission Collector v0.9.14 WebView Renderer Circuit Breaker' in manifest,
            'single-hidden-worker':'const val DEFAULT_MAX_WORKERS = 1' in p and 'private var maxActiveWorkers = 1' in p,
            'renderer-circuit':'rendererCircuitOpen' in p and 'handleRendererGone(slot)' in p,
            'dead-view-destroy':'host.removeView(slot.webView)' in p and 'slot.webView.destroy()' in p,
            'no-renderer-reuse':'override fun onRenderProcessGone' in p and 'finishFailure(slot, "slow-lane-renderer-gone")' not in p,
            'foreground-fallback':'jinhak-slow-lane-renderer-fallback-main' in m and 'markRetryableFailure(targetId, failureClass)' in m,
            'circuit-fallback':'jinhak-slow-lane-circuit-open-main-fallback' in m,
            'live-replay-telemetry':m.count('.put("sameCardReplayRetries", jinhakSameCardReplayRetries)') >= 2,
            'renderer-telemetry':'slowLaneRendererGoneCount' in m and 'slowLaneRendererCircuitOpen' in m,
            'mission-persistence':'CREATE TABLE IF NOT EXISTS jinhak_mission_targets' in l and 'monotonicStateGuard' in l,
            'same-card-guard':'same-card-action-not-found' in m and 'MAX_JINHAK_SAME_CARD_REPLAY_ATTEMPTS = 3' in m,
            'auth-preserved':'protected-core-stable' in m and 'scheduleJinhakLoginRecovery' in m,
            'susi-core-preserved':'isDefaultSusiCoreTraversalUrl' in m,
            'snapshot-privacy':'safeCloneText' in s and 'input,textarea,select,option,form' in s,
          }
          failed=[k for k,v in req.items() if not v]
          if failed: raise SystemExit('Missing invariant(s): '+', '.join(failed))
          if '.put("username", credentials.username)' in m or '.put("password", credentials.password)' in m:
              raise SystemExit('credential export invariant failed')
          print('v0.9.14 invariants passed')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_SECRET"
          STORE_FILE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ANDROID_SIGNING_SECRET -in signing/admission-upload.keystore.enc -out "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Test and build patched source
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Verify patched APK
        shell: bash
        run: |
          set -euo pipefail
          SRC=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$SRC" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$SRC" | tee patched-badging.txt
          grep -q "versionCode='109140'" patched-badging.txt
          grep -q "versionName='0.9.14'" patched-badging.txt
          grep -q "application-label:'Admission Collector v0.9.14 WebView Renderer Circuit Breaker'" patched-badging.txt

      - name: Commit v0.9.14 source
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/admissionhub/collector/MainActivity.kt \
                  app/src/main/java/com/admissionhub/collector/jinhak/JinhakSlowLanePool.kt \
                  app/build.gradle.kts app/src/main/AndroidManifest.xml
          git commit -m "Implement v0.9.14 WebView renderer circuit breaker"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  independent-main-build:
    needs: patch-build-commit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Refresh exact committed main
        run: |
          git fetch origin main
          git reset --hard origin/main
          test "$(git rev-parse HEAD)" = "${{ needs.patch-build-commit.outputs.source_sha }}"

      - name: Reverify committed v0.9.14
        run: |
          python3 - <<'PY'
          from pathlib import Path
          m=Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt').read_text()
          p=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakSlowLanePool.kt').read_text()
          g=Path('app/build.gradle.kts').read_text()
          assert 'private const val VERSION = "0.9.14"' in m
          assert 'versionCode = 109140' in g
          assert 'const val DEFAULT_MAX_WORKERS = 1' in p
          assert 'rendererCircuitOpen' in p
          assert 'jinhak-slow-lane-renderer-fallback-main' in m
          assert 'slowLaneRendererGoneCount' in m
          assert m.count('.put("sameCardReplayRetries", jinhakSameCardReplayRetries)') >= 2
          print('committed v0.9.14 verified')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          STORE_FILE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ANDROID_SIGNING_SECRET -in signing/admission-upload.keystore.enc -out "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build committed main
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify and package final APK
        shell: bash
        run: |
          set -euo pipefail
          SRC=app/build/outputs/apk/debug/app-debug.apk
          OUT=Admission-Collector-v0.9.14-WebView-Renderer-Circuit-Breaker.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$SRC" | tee apksigner.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$SRC" | tee badging.txt
          grep -q "versionCode='109140'" badging.txt
          grep -q "versionName='0.9.14'" badging.txt
          grep -q "application-label:'Admission Collector v0.9.14 WebView Renderer Circuit Breaker'" badging.txt
          cp "$SRC" "$OUT"
          sha256sum "$OUT" | tee Admission-Collector-v0.9.14-WebView-Renderer-Circuit-Breaker.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: admission-collector-main-v0.9.14-final
          path: |
            Admission-Collector-v0.9.14-WebView-Renderer-Circuit-Breaker.apk
            Admission-Collector-v0.9.14-WebView-Renderer-Circuit-Breaker.sha256
            apksigner.txt
            badging.txt
          retention-days: 14

      - name: Publish v0.9.14 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          NOTES="v0.9.14 is a bounded renderer-stability release based on the real-device v0.9.13 export admission-unified-v0.9.13-1788500688233.json and the simultaneous Samsung Device Care WebView crash dialog. The interrupted v0.9.13 run had already persisted 30 Jinhak mission targets and confirmed 3, but recorded two slow-lane-renderer-gone failures while a hidden slow worker was active. The v0.9.13 SlowLanePool returned true from onRenderProcessGone yet reset and reused the dead WebView instance. v0.9.14 follows the WebView termination contract: a dead hidden WebView is removed/destroyed and never reused. The hidden lane is serialized to one worker; the first hidden renderer loss opens a per-session circuit breaker; queued/deferred mission targets return to PENDING and fall back to the foreground WebView instead of becoming terminal mission failures. Circuit-open later escalations also fall back to the foreground scheduler without creating another hidden renderer. Live diagnostics now include same-card replay counters plus renderer-gone/circuit/fallback telemetry, so an interrupted run remains diagnosable. Existing v0.9.13 bounded same-card replay, v0.9.12 bootstrap recovery, v0.9.11 SQLite monotonic mission persistence, v0.9.10 main-WebView replacement recovery, authentication/Susi-only routing, privacy guards and state-changing-action prohibitions are preserved. Commit: $SHA"
          gh release create v0.9.14 Admission-Collector-v0.9.14-WebView-Renderer-Circuit-Breaker.apk Admission-Collector-v0.9.14-WebView-Renderer-Circuit-Breaker.sha256 --target "$SHA" --title "Admission Collector v0.9.14 — WebView Renderer Circuit Breaker" --notes "$NOTES"
