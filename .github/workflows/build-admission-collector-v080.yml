name: Build Admission Collector v0.8.0 Session Agent Cloud

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-admission-collector-v080.yml"
      - "scripts/apply_v080_session_agent_cloud.py"
      - "scripts/fix_v080_session_vault_compile.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.8.0 architecture patch
        run: |
          python3 scripts/apply_v080_session_agent_cloud.py
          python3 scripts/fix_v080_session_vault_compile.py

      - name: Verify v0.8.0 source architecture
        shell: bash
        run: |
          set -euo pipefail
          MAIN=app/src/main/java/com/admissionhub/collector/MainActivity.kt
          SESSION=app/src/main/java/com/admissionhub/collector/session/SecureSessionVault.kt
          AGENT=app/src/main/java/com/admissionhub/collector/jinhak/JinhakAgentNavigator.kt
          CLIENT=app/src/main/java/com/admissionhub/collector/cloud/CloudOffloadClient.kt
          COORD=app/src/main/java/com/admissionhub/collector/cloud/CloudOffloadCoordinator.kt
          STORE=app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt
          SNAP=app/src/main/java/com/admissionhub/collector/capture/SnapshotScript.kt
          WORKER=cloudflare/src/index.js

          grep -q 'private const val VERSION = "0.8.0"' "$MAIN"
          grep -q 'private const val BUILD_CODE = 10800' "$MAIN"
          grep -q 'versionCode = 10800' app/build.gradle.kts
          grep -q 'versionName = "0.8.0"' app/build.gradle.kts
          grep -q 'Admission Collector v0.8.0 Session Agent Cloud' app/src/main/AndroidManifest.xml

          grep -q 'AndroidKeyStore' "$SESSION"
          grep -q 'AES/GCM/NoPadding' "$SESSION"
          grep -q 'captureAuthenticated' "$SESSION"
          grep -q 'fun restore' "$SESSION"
          grep -q 'cloudExportAllowed' "$SESSION"
          grep -q 'sessionVault.restore' "$MAIN"
          grep -q 'sessionVault.captureAuthenticated' "$MAIN"

          grep -q 'object JinhakAgentNavigator' "$AGENT"
          grep -q 'maybeExecuteJinhakAgentAction' "$MAIN"
          grep -q 'agentActions' "$SNAP"
          grep -q 'MAX_JINHAK_AGENT_ACTIONS' "$MAIN"

          grep -q 'publishFrontier' "$CLIENT"
          grep -q 'claimFrontier' "$CLIENT"
          grep -q 'completeFrontier' "$CLIENT"
          grep -q 'probeFrontier' "$COORD"
          grep -q 'cloudFrontierPublished' "$MAIN"
          grep -q 'cloudFrontierClaimed' "$MAIN"

          grep -q 'version: "0.4.0"' "$WORKER"
          grep -q '/v1/frontier/batch' "$WORKER"
          grep -q '/v1/frontier/claim' "$WORKER"
          grep -q '/v1/frontier/complete' "$WORKER"
          grep -q 'acceptsBrowserSessionMaterial: false' "$WORKER"
          grep -q 'async scheduled' "$WORKER"
          grep -q "provider='adiga'" "$WORKER"
          grep -q 'CREATE TABLE IF NOT EXISTS crawl_frontier' cloudflare/migrations/0004_crawl_frontier.sql
          grep -q 'public_page_snapshots' cloudflare/migrations/0004_crawl_frontier.sql
          grep -q '"crons": \["\*/5 \* \* \* \*"\]' cloudflare/wrangler.jsonc
          node --check "$WORKER"

      - name: Verify secret and navigation safety boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          main = Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt').read_text()
          session = Path('app/src/main/java/com/admissionhub/collector/session/SecureSessionVault.kt').read_text()
          agent = Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakAgentNavigator.kt').read_text()
          worker = Path('cloudflare/src/index.js').read_text()
          coord = Path('app/src/main/java/com/admissionhub/collector/cloud/CloudOffloadCoordinator.kt').read_text()
          snap = Path('app/src/main/java/com/admissionhub/collector/capture/SnapshotScript.kt').read_text()
          store = Path('app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt').read_text()

          if 'CloudOffload' in session or 'HttpURLConnection' in session or 'URL(' in session:
              raise SystemExit('session vault has a network/cloud dependency')
          for secret in ['password', 'csrf', 'captcha', 'raw DOM']:
              if secret.lower() not in session.lower():
                  raise SystemExit(f'missing explicit vault boundary documentation: {secret}')
          if 'leaseId' not in session or 'UUID.randomUUID' not in session:
              raise SystemExit('opaque session lease id missing')

          for token in ['원서', '접수', '결제', '구매', '저장', '삭제', '탈퇴', '로그아웃', '회원정보', '제출', '확정']:
              if token not in agent:
                  raise SystemExit(f'missing agent block token: {token}')
          if 'input.value' in agent or 'document.cookie' in agent:
              raise SystemExit('agent reads form values or cookies')

          if 'cookieHeader' in worker or 'document.cookie' in worker or 'sessionStorage' in worker or 'localStorage' in worker:
              raise SystemExit('worker handles browser session material')
          public = worker.split('async function processPublicFrontier',1)[1].split('function scopeProviderFingerprint',1)[0]
          if "provider='adiga'" not in public:
              raise SystemExit('public scheduled cloud fetch is not Adiga-only')
          if "provider='jinhak'" in public or 'provider="jinhak"' in public:
              raise SystemExit('authenticated Jinhak was added to public cloud fetch')

          if 'function departmentContextFor' not in snap or 'function universityContextFor' not in snap:
              raise SystemExit('Jinhak context functions missing')
          dept = snap.split('function departmentContextFor',1)[1].split('function universityContextFor',1)[0]
          if 'previousElementSibling' in dept or 'nextElementSibling' in dept:
              raise SystemExit('cross-card department inheritance was reintroduced')

          for token in ['JINHAK_ABSOLUTE_TARGET_MS = 35_000L','onRenderProcessGone','installRuntimeCrashGuard','onTrimMemory','localStore.writeUnifiedExport(streamSession, writer)']:
              if token not in main:
                  raise SystemExit(f'missing retained runtime guard: {token}')
          if 'assistant-xlsx-dashboard-generation' not in store or 'doNotInferMissingBindings' not in store:
              raise SystemExit('analysis-ready export contract regressed')
          if 'frontierAvailable' not in coord:
              raise SystemExit('cloud capability fallback missing')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_SECRET"
          STORE_FILE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -pass env:ANDROID_SIGNING_SECRET \
            -in signing/admission-upload.keystore.enc \
            -out "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build v0.8.0 APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify v0.8.0 APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "versionCode='10800'" /tmp/badging.txt
          grep -q "versionName='0.8.0'" /tmp/badging.txt
          grep -q "application-label:'Admission Collector v0.8.0 Session Agent Cloud'" /tmp/badging.txt
          sha256sum "$APK" | tee /tmp/apk.sha256

      - name: Persist generated v0.8.0 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/admissionhub/collector/MainActivity.kt \
            app/src/main/java/com/admissionhub/collector/capture/SnapshotScript.kt \
            app/src/main/java/com/admissionhub/collector/cloud/CloudOffloadClient.kt \
            app/src/main/java/com/admissionhub/collector/cloud/CloudOffloadCoordinator.kt \
            app/src/main/java/com/admissionhub/collector/session/SecureSessionVault.kt \
            app/src/main/java/com/admissionhub/collector/jinhak/JinhakAgentNavigator.kt \
            app/build.gradle.kts \
            app/src/main/AndroidManifest.xml \
            cloudflare/src/index.js \
            cloudflare/wrangler.jsonc \
            cloudflare/migrations/0004_crawl_frontier.sql
          if ! git diff --cached --quiet; then
            git commit -m "Apply v0.8.0 session agent cloud architecture"
            git push origin HEAD:main
          fi

      - name: Upload v0.8.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: admission-collector-v0.8.0-session-agent-cloud-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
