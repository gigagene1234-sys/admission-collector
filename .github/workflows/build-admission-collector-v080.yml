name: Build Admission Collector v0.8.0 Post-0.7.1 Quality

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-admission-collector-v080.yml"
      - "scripts/apply_v080_post071_quality.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}

    steps:
      - name: Checkout committed v0.8.0 base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply post-v0.7.1 quality patch
        run: python3 scripts/apply_v080_post071_quality.py

      - name: Verify post-v0.7.1 collection invariants
        shell: bash
        run: |
          set -euo pipefail
          MAIN=app/src/main/java/com/admissionhub/collector/MainActivity.kt
          JINHAK=app/src/main/java/com/admissionhub/collector/provider/JinhakAdapter.kt
          STORE=app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt
          SESSION=app/src/main/java/com/admissionhub/collector/session/SecureSessionVault.kt
          AGENT=app/src/main/java/com/admissionhub/collector/jinhak/JinhakAgentNavigator.kt
          WORKER=cloudflare/src/index.js
          SNAP=app/src/main/java/com/admissionhub/collector/capture/SnapshotScript.kt

          grep -q 'private const val VERSION = "0.8.0"' "$MAIN"
          grep -q 'private const val BUILD_CODE = 10800' "$MAIN"
          grep -q 'versionCode = 10800' app/build.gradle.kts
          grep -q 'versionName = "0.8.0"' app/build.gradle.kts

          # v0.7.1 finding A: identical rendered states must not re-expand links forever.
          grep -q 'jinhakExpandedNavigationStates' "$MAIN"
          grep -q 'jinhakRepeatedNavigationStateSkips' "$MAIN"
          grep -q 'ObservationEvidence.identity' "$MAIN"
          grep -q 'jinhak-repeat-state-expansion-skip' "$MAIN"
          grep -q 'uniqueNavigationExpansionStates' "$MAIN"

          # v0.7.1 finding B: route-first classification, no heading-only SAT-minimum fallback.
          grep -q 'jinhak-admission-strategy' "$JINHAK"
          grep -q 'jinhak-admission-feature' "$JINHAK"
          grep -q 'jinhak-media-content' "$JINHAK"
          grep -q 'normalizeTableEvidence' "$JINHAK"
          grep -q 'jinhak-table-evidence' "$JINHAK"
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app/src/main/java/com/admissionhub/collector/provider/JinhakAdapter.kt').read_text()
          bad = 'url.contains("esatminuniv") || Regex("(수능최저|최저학력기준)").containsMatchIn(headingText)'
          if bad in text:
              raise SystemExit('broad heading-only SAT-minimum classifier reintroduced')
          if 'GenericAdmissionParser.normalize(snapshot)' not in text:
              raise SystemExit('generic parser unexpectedly removed entirely')
          gate = 'pageType in setOf("jinhak-actual-admit-report", "jinhak-score-calc-report")'
          if gate not in text:
              raise SystemExit('generic parser is not page-type gated')
          PY

          # v0.7.1 finding C: Errors sheet must have actual row-level evidence.
          grep -q 'errorEvidence' "$STORE"
          grep -q 'syncDiagnostics' "$STORE"
          grep -q 'SELECT navigation_key,state,error_type,retry_count,updated_at FROM documents' "$STORE"
          grep -q 'contractVersion\\\":2' "$STORE"

          # Retain the established privacy and context boundaries.
          grep -q 'AndroidKeyStore' "$SESSION"
          grep -q 'AES/GCM/NoPadding' "$SESSION"
          grep -q 'object JinhakAgentNavigator' "$AGENT"
          grep -q 'JINHAK_ABSOLUTE_TARGET_MS = 35_000L' "$MAIN"
          grep -q 'localStore.writeUnifiedExport(streamSession, writer)' "$MAIN"
          grep -q 'acceptsBrowserSessionMaterial: false' "$WORKER"
          grep -q "provider='adiga'" "$WORKER"
          python3 - <<'PY'
          from pathlib import Path
          snap = Path('app/src/main/java/com/admissionhub/collector/capture/SnapshotScript.kt').read_text()
          agent = Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakAgentNavigator.kt').read_text()
          worker = Path('cloudflare/src/index.js').read_text()
          dept = snap.split('function departmentContextFor',1)[1].split('function universityContextFor',1)[0]
          if 'previousElementSibling' in dept or 'nextElementSibling' in dept:
              raise SystemExit('cross-card department inheritance reintroduced')
          for token in ['원서','접수','결제','저장','삭제','로그아웃','제출','확정']:
              if token not in agent:
                  raise SystemExit(f'missing agent safety token: {token}')
          if 'cookieHeader' in worker or 'document.cookie' in worker or 'sessionStorage' in worker:
              raise SystemExit('cloud worker handles browser session material')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_SECRET"
          STORE_FILE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -pass env:ANDROID_SIGNING_SECRET \
            -in signing/admission-upload.keystore.enc \
            -out "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build revised v0.8.0 APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify revised v0.8.0 APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "versionCode='10800'" /tmp/badging.txt
          grep -q "versionName='0.8.0'" /tmp/badging.txt
          grep -q "application-label:'Admission Collector v0.8.0 Session Agent Cloud'" /tmp/badging.txt
          sha256sum "$APK" | tee /tmp/apk.sha256

      - name: Persist revised v0.8.0 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/admissionhub/collector/MainActivity.kt \
            app/src/main/java/com/admissionhub/collector/provider/JinhakAdapter.kt \
            app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt
          if ! git diff --cached --quiet; then
            git commit -m "Apply v0.8.0 post-v0.7.1 quality fixes"
            git push origin HEAD:main
          fi

      - name: Upload revised v0.8.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: admission-collector-v0.8.0-post071-quality-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
