name: Build Admission Hub v0.16.5 Login Handoff Dashboard Gates

on:
  push:
    branches: [codex/v0165-auth-exit-dashboard-gates]
    paths:
      - "app/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: admission-hub-v0165
  cancel-in-progress: true

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}
      APK_NAME: Admission-Hub-v0.16.5-Login-Handoff-Dashboard-Gates.apk
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify v0.16.5 product contracts
        run: python3 .github/scripts/verify_v0165.py

      - name: Verify v0.16.4 baseline exists
        shell: bash
        run: |
          set -euo pipefail
          BASE=91ee2fa6227e0282aaa2bdd735aa37e9a796a625
          git cat-file -e "$BASE^{commit}"
          git show "$BASE:app/src/main/java/com/admissionhub/collector/MainActivity.kt" | grep -F 'private fun jinhakAuthCompatibilityWindowActive()' >/dev/null
          git show "$BASE:app/src/main/java/com/admissionhub/collector/MainActivity.kt" | grep -F 'private fun attemptSavedCredentialLoginV0912Baseline(reason: String)' >/dev/null
          echo "v0.16.4 passive-login baseline is present"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_SECRET"
          STORE_FILE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ANDROID_SIGNING_SECRET -in signing/admission-upload.keystore.enc -out "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Test all application and regression contracts
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Compile signed product
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK package version label and stable signer
        run: bash .github/scripts/verify_apk_v0165.sh

      - name: Clean rebuild and retest exact committed source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git reset --hard "$GITHUB_SHA"
          python3 .github/scripts/verify_v0165.py
          gradle --no-daemon clean :app:testDebugUnitTest :app:assembleDebug
          bash .github/scripts/verify_apk_v0165.sh
          git diff --exit-code

      - name: Package APK and verification report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/$APK_NAME"
          (cd dist && sha256sum "$APK_NAME" > "$APK_NAME.sha256")
          python3 - <<'PY'
          import glob,json,os,xml.etree.ElementTree as E
          suites=[E.parse(f).getroot() for f in glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml')]
          counts={k:sum(int(s.get(k,'0')) for s in suites) for k in ['tests','failures','errors','skipped']}
          assert counts['tests']>=102, counts
          assert counts['failures']==counts['errors']==counts['skipped']==0, counts
          report={
            'productCommit':os.environ['GITHUB_SHA'],
            'versionName':'0.16.5','versionCode':116500,'tests':counts,
            'signerSha256':'db6cd5efceda108657662d06f857e5f0277301cb6ab97a75c8a01994c96e4995',
            'exactCommittedSourceRebuild':True,
            'baseline':'v0.16.4-91ee2fa6227e0282aaa2bdd735aa37e9a796a625',
            'siteLoginSurfaceStableWithoutCollectorCredential':True,
            'protectedHigh3ClosesRealAuthProbe':True,
            'dashboardSequentialCompletionGates':True,
            'dashboardMissingWarningsRisksSurfaced':True,
            'credentialsExported':False,
            'cookiesExported':False,
            'jinhakPromotedToOfficial':False,
            'historicalBindingRelaxed':False,
            'probabilityInferred':False,
            'deviceAcceptance':'pending-real-galaxy-protected-core-batch-and-evidence'
          }
          open('dist/verification-v0.16.5.json','w').write(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(report,ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: admission-hub-v0.16.5-login-handoff-dashboard-gates
          path: |
            dist/*
            app/build/test-results/testDebugUnitTest/*.xml

      - name: Publish verified v0.16.5 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v0.16.5 >/dev/null 2>&1 && gh release delete v0.16.5 -y --cleanup-tag || true
          gh release create v0.16.5 "dist/$APK_NAME" "dist/$APK_NAME.sha256" dist/verification-v0.16.5.json \
            --target "$GITHUB_SHA" --title "Admission Hub v0.16.5 — Login Handoff + Dashboard Gates" \
            --notes-file docs/releases/v0.16.5.md
