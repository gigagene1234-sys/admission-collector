name: Build Admission Collector v0.9.17 Real Jinhak Auth Gate

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-admission-collector-v0917.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}
    outputs:
      source_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Read-only live Jinhak public route check
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          curl -A "Mozilla/5.0 AdmissionCollector-ReadOnly-Probe" -L --fail --max-time 25 --retry 2 \
            https://www.jinhak.com/jh/member/login -o /tmp/jinhak-login.html
          curl -A "Mozilla/5.0 AdmissionCollector-ReadOnly-Probe" -L --fail --max-time 25 --retry 2 \
            https://www.jinhak.com/jh/high3/jinhak-tv -o /tmp/jinhak-high3.html
          python3 - <<'PY'
          from pathlib import Path
          login=Path('/tmp/jinhak-login.html').read_text(errors='ignore')
          high3=Path('/tmp/jinhak-high3.html').read_text(errors='ignore')
          print('live login bytes', len(login), 'high3 bytes', len(high3))
          if not login or not high3:
              raise SystemExit('live Jinhak public route returned empty content')
          # This is public/read-only route evidence only. Authenticated verification
          # intentionally happens in the Galaxy Tab WebView using CredentialVault.
          PY

      - name: Apply v0.9.17 real Jinhak auth gate patch
        run: python3 .github/scripts/patch_v0917.py

      - name: Verify bounded change surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          allowed={
            'app/src/main/java/com/admissionhub/collector/MainActivity.kt',
            'app/build.gradle.kts',
            'app/src/main/AndroidManifest.xml',
          }
          extra=changed-allowed
          missing=allowed-changed
          if extra: raise SystemExit('Unexpected files changed: '+', '.join(sorted(extra)))
          if missing: raise SystemExit('Required files not changed: '+', '.join(sorted(missing)))
          print('v0.9.17 file boundary passed')
          PY

      - name: Verify v0.9.17 invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          m=Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt').read_text()
          p=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakSlowLanePool.kt').read_text()
          l=Path('app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt').read_text()
          s=Path('app/src/main/java/com/admissionhub/collector/capture/SnapshotScript.kt').read_text()
          g=Path('app/build.gradle.kts').read_text()
          manifest=Path('app/src/main/AndroidManifest.xml').read_text()
          req={
            'version':'private const val VERSION = "0.9.17"' in m and 'private const val BUILD_CODE = 109170' in m,
            'gradle':'versionCode = 109170' in g and 'versionName = "0.9.17"' in g,
            'label':'Admission Collector v0.9.17 Real Jinhak Auth Gate' in manifest,
            'real-auth-probe':'startJinhakRealAuthProbe' in m and 'handleJinhakRealAuthProbePageFinished' in m,
            'real-site':'"www.jinhak.com"' in m and 'actualSite' in m,
            'protected-core':'JinhakSiteTopology.missionSeeds().firstOrNull()' in m and 'real-protected-core-stable' in m,
            'route-cycle':'auth-route-cycle-detected' in m and 'MAX_JINHAK_REAL_AUTH_ROUTE_TRANSITIONS = 14' in m,
            'bounded-time':'JINHAK_REAL_AUTH_PROBE_TIMEOUT_MS = 90_000L' in m,
            'fresh-proof-reuse':'startup-jinhak-real-auth-proof-reused' in m and 'homeNavigationSkipped' in m,
            'manual-probe':'진학사 실제 로그인 진단' in m,
            'no-proactive-login':'webView.loadUrl(providerLoginUrl' not in m,
            'v0916-preserved':'quarantineJinhakTargetSpecificAuthRedirect' in m and 'MAX_JINHAK_TARGET_AUTH_REDIRECT_CYCLES = 2' in m,
            'mission-stall-preserved':'recoverOrStopJinhakMissionStall' in m and 'MAX_JINHAK_MISSION_STALL_RECOVERIES = 2' in m,
            'renderer-circuit-preserved':'const val DEFAULT_MAX_WORKERS = 1' in p and 'rendererCircuitOpen' in p,
            'mission-persistence-preserved':'CREATE TABLE IF NOT EXISTS jinhak_mission_targets' in l and 'monotonicStateGuard' in l,
            'same-card-preserved':'same-card-action-not-found' in m and 'MAX_JINHAK_SAME_CARD_REPLAY_ATTEMPTS = 3' in m,
            'susi-core-preserved':'isDefaultSusiCoreTraversalUrl' in m,
            'snapshot-privacy':'safeCloneText' in s and 'input,textarea,select,option,form' in s,
            'probe-privacy':'sanitized-host-path-only-no-query' in m and '.put("cookieExported", false)' in m and '.put("formValuesExported", false)' in m,
          }
          failed=[k for k,v in req.items() if not v]
          if failed: raise SystemExit('Missing invariant(s): '+', '.join(failed))
          if '.put("username", credentials.username)' in m or '.put("password", credentials.password)' in m:
              raise SystemExit('credential export invariant failed')
          print('v0.9.17 invariants passed')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_SECRET"
          STORE_FILE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ANDROID_SIGNING_SECRET -in signing/admission-upload.keystore.enc -out "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Test and build patched source
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Verify patched APK
        shell: bash
        run: |
          set -euo pipefail
          SRC=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$SRC" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$SRC" | tee patched-badging.txt
          grep -q "versionCode='109170'" patched-badging.txt
          grep -q "versionName='0.9.17'" patched-badging.txt
          grep -q "application-label:'Admission Collector v0.9.17 Real Jinhak Auth Gate'" patched-badging.txt

      - name: Commit v0.9.17 source
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/admissionhub/collector/MainActivity.kt \
                  app/build.gradle.kts app/src/main/AndroidManifest.xml
          git commit -m "Implement v0.9.17 Real Jinhak Auth Gate"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  independent-main-build:
    needs: patch-build-commit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Refresh exact committed main
        run: |
          git fetch origin main
          git reset --hard origin/main
          test "$(git rev-parse HEAD)" = "${{ needs.patch-build-commit.outputs.source_sha }}"

      - name: Reverify committed v0.9.17
        run: |
          python3 - <<'PY'
          from pathlib import Path
          m=Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt').read_text()
          g=Path('app/build.gradle.kts').read_text()
          assert 'private const val VERSION = "0.9.17"' in m
          assert 'versionCode = 109170' in g
          assert 'startJinhakRealAuthProbe' in m
          assert 'auth-route-cycle-detected' in m
          assert 'startup-jinhak-real-auth-proof-reused' in m
          assert 'quarantineJinhakTargetSpecificAuthRedirect' in m
          assert 'recoverOrStopJinhakMissionStall' in m
          assert 'webView.loadUrl(providerLoginUrl' not in m
          print('committed v0.9.17 verified')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          STORE_FILE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ANDROID_SIGNING_SECRET -in signing/admission-upload.keystore.enc -out "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build committed main
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify and package final APK
        shell: bash
        run: |
          set -euo pipefail
          SRC=app/build/outputs/apk/debug/app-debug.apk
          OUT=Admission-Collector-v0.9.17-Real-Jinhak-Auth-Gate.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$SRC" | tee apksigner.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$SRC" | tee badging.txt
          grep -q "versionCode='109170'" badging.txt
          grep -q "versionName='0.9.17'" badging.txt
          grep -q "application-label:'Admission Collector v0.9.17 Real Jinhak Auth Gate'" badging.txt
          cp "$SRC" "$OUT"
          sha256sum "$OUT" | tee Admission-Collector-v0.9.17-Real-Jinhak-Auth-Gate.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: admission-collector-main-v0.9.17-final
          path: |
            Admission-Collector-v0.9.17-Real-Jinhak-Auth-Gate.apk
            Admission-Collector-v0.9.17-Real-Jinhak-Auth-Gate.sha256
            apksigner.txt
            badging.txt
          retention-days: 14

      - name: Publish v0.9.17 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          NOTES="v0.9.17 changes one area only: initial Jinhak authentication/preflight routing. The app now performs a bounded auth-only probe against the real www.jinhak.com protected Susi saved-application route before the full automatic sequence. It never proactively loads the login URL. If the real site redirects to its rendered login surface, the existing on-device encrypted CredentialVault may fill/submit that real form. Only two stable accesses to the protected core count as success. Sanitized host/path transitions are tracked and A-B-A-B/revisit/transition cycles terminate the probe instead of allowing a high3/high12/login loop. The probe times out after 90 seconds and failure never starts full collection. A successful proof is reused during the immediately following startup preflight so Jinhak home/high3 landing is skipped; after Adiga collection, the existing transition core revalidation still runs. A manual '진학사 실제 로그인 진단' button provides a short auth-only JSON diagnostic. No username/password/cookie/token/storage/form values are exported. Existing v0.9.16 target redirect quarantine, v0.9.15 mission stall fence, v0.9.14 renderer circuit, v0.9.13 same-card replay, v0.9.11 monotonic mission persistence and Susi-only/privacy protections are preserved. The CI public-site curl is read-only and credential-free; authenticated validation occurs on the Galaxy Tab against the real site. Commit: $SHA"
          gh release create v0.9.17 Admission-Collector-v0.9.17-Real-Jinhak-Auth-Gate.apk Admission-Collector-v0.9.17-Real-Jinhak-Auth-Gate.sha256 --target "$SHA" --title "Admission Collector v0.9.17 — Real Jinhak Auth Gate" --notes "$NOTES"
