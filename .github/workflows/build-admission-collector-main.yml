name: Build Admission Collector Main

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-admission-collector-main.yml"
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}

    steps:
      - name: Checkout committed source
        uses: actions/checkout@v4

      - name: Resolve and verify committed version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, os
          main = Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt').read_text()
          gradle = Path('app/build.gradle.kts').read_text()
          manifest = Path('app/src/main/AndroidManifest.xml').read_text()
          def one(pattern, text, label):
              m = re.search(pattern, text)
              if not m:
                  raise SystemExit(f'missing {label}')
              return m.group(1)
          main_version = one(r'private const val VERSION = "([^"]+)"', main, 'MainActivity VERSION')
          main_build = int(one(r'private const val BUILD_CODE = (\d+)', main, 'MainActivity BUILD_CODE'))
          gradle_version = one(r'versionName = "([^"]+)"', gradle, 'Gradle versionName')
          gradle_build = int(one(r'versionCode = (\d+)', gradle, 'Gradle versionCode'))
          label = one(r'android:label="([^"]+)"', manifest, 'application label')
          if main_version != gradle_version:
              raise SystemExit(f'version mismatch: main={main_version} gradle={gradle_version}')
          if main_build != gradle_build:
              raise SystemExit(f'build mismatch: main={main_build} gradle={gradle_build}')
          if main_version not in label:
              raise SystemExit(f'application label does not contain current version: {label}')
          with open(os.environ['GITHUB_ENV'], 'a') as fh:
              fh.write(f'APP_VERSION={main_version}\n')
              fh.write(f'APP_BUILD_CODE={main_build}\n')
              fh.write(f'APP_LABEL={label}\n')
          print(f'Committed version verified: {main_version} ({main_build}) / {label}')
          PY

      - name: Verify common architecture invariants
        shell: bash
        run: |
          set -euo pipefail
          MAIN=app/src/main/java/com/admissionhub/collector/MainActivity.kt
          STORE=app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt
          ADAPTER=app/src/main/java/com/admissionhub/collector/provider/JinhakAdapter.kt
          SYNC=app/src/main/java/com/admissionhub/collector/sync/UnifiedSyncState.kt
          test ! -f MainActivity.kt
          grep -q 'CREATE TABLE IF NOT EXISTS observations' "$STORE"
          grep -q 'fun storeObservationEvidence' "$STORE"
          grep -q 'fun writeObservations' "$STORE"
          grep -q 'unclassified-potential-value' "$MAIN"
          grep -q 'JinhakCapabilityProbe.javascript' "$MAIN"
          grep -q 'override val supportsBatchCrawl = true' "$ADAPTER"
          grep -q 'override fun isBatchNavigable' "$ADAPTER"
          grep -q 'PUBLIC_DETERMINISTIC_COLLECTION' app/src/main/java/com/admissionhub/collector/provider/ProviderCapability.kt
          grep -q 'JINHAK_AUTONOMOUS_CRAWL' "$SYNC"
          grep -q 'assistant-xlsx-dashboard-generation' "$STORE"
          grep -q 'recommendedWorkbookSheets' "$STORE"

          # v0.8.0 post-v0.7.1 quality gates.
          grep -q 'jinhakExpandedNavigationStates' "$MAIN"
          grep -q 'jinhakRepeatedNavigationStateSkips' "$MAIN"
          grep -q 'uniqueNavigationExpansionStates' "$MAIN"
          grep -q 'jinhak-admission-strategy' "$ADAPTER"
          grep -q 'jinhak-admission-feature' "$ADAPTER"
          grep -q 'jinhak-media-content' "$ADAPTER"
          grep -q 'normalizeTableEvidence' "$ADAPTER"
          grep -q 'jinhak-table-evidence' "$ADAPTER"
          grep -q 'errorEvidence' "$STORE"
          grep -q 'syncDiagnostics' "$STORE"
          grep -q 'contractVersion\\\":2' "$STORE"

      - name: Verify privacy observation and memory boundaries
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main=Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt').read_text()
          probe=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakAuthorizedConnector.kt').read_text()
          adapter=Path('app/src/main/java/com/admissionhub/collector/provider/JinhakAdapter.kt').read_text()
          store=Path('app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt').read_text()
          if 'jinhak-nonadmission-page-skipped' in main:
              raise SystemExit('unknown Jinhak observations are still discarded')
          if 'unifiedJinhakCapturedPages.contains(pageKey)' in main:
              raise SystemExit('URL-only Jinhak dedupe is active')
          for token in ['document.cookie','localStorage','sessionStorage','input.value','location.href','fetch(','XMLHttpRequest']:
              if token in probe:
                  raise SystemExit(f'capability probe reads forbidden material: {token}')
          if 'supportsBatchCrawl = false' in adapter:
              raise SystemExit('Jinhak autonomous crawler is not active')
          for token in ['payment','billing','purchase','order','refund','withdraw','logout','signout']:
              if token not in adapter:
                  raise SystemExit(f'missing crawler safety boundary: {token}')
          for token in ['JINHAK_ABSOLUTE_TARGET_MS = 35_000L','onRenderProcessGone','installRuntimeCrashGuard','onTrimMemory','localStore.writeUnifiedExport(streamSession, writer)']:
              if token not in main:
                  raise SystemExit(f'missing runtime/memory guard: {token}')
          if 'writeObservations' not in store or 'doNotInferMissingBindings' not in store:
              raise SystemExit('analysis-ready observation export regression')
          if 'pageType in setOf("jinhak-actual-admit-report", "jinhak-score-calc-report")' not in adapter:
              raise SystemExit('generic Jinhak parser is not page-type gated')
          if 'url.contains("esatminuniv") || Regex("(수능최저|최저학력기준)").containsMatchIn(headingText)' in adapter:
              raise SystemExit('broad SAT-minimum heading fallback reintroduced')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_SECRET"
          STORE_FILE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -pass env:ANDROID_SIGNING_SECRET \
            -in signing/admission-upload.keystore.enc \
            -out "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build committed source
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK against committed version
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -Fq "versionCode='$APP_BUILD_CODE'" /tmp/badging.txt
          grep -Fq "versionName='$APP_VERSION'" /tmp/badging.txt
          grep -Fq "application-label:'$APP_LABEL'" /tmp/badging.txt
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: admission-collector-main-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
