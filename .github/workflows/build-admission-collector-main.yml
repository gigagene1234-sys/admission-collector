name: Build Admission Collector Main

# Superseded: retained for explicitly requested historical investigations only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}

    steps:
      - name: Checkout committed source
        uses: actions/checkout@v4

      - name: Resolve and verify committed version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, os
          main = Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt').read_text()
          gradle = Path('app/build.gradle.kts').read_text()
          manifest = Path('app/src/main/AndroidManifest.xml').read_text()
          def one(pattern, text, label):
              m = re.search(pattern, text)
              if not m: raise SystemExit(f'missing {label}')
              return m.group(1)
          main_version = one(r'private const val VERSION = "([^"]+)"', main, 'MainActivity VERSION')
          main_build = int(one(r'private const val BUILD_CODE = (\d+)', main, 'MainActivity BUILD_CODE'))
          gradle_version = one(r'versionName = "([^"]+)"', gradle, 'Gradle versionName')
          gradle_build = int(one(r'versionCode = (\d+)', gradle, 'Gradle versionCode'))
          label = one(r'android:label="([^"]+)"', manifest, 'application label')
          if main_version != gradle_version: raise SystemExit(f'version mismatch: {main_version} != {gradle_version}')
          if main_build != gradle_build: raise SystemExit(f'build mismatch: {main_build} != {gradle_build}')
          if main_version not in label: raise SystemExit(f'label/version mismatch: {label}')
          with open(os.environ['GITHUB_ENV'], 'a') as fh:
              fh.write(f'APP_VERSION={main_version}\nAPP_BUILD_CODE={main_build}\nAPP_LABEL={label}\n')
          print(f'Committed version verified: {main_version} ({main_build}) / {label}')
          PY

      - name: Verify current cumulative safety and reliability invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          main=Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt').read_text()
          store=Path('app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt').read_text()
          adapter=Path('app/src/main/java/com/admissionhub/collector/provider/JinhakAdapter.kt').read_text()
          snap=Path('app/src/main/java/com/admissionhub/collector/capture/SnapshotScript.kt').read_text()
          mission=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakApplicationMission.kt').read_text()
          agent=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakAgentNavigator.kt').read_text()
          slow=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakSlowLanePool.kt').read_text()
          cell_path=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakMissionCellSupervisor.kt')
          sync=Path('app/src/main/java/com/admissionhub/collector/sync/UnifiedSyncState.kt').read_text()

          required={
              'observation-store': 'CREATE TABLE IF NOT EXISTS observations' in store and 'fun storeObservationEvidence' in store,
              'mission-sqlite': 'CREATE TABLE IF NOT EXISTS jinhak_mission_targets' in store and 'monotonicStateGuard' in store,
              'batch-crawl-disabled': 'override val supportsBatchCrawl = false' in adapter,
              'user-session-mission': 'override val supportsUserSessionMissionTraversal = true' in adapter,
              'unknown-preserved': 'unclassified-potential-value' in main,
              'same-card-safety': 'same-card-action-not-found' in main and 'MAX_JINHAK_SAME_CARD_REPLAY_ATTEMPTS = 3' in main,
              'renderer-recovery': 'onRenderProcessGone' in main and 'rendererCircuitOpen' in slow,
              'single-hidden-worker': 'const val DEFAULT_MAX_WORKERS = 1' in slow,
              'slow-hard-max': 'HARD_MAX_MS = 120_000L' in slow,
              'mission-stall-fence': 'recoverOrStopJinhakMissionStall' in main and 'MAX_JINHAK_MISSION_STALL_RECOVERIES = 2' in main,
              'target-auth-guard': 'quarantineJinhakTargetSpecificAuthRedirect' in main,
              'real-auth-probe': 'protected-core-stable' in main and 'MAX_JINHAK_REAL_AUTH_ROUTE_TRANSITIONS = 14' in main,
              'auth-proof-resume': 'persistJinhakAuthProofCheckpoint' in main and 'restoreJinhakAuthProofCheckpoint' in main,
              'consent-explicit': 'JINHAK_USER_CONSENT_REQUIRED' in sync and 'jinhak-ai-diagnosis-consent' in snap,
              'snapshot-privacy': 'safeCloneText' in snap and 'input,textarea,select,option,form' in snap,
          }
          failed=[k for k,v in required.items() if not v]
          if failed: raise SystemExit('Invariant failure: '+', '.join(failed))

          if 'jinhak-nonadmission-page-skipped' in main:
              raise SystemExit('unknown Jinhak observations discarded')
          if 'unifiedJinhakCapturedPages.contains(pageKey)' in main:
              raise SystemExit('URL-only Jinhak dedupe active')
          if '철도차량시스템공학과' in mission:
              raise SystemExit('raw mission parser invents canonical department')
          dept=snap.split('function departmentContextFor',1)[1].split('function universityContextFor',1)[0]
          if 'previousElementSibling' in dept or 'nextElementSibling' in dept:
              raise SystemExit('cross-card department inheritance')

          for token in ['원서','접수','결제','저장','삭제','로그아웃','제출','확정','동의','미동의']:
              if token not in agent: raise SystemExit('agent safety boundary missing: '+token)
          forbidden=[
              r'document\s*\.\s*cookie',
              r'(?:window\s*\.\s*)?localStorage\s*(?:\.|\[)',
              r'(?:window\s*\.\s*)?sessionStorage\s*(?:\.|\[)',
              r'querySelector[^\n]{0,160}\.value',
              r'getElementById[^\n]{0,160}\.value',
              r'\binput\s*\.\s*value'
          ]
          for pat in forbidden:
              if re.search(pat, slow): raise SystemExit('slow lane reads forbidden material: '+pat)

          # v0.9.19+ must wire the lower-cell ownership model, not merely ship the class.
          version_match=re.search(r'private const val VERSION = "([^"]+)"', main)
          version=version_match.group(1) if version_match else ''
          if version == '0.9.19' or version.startswith('0.9.2') or version.startswith('0.10.'):
              if not cell_path.exists(): raise SystemExit('mission cell supervisor missing')
              cell=cell_path.read_text()
              cell_checks={
                  'token': 'data class Token' in cell and 'rendererGeneration' in cell,
                  'stale-expiry': 'expireStaleOwnership' in cell,
                  'late-callback': 'LATE_CALLBACK_IGNORED' in cell,
                  'timeline': 'recentEvents' in cell and 'blockedBy' in cell,
                  'action-wired': 'jinhakMissionCells.beginAction(' in main and 'jinhakMissionCells.finishAction(' in main,
                  'snapshot-wired': 'jinhakMissionCells.beginSnapshot(' in main and 'jinhakMissionCells.finishSnapshot(' in main,
                  'renderer-wired': 'jinhakMissionCells.onRendererGone(' in main,
                  'diagnostics-wired': '.put("missionCells", jinhakMissionCells.diagnostics' in main,
              }
              missing=[k for k,v in cell_checks.items() if not v]
              if missing: raise SystemExit('Mission cell integration failure: '+', '.join(missing))
          print('Current architecture invariants passed')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_SECRET"
          STORE_FILE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ANDROID_SIGNING_SECRET -in signing/admission-upload.keystore.enc -out "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build committed source
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK against committed version and signer
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -Fq "versionCode='$APP_BUILD_CODE'" /tmp/badging.txt
          grep -Fq "versionName='$APP_VERSION'" /tmp/badging.txt
          grep -Fq "application-label:'$APP_LABEL'" /tmp/badging.txt
          grep -qi 'db6cd5efceda108657662d06f857e5f0277301cb6ab97a75c8a01994c96e4995' /tmp/apksigner.txt
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: admission-collector-main-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
