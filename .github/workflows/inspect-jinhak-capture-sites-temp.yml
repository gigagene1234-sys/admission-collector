name: Inspect Jinhak Capture Sites Temp
on:
  push:
    branches: [ main ]
    paths: [".github/workflows/inspect-jinhak-capture-sites-temp.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print capture sites
        shell: bash
        run: |
          set -euo pipefail
          M=app/src/main/java/com/admissionhub/collector/MainActivity.kt
          grep -n 'updateUnifiedSession(sessionId, "jinhak", "running", null)' "$M" || true
          for n in $(grep -n 'updateUnifiedSession(sessionId, "jinhak", "running", null)' "$M" | cut -d: -f1); do s=$((n-40)); e=$((n+12)); echo "--- $s-$e ---"; sed -n "${s},${e}p" "$M"; done
          echo '=== persistRuntimeCheckpoint ==='
          grep -n 'private fun persistRuntimeCheckpoint' "$M" || true
          n=$(grep -n 'private fun persistRuntimeCheckpoint' "$M" | head -1 | cut -d: -f1); if [ -n "$n" ]; then s=$((n-10)); e=$((n+100)); sed -n "${s},${e}p" "$M"; fi
