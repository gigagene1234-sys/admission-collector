name: Build Admission Hub v0.11.1 Hub-First Dashboard

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-admission-hub-v0111.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}
      APK_NAME: Admission-Hub-v0.11.1-Hub-First-Dashboard.apk

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.11.1 Hub-first patch
        run: python3 .github/scripts/patch_v0111.py

      - name: Verify cumulative safety and Hub-first invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          main=Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt').read_text()
          model=Path('app/src/main/java/com/admissionhub/collector/hub/HubDashboardModel.kt').read_text()
          policy=Path('app/src/main/java/com/admissionhub/collector/hub/HubFirstLayoutPolicy.kt').read_text()
          store=Path('app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt').read_text()
          adapter=Path('app/src/main/java/com/admissionhub/collector/provider/JinhakAdapter.kt').read_text()
          cell=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakMissionCellSupervisor.kt').read_text()
          checks={
            'version': 'private const val VERSION = "0.11.1"' in main and 'private const val BUILD_CODE = 111010' in main,
            'hub-first-grid': 'hubDashboardGrid' in main and 'primaryActions' in main,
            'responsive-policy': 'columnsForWidthDp' in policy and 'widthDp >= 900 -> 3' in policy,
            'advanced-collapsed': 'advancedToolsInitiallyVisible = false' in policy and 'hubAdvancedPanel' in main,
            'webview-advanced-only': 'hubAdvancedPanel.addView(browserStack' in main,
            'status-single-source': '통합 상태:' in main and 'hubDashboardStatus.text' in main,
            'six-card-model': 'object HubDashboardModel' in model and 'SLOT_COUNT = 6' in model,
            'quality-visible': '공식 전형 연결 확인 필요' in model and 'provider-only' in model,
            'local-rebind-preserved': 'runLocalRebindOnly' in main and 'localRebindDecision' in main,
            'selected-six-preserved': 'startSelectedSixRecovery' in main,
            'batch-crawl-disabled': 'override val supportsBatchCrawl = false' in adapter,
            'user-session-mission': 'override val supportsUserSessionMissionTraversal = true' in adapter,
            'hard-lease-preserved': 'expireStaleOwnership' in cell and 'LATE_CALLBACK_IGNORED' in cell,
            'prediction-history-separation': 'predictionDoesNotOverwriteHistoricalActual' in store,
            'privacy': 'credentialExported' in main and 'sessionSecretExported' in main,
          }
          failed=[k for k,v in checks.items() if not v]
          if failed: raise SystemExit('v0.11.1 invariant failure: '+', '.join(failed))
          if 'autoSelectTopSix' in main or 'inferMissingAdmission' in model:
              raise SystemExit('Hub-first UI must not mutate or infer application identity')
          print('v0.11.1 Hub-first + cumulative safety invariants passed')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_SECRET"
          STORE_FILE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ANDROID_SIGNING_SECRET -in signing/admission-upload.keystore.enc -out "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run Hub dashboard and layout Mission Lab tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Compile patched source
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK metadata and stable signer
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -Fq "versionCode='111010'" /tmp/badging.txt
          grep -Fq "versionName='0.11.1'" /tmp/badging.txt
          grep -Fq "application-label:'Admission Hub v0.11.1 Hub-First Dashboard'" /tmp/badging.txt
          grep -qi 'db6cd5efceda108657662d06f857e5f0277301cb6ab97a75c8a01994c96e4995' /tmp/apksigner.txt

      - name: Commit v0.11.1 product source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/admissionhub/collector/MainActivity.kt \
            app/src/main/java/com/admissionhub/collector/hub/HubFirstLayoutPolicy.kt \
            app/src/test/java/com/admissionhub/collector/hub/HubFirstLayoutPolicyTest.kt \
            app/build.gradle.kts \
            app/src/main/AndroidManifest.xml
          git commit -m "Implement v0.11.1 Hub-first responsive dashboard"
          git push origin HEAD:main
          PRODUCT_SHA=$(git rev-parse HEAD)
          echo "PRODUCT_SHA=$PRODUCT_SHA" >> "$GITHUB_ENV"
          echo "Product commit: $PRODUCT_SHA"

      - name: Rebuild and retest exact committed product source
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$PRODUCT_SHA"
          rm -rf app/build
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/final-apksigner.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/final-badging.txt
          grep -Fq "versionCode='111010'" /tmp/final-badging.txt
          grep -Fq "versionName='0.11.1'" /tmp/final-badging.txt
          grep -Fq "application-label:'Admission Hub v0.11.1 Hub-First Dashboard'" /tmp/final-badging.txt
          grep -qi 'db6cd5efceda108657662d06f857e5f0277301cb6ab97a75c8a01994c96e4995' /tmp/final-apksigner.txt

      - name: Package final APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/$APK_NAME"
          sha256sum "dist/$APK_NAME" | tee "dist/$APK_NAME.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: admission-hub-v0.11.1-hub-first-dashboard
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish v0.11.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete v0.11.1 --yes --cleanup-tag >/dev/null 2>&1 || true
          git tag -f v0.11.1 "$PRODUCT_SHA"
          git push origin -f v0.11.1
          gh release create v0.11.1 \
            "dist/$APK_NAME" "dist/$APK_NAME.sha256" \
            --target "$PRODUCT_SHA" \
            --title "Admission Hub v0.11.1 — Hub-First Responsive Dashboard" \
            --notes "UI-focused follow-up to v0.11.0. Makes the six pinned applications the primary app surface, uses a responsive 3x2 grid on wide tablets (2-column/1-column fallback on narrower devices), collapses WebView/JSON/provider diagnostics into an explicit Advanced Tools panel, keeps only integrated sync + six-slot management + selected-six recovery in the primary action row, mirrors legacy diagnostic status from the authoritative dashboard state, and visually distinguishes accepted/provisional/provider-only/incomplete cards without changing any canonical identity or collection semantics. Local rebind, user-controlled six slots, selected-six recovery, auth-domain separation, hard mission-cell lease, observation-first evidence, prediction/history separation, stable signer and privacy invariants are preserved. Product commit: $PRODUCT_SHA"
