name: Build Admission Collector v0.8.6 Persistent Mission Ledger

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-admission-collector-v086.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Apply v0.8.6 implementation
        run: python3 scripts/apply_v086_persistent_mission_target_ledger.py

      - name: Verify v0.8.6 source invariants
        shell: bash
        run: |
          set -euo pipefail
          MAIN=app/src/main/java/com/admissionhub/collector/MainActivity.kt
          LEDGER=app/src/main/java/com/admissionhub/collector/jinhak/JinhakMissionTargetLedger.kt
          SNAP=app/src/main/java/com/admissionhub/collector/capture/SnapshotScript.kt
          AGENT=app/src/main/java/com/admissionhub/collector/jinhak/JinhakAgentNavigator.kt
          ADAPTER=app/src/main/java/com/admissionhub/collector/provider/JinhakAdapter.kt
          YEAR=app/src/main/java/com/admissionhub/collector/jinhak/JinhakReportYearGuard.kt
          STORE=app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt

          grep -q 'VERSION = "0.8.6"' "$MAIN"
          grep -q 'BUILD_CODE = 10860' "$MAIN"
          grep -q 'versionCode = 10860' app/build.gradle.kts
          grep -q 'versionName = "0.8.6"' app/build.gradle.kts
          grep -q 'Admission Collector v0.8.6 Persistent Mission Ledger' app/src/main/AndroidManifest.xml

          grep -q 'JinhakMissionTargetLedger' "$MAIN"
          grep -q 'jinhakMissionTargetLedger.capture' "$MAIN"
          grep -q 'nextPendingAtOrigin' "$MAIN"
          grep -q 'originForNextPending' "$MAIN"
          grep -q 'missionTargetLedgerOutstanding' "$MAIN"
          grep -q 'markDeferred' "$MAIN"
          grep -q 'slow-lane-report-unconfirmed' "$MAIN"
          grep -q 'report-unconfirmed' "$MAIN"
          grep -q 'missionAgentActions' "$SNAP"
          grep -q 'append("missionAgentActions", promoted = true' "$AGENT"

          grep -q 'enum class State { PENDING, CLICKED, DEFERRED, CONFIRMED, FAILED, SKIPPED }' "$LEDGER"
          grep -q 'fun capture(originRoute' "$LEDGER"
          grep -q 'fun reconcileCoveredLanes' "$LEDGER"
          grep -q 'fun outstandingCount' "$LEDGER"
          grep -q 'identitiesWithFourOrMoreConfirmedTargets' "$LEDGER"

          grep -q 'jinhakDiagnosticsSummary' "$STORE"
          grep -q 'JINHAK_CRAWL_DIAGNOSTICS' "$STORE"
          grep -q 'override val supportsBatchCrawl = false' "$ADAPTER"
          grep -q 'sanitizeHistoricalRowYear' "$ADAPTER"
          grep -q 'historical-multi-year-or-unresolved' "$YEAR"
          grep -q 'applicantAverageGrade' "$ADAPTER"

          python3 - <<'PY'
          from pathlib import Path
          main=Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt').read_text()
          ledger=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakMissionTargetLedger.kt').read_text()
          adapter=Path('app/src/main/java/com/admissionhub/collector/provider/JinhakAdapter.kt').read_text()
          store=Path('app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt').read_text()
          year=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakReportYearGuard.kt').read_text()

          if 'override val supportsBatchCrawl = true' in adapter:
              raise SystemExit('protected Jinhak broad batch capability re-enabled')
          if 'previousElementSibling' in ledger or 'nextElementSibling' in ledger:
              raise SystemExit('ledger must not infer identity from neighboring cards')
          if 'document.cookie' in ledger or 'localStorage' in ledger or 'sessionStorage' in ledger:
              raise SystemExit('ledger must not access session material')
          if 'jinhakMissionTargetLedger.hasActionablePending()' not in main:
              raise SystemExit('pending mission target cannot preempt generic frontier')
          if 'jinhakMissionTargetLedger.outstandingCount() > 0' not in main:
              raise SystemExit('deferred target cannot block generic frontier completion')
          if 'jinhakSlowLaneMissionTargetIds[task.id]' not in main:
              raise SystemExit('slow lane target provenance bridge missing')
          if 'jinhakDiagnosticsSummary' not in store:
              raise SystemExit('front-loaded diagnostics missing')
          if 'year !in 2000 until currentCycle' not in year:
              raise SystemExit('historical year guard regressed')
          if 'h.contains("지원자") -> metrics.put("applicants", n)' in adapter:
              raise SystemExit('grade average can still be stored as applicant count')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore signing
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_SECRET"
          STORE_FILE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ANDROID_SIGNING_SECRET -in signing/admission-upload.keystore.enc -out "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.7'}

      - name: Build
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "versionCode='10860'" /tmp/badging.txt
          grep -q "versionName='0.8.6'" /tmp/badging.txt
          grep -q "application-label:'Admission Collector v0.8.6 Persistent Mission Ledger'" /tmp/badging.txt
          sha256sum "$APK" | tee /tmp/apk.sha256

      - name: Commit generated v0.8.6 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/admissionhub/collector/MainActivity.kt \
            app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt \
            app/build.gradle.kts \
            app/src/main/AndroidManifest.xml
          if ! git diff --cached --quiet; then
            git commit -m "Implement v0.8.6 persistent mission target ledger"
            git push origin HEAD:main
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: admission-collector-v0.8.6-persistent-mission-ledger
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
