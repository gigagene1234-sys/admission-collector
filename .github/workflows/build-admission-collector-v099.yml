name: Build Admission Collector v0.9.9 Mission Ledger Routing

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-admission-collector-v099.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}
    outputs:
      source_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply v0.9.9 patch
        run: python3 .github/scripts/patch_v099.py
      - name: Verify v0.9.9 source invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          m=Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt').read_text()
          l=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakMissionTargetLedger.kt').read_text()
          s=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakMissionLaneSequencer.kt').read_text()
          t=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakSiteTopology.kt').read_text()
          a=Path('app/src/main/java/com/admissionhub/collector/provider/JinhakAdapter.kt').read_text()
          snap=Path('app/src/main/java/com/admissionhub/collector/capture/SnapshotScript.kt').read_text()
          year=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakReportYearGuard.kt').read_text()
          g=Path('app/build.gradle.kts').read_text()
          manifest=Path('app/src/main/AndroidManifest.xml').read_text()
          req={
            'version':'private const val VERSION = "0.9.9"' in m and 'private const val BUILD_CODE = 10990' in m,
            'gradle':'versionCode = 10990' in g and 'versionName = "0.9.9"' in g,
            'label':'Admission Collector v0.9.9 Mission Ledger Routing' in manifest,
            'origin-aware-lane':'laneForCandidateAtOrigin' in s and 'current-prediction' in s,
            'ledger-page-type':'pageType: String = ""' in l and 'laneForCandidateAtOrigin' in l,
            'ledger-call':'capture(ledgerOrigin, parsedMissionCandidates, pageTypeNow)' in m,
            'route-pass-predict':'/four-year-university/report/pass-predict' in t,
            'route-actual':'/four-year-university/report/actual-admission' in t,
            'route-admission-result':'/four-year-university/report/admission-result' in t,
            'reference-default-off':'JinhakMissionLane.REFERENCE,\n        JinhakMissionLane.RECOMMENDATION' in t,
            'seed-core-filter':'provider == ProviderId.JINHAK && !isJinhakDefaultCoreQueueUrl(url)' in m,
            'external-boundary':'jinhak-external-navigation-blocked' in m,
            'auth-v098-preserved':'protected-core-stable' in m and 'scheduleJinhakLoginRecovery' in m,
            'same-card-preserved':'unique-card-container' in snap,
            'batch-crawl-off':'override val supportsBatchCrawl = false' in a,
            'year-guard':'historical-multi-year-or-unresolved' in year,
            'semantic-guard':'applicantAverageGrade' in a,
          }
          failed=[k for k,v in req.items() if not v]
          if failed: raise SystemExit('Missing invariant(s): '+', '.join(failed))
          if '.put("username", credentials.username)' in m or '.put("password", credentials.password)' in m:
            raise SystemExit('credential leak invariant failed')
          print('v0.9.9 source invariants passed')
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_SECRET"
          STORE_FILE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ANDROID_SIGNING_SECRET -in signing/admission-upload.keystore.enc -out "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Test and build patched source
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify patched APK
        shell: bash
        run: |
          set -euo pipefail
          SRC=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$SRC" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$SRC" | tee patched-badging.txt
          grep -q "versionCode='10990'" patched-badging.txt
          grep -q "versionName='0.9.9'" patched-badging.txt
          grep -q "application-label:'Admission Collector v0.9.9 Mission Ledger Routing'" patched-badging.txt
      - name: Commit v0.9.9 source
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/admissionhub/collector/MainActivity.kt app/src/main/java/com/admissionhub/collector/jinhak/JinhakMissionTargetLedger.kt app/src/main/java/com/admissionhub/collector/jinhak/JinhakMissionLaneSequencer.kt app/src/main/java/com/admissionhub/collector/jinhak/JinhakSiteTopology.kt app/build.gradle.kts app/src/main/AndroidManifest.xml
          git commit -m "Implement v0.9.9 mission ledger routing"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  independent-main-build:
    needs: patch-build-commit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Refresh exact committed main
        run: |
          git fetch origin main
          git reset --hard origin/main
          test "$(git rev-parse HEAD)" = "${{ needs.patch-build-commit.outputs.source_sha }}"
      - name: Reverify committed source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          m=Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt').read_text()
          l=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakMissionTargetLedger.kt').read_text()
          s=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakMissionLaneSequencer.kt').read_text()
          t=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakSiteTopology.kt').read_text()
          assert 'private const val VERSION = "0.9.9"' in m
          assert 'laneForCandidateAtOrigin' in s and 'laneForCandidateAtOrigin' in l
          assert 'capture(ledgerOrigin, parsedMissionCandidates, pageTypeNow)' in m
          assert 'jinhak-external-navigation-blocked' in m
          assert '/four-year-university/report/pass-predict' in t
          print('committed v0.9.9 verified')
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          STORE_FILE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ANDROID_SIGNING_SECRET -in signing/admission-upload.keystore.enc -out "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build committed main
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify and package final APK
        shell: bash
        run: |
          set -euo pipefail
          SRC=app/build/outputs/apk/debug/app-debug.apk
          OUT=Admission-Collector-v0.9.9-Mission-Ledger-Routing.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$SRC" | tee apksigner.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$SRC" | tee badging.txt
          grep -q "versionCode='10990'" badging.txt
          grep -q "versionName='0.9.9'" badging.txt
          grep -q "application-label:'Admission Collector v0.9.9 Mission Ledger Routing'" badging.txt
          cp "$SRC" "$OUT"
          sha256sum "$OUT" | tee Admission-Collector-v0.9.9-Mission-Ledger-Routing.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: admission-collector-main-v0.9.9-final
          path: |
            Admission-Collector-v0.9.9-Mission-Ledger-Routing.apk
            Admission-Collector-v0.9.9-Mission-Ledger-Routing.sha256
            apksigner.txt
            badging.txt
          retention-days: 14
      - name: Publish v0.9.9 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          NOTES="v0.9.9 is driven by the v0.9.8 real-device export. v0.9.8 successfully revalidated Jinhak after roughly two hours of Adiga work and completed Jinhak collection without a login pause, but it parsed 30 application-bound saved-card anchors while creating zero mission-ledger targets. The saved-card control is rendered simply as '리포트'; the previous label-only lane classifier treated it as reference. v0.9.9 adds origin-aware lane classification: the exact generic report control on a verified early-storage card is recorded as a current-prediction target while preserving the pre-bound same-card application identity. The observed pass-predict, actual-admission and admission-result routes are mapped to explicit Susi lanes. Blanket REFERENCE traversal is removed from default Susi core, seed loading now obeys the same core allowlist, and external-domain navigation is blocked during autonomous Jinhak collection. v0.9.8 protected-core auth revalidation/recovery, same-card/unique-container binding, Year Guard, applicantAverageGrade guard, Slow Lane cap and supportsBatchCrawl=false remain. Gradle test task/build/signature verification and independent committed-main rebuild passed. Real-device E2E remains to be verified. Commit: $SHA"
          gh release create v0.9.9 Admission-Collector-v0.9.9-Mission-Ledger-Routing.apk Admission-Collector-v0.9.9-Mission-Ledger-Routing.sha256 --target "$SHA" --title "Admission Collector v0.9.9 — Mission Ledger Routing" --notes "$NOTES"
