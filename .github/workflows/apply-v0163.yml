name: Apply Admission Hub v0.16.3 High3 Recovery

on:
  push:
    branches: [codex/v0163-jinhak-high3-recover]
    paths:
      - ".github/scripts/patch_v0163_high3_recover.py"
      - ".github/workflows/apply-v0163.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: admission-hub-v0163-apply
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v0163-jinhak-high3-recover
          fetch-depth: 0
      - name: Apply high3 recovery patch
        run: python3 .github/scripts/patch_v0163_high3_recover.py
      - name: Commit product patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git commit -m "fix: recover high3 authentication after lower-grade block"
          git push origin HEAD:codex/v0163-jinhak-high3-recover
