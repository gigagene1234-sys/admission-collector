name: Apply v0.14.2 Unified Excel Compile Fix

on:
  push:
    branches: [codex/v0142-unified-auto-flow]
    paths:
      - ".github/workflows/apply-v0142-compile-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: admission-hub-v0142-compile-fix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply compile repair
        run: python3 .github/scripts/fix_v0142_unified_excel_compile.py
      - name: Verify focused diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "app/src/main/java/com/admissionhub/collector/score/UnifiedExcelScoreActivity.kt"
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/admissionhub/collector/score/UnifiedExcelScoreActivity.kt
          git diff --cached --quiet && { echo 'Expected compile repair produced no changes'; exit 1; }
          git commit -m "fix: compile unified Excel workflow"
          git push origin HEAD:codex/v0142-unified-auto-flow
