name: Build Admission Collector v0.6.1 Unified Two-Site Collector

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-admission-collector-v061.yml"
      - "scripts/apply_v061.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply v0.6.1 patch
        run: python3 scripts/apply_v061.py

      - name: Verify unified source invariants
        shell: bash
        run: |
          set -euo pipefail
          cmp -s MainActivity.kt app/src/main/java/com/admissionhub/collector/MainActivity.kt
          grep -q 'private const val VERSION = "0.6.1"' MainActivity.kt
          grep -q 'private const val BUILD_CODE = 10610' MainActivity.kt
          grep -q 'versionCode = 10610' app/build.gradle.kts
          grep -q 'versionName = "0.6.1"' app/build.gradle.kts
          grep -q 'Admission Collector v0.6.1 Unified Two-Site Collector' app/src/main/AndroidManifest.xml
          grep -q 'private fun startUnifiedCollection()' app/src/main/java/com/admissionhub/collector/MainActivity.kt
          grep -q 'private fun transitionUnifiedToJinhak' app/src/main/java/com/admissionhub/collector/MainActivity.kt
          grep -q 'private fun scheduleUnifiedJinhakAutoCapture' app/src/main/java/com/admissionhub/collector/MainActivity.kt
          grep -q 'private fun finishUnifiedCollection' app/src/main/java/com/admissionhub/collector/MainActivity.kt
          grep -q '두 사이트 통합 수집 시작' app/src/main/java/com/admissionhub/collector/MainActivity.kt
          grep -q 'unified-user-viewed-page' app/src/main/java/com/admissionhub/collector/MainActivity.kt
          grep -q 'override val supportsBatchCrawl = false' app/src/main/java/com/admissionhub/collector/provider/JinhakAdapter.kt
          grep -q 'override fun isBatchNavigable(url: String): Boolean = false' app/src/main/java/com/admissionhub/collector/provider/JinhakAdapter.kt
          grep -q 'ADIGA_RETRY_SUSPENDED && !unifiedRunning' app/src/main/java/com/admissionhub/collector/MainActivity.kt
          grep -q 'version: "0.3.9"' cloudflare/src/index.js

      - name: Verify unified local DB v3
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'CREATE TABLE unified_sessions' app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt
          grep -q 'CREATE TABLE unified_analysis_captures' app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt
          grep -q 'fun beginOrResumeUnifiedSession' app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt
          grep -q 'fun attachUnifiedProviderRun' app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt
          grep -q 'fun buildUnifiedExport' app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt
          grep -q 'doNotOverwriteHistoricalWithPrediction' app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt

      - name: Verify Jinhak boundary and privacy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          snap=Path('app/src/main/java/com/admissionhub/collector/capture/SnapshotScript.kt').read_text()
          a=snap.index('    function departmentContextFor(el,rootText){')
          b=snap.index('    function universityContextFor(el,rootText){', a)
          section=snap[a:b]
          for forbidden in ['previousElementSibling','nextElementSibling','structuredCardText(prev','structuredCardText(next']:
              if forbidden in section:
                  raise SystemExit(f'cross-card department inheritance reintroduced: {forbidden}')

          m=Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt').read_text()
          a=m.index('    private fun buildJinhakDigest(')
          b=m.index('    private fun sendLatestJinhakAnalysisDigest()', a)
          digest=m[a:b]
          for forbidden in ['snapshot.optString("url")','rawEvidence','navigationLinks','optJSONObject("session")']:
              if forbidden in digest:
                  raise SystemExit(f'forbidden Jinhak network payload source: {forbidden}')
          for required in ['sanitized-visible-admission-text','visibleText','analysisBundle']:
              if required not in digest:
                  raise SystemExit(f'missing privacy/coverage marker: {required}')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_SECRET"
          STORE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -pass env:ANDROID_SIGNING_SECRET \
            -in signing/admission-upload.keystore.enc \
            -out "$STORE"
          keytool -list -keystore "$STORE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build v0.6.1 APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "versionCode='10610'" /tmp/badging.txt
          grep -q "versionName='0.6.1'" /tmp/badging.txt
          sha256sum "$APK" | tee /tmp/apk.sha256

      - name: Persist generated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MainActivity.kt app/build.gradle.kts app/src/main/AndroidManifest.xml \
            app/src/main/java/com/admissionhub/collector/MainActivity.kt \
            app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt \
            scripts/apply_v061.py
          if git diff --cached --quiet; then
            echo "source already persisted"
          else
            git commit -m "Apply v0.6.1 unified two-site collector [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: admission-collector-v0.6.1-unified-two-site-collector-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
