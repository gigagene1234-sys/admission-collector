name: Apply v0.9.19 Mission Cell Ownership

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/apply-v0919-mission-cells.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply deterministic integration patch
        run: python3 .github/scripts/patch_v0919_mission_cells.py

      - name: Verify exact bounded source change
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          expected={
              'app/src/main/java/com/admissionhub/collector/MainActivity.kt',
              'app/build.gradle.kts',
              'app/src/main/AndroidManifest.xml',
          }
          if changed != expected:
              raise SystemExit(f'Unexpected v0.9.19 patch set: {sorted(changed)}')
          main=Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt').read_text()
          cell=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakMissionCellSupervisor.kt').read_text()
          gradle=Path('app/build.gradle.kts').read_text()
          manifest=Path('app/src/main/AndroidManifest.xml').read_text()
          checks={
              'version': 'private const val VERSION = "0.9.19"' in main and 'private const val BUILD_CODE = 109190' in main,
              'gradle': 'versionCode = 109190' in gradle and 'versionName = "0.9.19"' in gradle,
              'label': 'Admission Collector v0.9.19 Mission Cell Ownership' in manifest,
              'cell': 'class JinhakMissionCellSupervisor' in cell,
              'action': 'jinhakMissionCells.beginAction(' in main and 'jinhakMissionCells.finishAction(' in main,
              'snapshot': 'jinhakMissionCells.beginSnapshot(' in main and 'jinhakMissionCells.finishSnapshot(' in main,
              'renderer': 'jinhakMissionCells.onRendererGone(' in main,
              'stale': 'jinhakMissionCells.expireStaleOwnership(now)' in main,
              'late-action': 'late-action-callback-ignored' in main,
              'late-snapshot': 'late-snapshot-callback-ignored' in main,
              'diagnostics': '.put("missionCells", jinhakMissionCells.diagnostics' in main,
          }
          failed=[k for k,v in checks.items() if not v]
          if failed: raise SystemExit('v0.9.19 integration verification failed: '+', '.join(failed))
          print('bounded v0.9.19 source patch verified')
          PY
          git diff --check

      - name: Commit and push integrated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/admissionhub/collector/MainActivity.kt app/build.gradle.kts app/src/main/AndroidManifest.xml
          git commit -m "Implement v0.9.19 Mission Cell Ownership"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
