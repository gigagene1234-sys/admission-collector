name: Verify Admission Collector v0.8.4 Committed Source

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-admission-collector-main-v084.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}
    steps:
      - name: Checkout committed source only
        uses: actions/checkout@v4

      - name: Verify committed v0.8.4 architecture
        shell: bash
        run: |
          set -euo pipefail
          MAIN=app/src/main/java/com/admissionhub/collector/MainActivity.kt
          ADAPTER=app/src/main/java/com/admissionhub/collector/provider/JinhakAdapter.kt
          BRIDGE=app/src/main/java/com/admissionhub/collector/jinhak/JinhakReportContextBridge.kt
          YEAR=app/src/main/java/com/admissionhub/collector/jinhak/JinhakReportYearGuard.kt
          AGENT=app/src/main/java/com/admissionhub/collector/jinhak/JinhakAgentNavigator.kt
          SLOW=app/src/main/java/com/admissionhub/collector/jinhak/JinhakSlowLanePool.kt
          STORE=app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt
          SNAP=app/src/main/java/com/admissionhub/collector/capture/SnapshotScript.kt
          PROVIDER=app/src/main/java/com/admissionhub/collector/provider/ProviderAdapter.kt
          SYNC=app/src/main/java/com/admissionhub/collector/sync/UnifiedSyncState.kt

          grep -q 'VERSION = "0.8.4"' "$MAIN"
          grep -q 'BUILD_CODE = 10840' "$MAIN"
          grep -q 'versionCode = 10840' app/build.gradle.kts
          grep -q 'versionName = "0.8.4"' app/build.gradle.kts
          grep -q 'Admission Collector v0.8.4 Report Context Bridge' app/src/main/AndroidManifest.xml

          grep -q 'override val supportsBatchCrawl = false' "$ADAPTER"
          grep -q 'override val supportsUserSessionMissionTraversal = true' "$ADAPTER"
          grep -q 'supportsUserSessionMissionTraversal' "$PROVIDER"
          grep -q 'JINHAK_USER_SESSION_MISSION' "$SYNC"
          grep -q 'UnifiedSyncState.JINHAK_USER_SESSION_MISSION.name' "$MAIN"

          grep -q 'JinhakReportContextBridge.resolve' "$MAIN"
          grep -q 'same-application-card-before-navigation' "$BRIDGE"
          grep -q 'reportBridgeActionToken' "$BRIDGE"
          grep -q 'same-card-fallback' "$AGENT"
          grep -q 'same-card-context-mismatch' "$AGENT"
          grep -q 'applicationAnchorActionsAttempted' "$MAIN"
          grep -q 'applicationAnchorRejectReasons' "$MAIN"

          grep -q 'JinhakReportYearGuard.resolvePageYear' "$ADAPTER"
          grep -q 'sanitizeHistoricalRowYear' "$ADAPTER"
          grep -q 'year !in 2000 until currentCycle' "$YEAR"
          grep -q 'singleOrNull' "$YEAR"

          grep -q 'DEFAULT_MAX_WORKERS = 2' "$SLOW"
          grep -q 'STALL_CHECK_AFTER_MS = 90_000L' "$SLOW"
          grep -q 'HARD_MAX_MS = 120_000L' "$SLOW"
          grep -q 'slowLaneAverageCompletedMs' "$MAIN"
          grep -q 'cloudFrontierCompleted' "$MAIN"
          grep -q 'cloudFrontierCompletionFailed' "$MAIN"

          grep -q 'CREATE TABLE IF NOT EXISTS observations' "$STORE"
          grep -q 'fun storeObservationEvidence' "$STORE"
          grep -q 'fun writeObservations' "$STORE"
          grep -q 'unclassified-potential-value' "$MAIN"
          grep -q 'contractVersion\\\":3' "$STORE"
          grep -q 'ApplicationMissions' "$STORE"
          grep -q 'applicationIdentityKey' "$STORE"
          grep -q 'mission-link-navigation' "$SNAP"
          grep -q 'localStore.writeUnifiedExport(streamSession, writer)' "$MAIN"
          grep -q 'onRenderProcessGone' "$MAIN"
          grep -q 'onTrimMemory' "$MAIN"

          python3 - <<'PY'
          from pathlib import Path
          main=Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt').read_text()
          adapter=Path('app/src/main/java/com/admissionhub/collector/provider/JinhakAdapter.kt').read_text()
          bridge=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakReportContextBridge.kt').read_text()
          agent=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakAgentNavigator.kt').read_text()
          snap=Path('app/src/main/java/com/admissionhub/collector/capture/SnapshotScript.kt').read_text()
          probe=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakAuthorizedConnector.kt').read_text()
          if 'override val supportsBatchCrawl = true' in adapter:
              raise SystemExit('broad protected Jinhak batch capability active')
          if 'JINHAK_AUTONOMOUS_CRAWL.name' in main:
              raise SystemExit('new execution still records legacy autonomous crawl state')
          if 'unifiedJinhakCapturedPages.contains(pageKey)' in main:
              raise SystemExit('URL-only Jinhak dedupe active')
          if 'jinhak-nonadmission-page-skipped' in main:
              raise SystemExit('unknown observations are discarded')
          if 'previousElementSibling' in bridge or 'nextElementSibling' in bridge:
              raise SystemExit('context bridge performs cross-card inheritance')
          dept=snap.split('function departmentContextFor',1)[1].split('function universityContextFor',1)[0]
          if 'previousElementSibling' in dept or 'nextElementSibling' in dept:
              raise SystemExit('snapshot department context performs cross-card inheritance')
          for token in ['document.cookie','localStorage','sessionStorage','input.value','location.href','fetch(','XMLHttpRequest']:
              if token in probe:
                  raise SystemExit('authorized connector probe reads forbidden material: '+token)
          for token in ['원서','접수','결제','저장','삭제','로그아웃','제출','확정','동의','미동의']:
              if token not in agent:
                  raise SystemExit('agent write-action safety boundary missing: '+token)
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_SECRET"
          STORE_FILE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ANDROID_SIGNING_SECRET -in signing/admission-upload.keystore.enc -out "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build committed source
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify committed APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "versionCode='10840'" /tmp/badging.txt
          grep -q "versionName='0.8.4'" /tmp/badging.txt
          grep -q "application-label:'Admission Collector v0.8.4 Report Context Bridge'" /tmp/badging.txt
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: admission-collector-main-v0.8.4-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
