name: Build Admission Collector v0.8.8 Unique Container Mission Binding

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-admission-collector-v088.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}
    outputs:
      source_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply v0.8.8 source patch
        run: python3 .github/scripts/patch_v088.py

      - name: Verify v0.8.8 source invariants
        shell: bash
        run: |
          set -euo pipefail
          MAIN=app/src/main/java/com/admissionhub/collector/MainActivity.kt
          SNAP=app/src/main/java/com/admissionhub/collector/capture/SnapshotScript.kt
          AGENT=app/src/main/java/com/admissionhub/collector/jinhak/JinhakAgentNavigator.kt
          LEDGER=app/src/main/java/com/admissionhub/collector/jinhak/JinhakMissionTargetLedger.kt
          ADAPTER=app/src/main/java/com/admissionhub/collector/provider/JinhakAdapter.kt
          YEAR=app/src/main/java/com/admissionhub/collector/jinhak/JinhakReportYearGuard.kt
          STORE=app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt

          grep -q 'VERSION = "0.8.8"' "$MAIN"
          grep -q 'BUILD_CODE = 10880' "$MAIN"
          grep -q 'versionCode = 10880' app/build.gradle.kts
          grep -q 'versionName = "0.8.8"' app/build.gradle.kts
          grep -q 'Admission Collector v0.8.8 Unique Container Mission Binding' app/src/main/AndroidManifest.xml

          BINDING_BLOCK="$(sed -n '/function applicationBindingForAction(el)/,/function applicationContextForAction(el)/p' "$SNAP")"
          grep -q 'binding.root.contains(el)' <<< "$BINDING_BLOCK"
          grep -q "unique-card-container" <<< "$BINDING_BLOCK"
          grep -q 'contained.length>1' <<< "$BINDING_BLOCK"
          grep -q 'cur.contains(cb.root)' <<< "$BINDING_BLOCK"
          if grep -q 'previousElementSibling\|nextElementSibling' <<< "$BINDING_BLOCK"; then
            echo 'v0.8.8 ownership helper must not traverse siblings' >&2
            exit 1
          fi

          grep -q 'MAX_JINHAK_GENERIC_ACTIONS = 180' "$MAIN"
          grep -q 'MAX_JINHAK_MISSION_ACTIONS = 220' "$MAIN"
          grep -q 'missionBudgetedAction' "$MAIN"
          grep -q 'applicationAnchorStructuredBindings' "$MAIN"
          grep -q 'applicationAnchorBindingSources' "$MAIN"
          grep -q 'jinhakMissionTargetLedger.capture' "$MAIN"
          grep -q 'fun failAllOutstanding(reason: String): Int' "$LEDGER"
          grep -q 'explicitUniversity = obj.optString("applicationUniversity")' "$AGENT"
          grep -q 'explicitDepartment = obj.optString("applicationDepartment")' "$AGENT"
          grep -q 'jinhakDiagnosticsSummary' "$STORE"
          grep -q 'override val supportsBatchCrawl = false' "$ADAPTER"
          grep -q 'historical-multi-year-or-unresolved' "$YEAR"
          grep -q 'applicantAverageGrade' "$ADAPTER"
          if grep -q 'override val supportsBatchCrawl = true' "$ADAPTER"; then
            echo 'protected broad Jinhak crawl was re-enabled' >&2
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_SECRET"
          STORE_FILE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ANDROID_SIGNING_SECRET -in signing/admission-upload.keystore.enc -out "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Test and build patched v0.8.8 source
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Verify patched v0.8.8 APK
        shell: bash
        run: |
          set -euo pipefail
          SRC=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$SRC" | tee patched-apksigner.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$SRC" | tee patched-badging.txt
          grep -q "versionCode='10880'" patched-badging.txt
          grep -q "versionName='0.8.8'" patched-badging.txt
          grep -q "application-label:'Admission Collector v0.8.8 Unique Container Mission Binding'" patched-badging.txt

      - name: Commit v0.8.8 source
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/admissionhub/collector/capture/SnapshotScript.kt \
                  app/src/main/java/com/admissionhub/collector/MainActivity.kt \
                  app/build.gradle.kts app/src/main/AndroidManifest.xml
          if git diff --cached --quiet; then
            echo "No v0.8.8 source changes to commit" >&2
            exit 1
          fi
          git commit -m "Implement v0.8.8 unique-container mission binding"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  independent-main-build:
    needs: patch-build-commit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Refresh committed main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          echo "Committed main: $(git rev-parse HEAD)"
          echo "Expected source commit: ${{ needs.patch-build-commit.outputs.source_sha }}"
          test "$(git rev-parse HEAD)" = "${{ needs.patch-build-commit.outputs.source_sha }}"

      - name: Verify committed v0.8.8 source
        shell: bash
        run: |
          set -euo pipefail
          MAIN=app/src/main/java/com/admissionhub/collector/MainActivity.kt
          SNAP=app/src/main/java/com/admissionhub/collector/capture/SnapshotScript.kt
          ADAPTER=app/src/main/java/com/admissionhub/collector/provider/JinhakAdapter.kt
          YEAR=app/src/main/java/com/admissionhub/collector/jinhak/JinhakReportYearGuard.kt
          grep -q 'VERSION = "0.8.8"' "$MAIN"
          grep -q 'BUILD_CODE = 10880' "$MAIN"
          grep -q 'versionCode = 10880' app/build.gradle.kts
          grep -q 'versionName = "0.8.8"' app/build.gradle.kts
          grep -q 'Admission Collector v0.8.8 Unique Container Mission Binding' app/src/main/AndroidManifest.xml
          BINDING_BLOCK="$(sed -n '/function applicationBindingForAction(el)/,/function applicationContextForAction(el)/p' "$SNAP")"
          grep -q "unique-card-container" <<< "$BINDING_BLOCK"
          grep -q 'contained.length>1' <<< "$BINDING_BLOCK"
          if grep -q 'previousElementSibling\|nextElementSibling' <<< "$BINDING_BLOCK"; then exit 1; fi
          grep -q 'MAX_JINHAK_GENERIC_ACTIONS = 180' "$MAIN"
          grep -q 'MAX_JINHAK_MISSION_ACTIONS = 220' "$MAIN"
          grep -q 'applicationAnchorStructuredBindings' "$MAIN"
          grep -q 'override val supportsBatchCrawl = false' "$ADAPTER"
          grep -q 'historical-multi-year-or-unresolved' "$YEAR"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_SECRET"
          STORE_FILE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ANDROID_SIGNING_SECRET -in signing/admission-upload.keystore.enc -out "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build committed main
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify final v0.8.8 APK
        shell: bash
        run: |
          set -euo pipefail
          SRC=app/build/outputs/apk/debug/app-debug.apk
          OUT=Admission-Collector-v0.8.8-Unique-Container-Mission-Binding.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$SRC" | tee apksigner.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$SRC" | tee badging.txt
          grep -q "versionCode='10880'" badging.txt
          grep -q "versionName='0.8.8'" badging.txt
          grep -q "application-label:'Admission Collector v0.8.8 Unique Container Mission Binding'" badging.txt
          cp "$SRC" "$OUT"
          sha256sum "$OUT" | tee Admission-Collector-v0.8.8-Unique-Container-Mission-Binding.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: admission-collector-main-v0.8.8-final
          path: |
            Admission-Collector-v0.8.8-Unique-Container-Mission-Binding.apk
            Admission-Collector-v0.8.8-Unique-Container-Mission-Binding.sha256
            apksigner.txt
            badging.txt
          retention-days: 14

      - name: Publish v0.8.8 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          NOTES="Committed-main independent build. versionName 0.8.8 / versionCode 10880. Unique Container Mission Binding keeps v0.8.7 direct same-card ownership and additionally binds an action only when its bounded ancestor contains exactly one detected application card root; multi-card ancestors are rejected. Mission actions now have a reserved finite budget separate from generic read navigation, preventing editorial/media exploration from consuming application target execution capacity. Existing Persistent Mission Target Ledger, report confirmation, historical-year guard, applicant semantic guard, slow-lane worker cap, and supportsBatchCrawl=false remain. Build, tests, signature, source-invariant and package checks passed. Real-device E2E remains unverified until a new exported JSON is analyzed. Commit: $SHA"
          if gh release view v0.8.8 >/dev/null 2>&1; then
            gh release upload v0.8.8 Admission-Collector-v0.8.8-Unique-Container-Mission-Binding.apk Admission-Collector-v0.8.8-Unique-Container-Mission-Binding.sha256 --clobber
          else
            gh release create v0.8.8 Admission-Collector-v0.8.8-Unique-Container-Mission-Binding.apk Admission-Collector-v0.8.8-Unique-Container-Mission-Binding.sha256 --target "$SHA" --title "Admission Collector v0.8.8 — Unique Container Mission Binding" --notes "$NOTES"
          fi
