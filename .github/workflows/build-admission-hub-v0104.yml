name: Build Admission Hub v0.10.4 Local Rebind Continuity

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-admission-hub-v0104.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}
      APK_NAME: Admission-Hub-v0.10.4-Local-Rebind-Continuity.apk

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.10.4 local rebind continuity patch
        run: python3 .github/scripts/patch_v0104.py

      - name: Verify cumulative safety and v0.10.4 architecture invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          main=Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt').read_text()
          store=Path('app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt').read_text()
          policy=Path('app/src/main/java/com/admissionhub/collector/sync/LocalRebindPolicy.kt').read_text()
          adapter=Path('app/src/main/java/com/admissionhub/collector/provider/JinhakAdapter.kt').read_text()
          cell=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakMissionCellSupervisor.kt').read_text()
          checks={
            'version': 'private const val VERSION = "0.10.4"' in main and 'private const val BUILD_CODE = 110040' in main,
            'no-launch-full-crawl': 'private const val AUTO_LOGIN_AND_COLLECT_ON_LAUNCH = false' in main,
            'rebind-before-browser-resume': 'suppressInterruptedBrowserResume' in main and 'runLocalRebindOnly("app-start")' in main,
            'cross-session-canonical-source': 'latestReusableCanonicalSessionId' in store and 'crossSessionContinuity' in store,
            'hard-cell-lease': 'armJinhakHardCellLeaseWatchdog' in main and 'JINHAK_HARD_CELL_LEASE_POLL_MS' in main,
            'late-callback-generation': 'LATE_CALLBACK_IGNORED' in cell,
            'batch-crawl-disabled': 'override val supportsBatchCrawl = false' in adapter,
            'user-session-mission': 'override val supportsUserSessionMissionTraversal = true' in adapter,
            'same-card': 'same-card-action-not-found' in main,
            'prediction-history-separation': 'predictionDoesNotOverwriteHistoricalActual' in store,
            'conservative-binding': 'doNotInferMissingBindings' in store and 'official-structural-v2' in store,
            'rebind-no-secret': 'credentialsRead' in store and 'sessionSecretsRead' in store,
            'policy-pure': 'object LocalRebindPolicy' in policy,
          }
          failed=[k for k,v in checks.items() if not v]
          if failed: raise SystemExit('v0.10.4 invariant failure: '+', '.join(failed))
          for banned in ['autoSelectTopSix','autoReplaceHubSlot','inferMissingDepartment','inferMissingAdmission','document.cookie','localStorage.getItem','sessionStorage.getItem']:
              if banned in policy:
                  raise SystemExit('forbidden local rebind behavior: '+banned)
          print('v0.10.4 cumulative safety + architecture invariants passed')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_SECRET"
          STORE_FILE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ANDROID_SIGNING_SECRET -in signing/admission-upload.keystore.enc -out "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run local rebind and hard lease Mission Lab tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Compile patched source
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify patched APK metadata and signer
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -Fq "versionCode='110040'" /tmp/badging.txt
          grep -Fq "versionName='0.10.4'" /tmp/badging.txt
          grep -Fq "application-label:'Admission Hub v0.10.4 Local Rebind Continuity'" /tmp/badging.txt
          grep -qi 'db6cd5efceda108657662d06f857e5f0277301cb6ab97a75c8a01994c96e4995' /tmp/apksigner.txt

      - name: Commit v0.10.4 product source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/admissionhub/collector/MainActivity.kt \
            app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt \
            app/src/main/java/com/admissionhub/collector/sync/LocalRebindPolicy.kt \
            app/src/test/java/com/admissionhub/collector/sync/LocalRebindPolicyTest.kt \
            app/src/test/java/com/admissionhub/collector/jinhak/JinhakMissionCellSupervisorLeaseTest.kt \
            app/build.gradle.kts \
            app/src/main/AndroidManifest.xml
          git commit -m "Implement v0.10.4 Local Rebind Continuity and Hard Action Lease"
          git push origin HEAD:main
          PRODUCT_SHA=$(git rev-parse HEAD)
          echo "PRODUCT_SHA=$PRODUCT_SHA" >> "$GITHUB_ENV"
          echo "Product commit: $PRODUCT_SHA"

      - name: Rebuild and retest exact committed product source
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$PRODUCT_SHA"
          rm -rf app/build
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/final-apksigner.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/final-badging.txt
          grep -Fq "versionCode='110040'" /tmp/final-badging.txt
          grep -Fq "versionName='0.10.4'" /tmp/final-badging.txt
          grep -Fq "application-label:'Admission Hub v0.10.4 Local Rebind Continuity'" /tmp/final-badging.txt
          grep -qi 'db6cd5efceda108657662d06f857e5f0277301cb6ab97a75c8a01994c96e4995' /tmp/final-apksigner.txt

      - name: Package final APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/$APK_NAME"
          sha256sum "dist/$APK_NAME" | tee "dist/$APK_NAME.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: admission-hub-v0.10.4-local-rebind-continuity
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish v0.10.4 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete v0.10.4 --yes --cleanup-tag >/dev/null 2>&1 || true
          git tag -f v0.10.4 "$PRODUCT_SHA"
          git push origin -f v0.10.4
          gh release create v0.10.4 \
            "dist/$APK_NAME" "dist/$APK_NAME.sha256" \
            --target "$PRODUCT_SHA" \
            --title "Admission Hub v0.10.4 — Local Rebind Continuity + Hard Action Lease" \
            --notes "Stops automatic launch-time browser recrawls when six pinned applications can be resolved from a prior local canonical graph. Rebuilds v0.10.3 official structural binding entirely from preserved SQLite evidence before any provider navigation, carries six-slot resolution across UnifiedSyncSession boundaries, and exposes cross-session continuity diagnostics. Adds an independent 5-second hard mission-cell lease watchdog so an action older than the 60-second cell lease is expired and mission recovery is dispatched even when unrelated snapshots keep resetting the parent meaningful-progress timer. Preserves same-card identity, observation-first evidence, auth-domain separation, selected-six recovery, terminal seal, stable package/signer, and no credential/session-secret export."
