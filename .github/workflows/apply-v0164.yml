name: Apply Admission Hub v0.16.4 Auth Baseline

on:
  push:
    branches: [codex/v0164-v0912-auth-baseline]
    paths:
      - ".github/scripts/patch_v0164.py"
      - ".github/workflows/apply-v0164.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: admission-hub-v0164-apply
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v0164-v0912-auth-baseline
          fetch-depth: 0
      - name: Apply v0.9.12 auth baseline restore
        run: python3 .github/scripts/patch_v0164.py
      - name: Commit product patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git commit -m "fix: restore v0.9.12 passive Jinhak auth semantics"
          git push origin HEAD:codex/v0164-v0912-auth-baseline
