name: Build Admission Collector v0.9.18 Auth Proof Resume Gate

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-admission-collector-v0918.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}
    outputs:
      source_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply v0.9.18 auth proof persistence patch
        run: python3 .github/scripts/patch_v0918.py

      - name: Verify bounded change surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          allowed={
            'app/src/main/java/com/admissionhub/collector/MainActivity.kt',
            'app/build.gradle.kts',
            'app/src/main/AndroidManifest.xml',
          }
          extra=changed-allowed
          missing=allowed-changed
          if extra: raise SystemExit('Unexpected files changed: '+', '.join(sorted(extra)))
          if missing: raise SystemExit('Required files not changed: '+', '.join(sorted(missing)))
          print('v0.9.18 file boundary passed')
          PY

      - name: Verify v0.9.18 invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          m=Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt').read_text()
          p=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakSlowLanePool.kt').read_text()
          l=Path('app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt').read_text()
          s=Path('app/src/main/java/com/admissionhub/collector/capture/SnapshotScript.kt').read_text()
          g=Path('app/build.gradle.kts').read_text()
          manifest=Path('app/src/main/AndroidManifest.xml').read_text()
          req={
            'version':'private const val VERSION = "0.9.18"' in m and 'private const val BUILD_CODE = 109180' in m,
            'gradle':'versionCode = 109180' in g and 'versionName = "0.9.18"' in g,
            'label':'Admission Collector v0.9.18 Auth Proof Resume Gate' in manifest,
            'safe-proof-persist':'persistJinhakAuthProofCheckpoint' in m and 'jinhakAuthProofCollectorVersion' in m,
            'safe-proof-restore':'restoreJinhakAuthProofCheckpoint' in m and 'hasFreshJinhakProtectedCoreProof' in m,
            'resume-gate':'jinhak-resume-real-auth-gate-required' in m and 'activity-resume-auth-gate' in m,
            'same-session-resume':'jinhakRealAuthResumeGatePending' in m and '보존된 mission ledger' in m,
            'probe-cycle-preserved':'auth-route-cycle-detected' in m and 'MAX_JINHAK_REAL_AUTH_ROUTE_TRANSITIONS = 14' in m,
            'probe-timeout-preserved':'JINHAK_REAL_AUTH_PROBE_TIMEOUT_MS = 90_000L' in m,
            'target-redirect-preserved':'quarantineJinhakTargetSpecificAuthRedirect' in m and 'MAX_JINHAK_TARGET_AUTH_REDIRECT_CYCLES = 2' in m,
            'mission-stall-preserved':'recoverOrStopJinhakMissionStall' in m and 'MAX_JINHAK_MISSION_STALL_RECOVERIES = 2' in m,
            'renderer-preserved':'const val DEFAULT_MAX_WORKERS = 1' in p and 'rendererCircuitOpen' in p,
            'mission-persistence-preserved':'CREATE TABLE IF NOT EXISTS jinhak_mission_targets' in l and 'monotonicStateGuard' in l,
            'same-card-preserved':'same-card-action-not-found' in m and 'MAX_JINHAK_SAME_CARD_REPLAY_ATTEMPTS = 3' in m,
            'susi-core-preserved':'isDefaultSusiCoreTraversalUrl' in m,
            'snapshot-privacy':'safeCloneText' in s and 'input,textarea,select,option,form' in s,
            'credential-vault-preserved':'CredentialVault' in m,
            'probe-privacy':'sanitized-host-path-only-no-query' in m and '.put("cookieExported", false)' in m and '.put("formValuesExported", false)' in m,
            'proof-privacy':'authProofSafePath' in m and '.putBoolean("credentialExported", false)' in m and '.putBoolean("sessionSecretExported", false)' in m,
          }
          failed=[k for k,v in req.items() if not v]
          if failed: raise SystemExit('Missing invariant(s): '+', '.join(failed))
          forbidden=[
            '.put("username", credentials.username)',
            '.put("password", credentials.password)',
            '.putString("username",',
            '.putString("password",',
          ]
          hits=[x for x in forbidden if x in m]
          if hits: raise SystemExit('credential export invariant failed: '+', '.join(hits))
          print('v0.9.18 invariants passed')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_SECRET"
          STORE_FILE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ANDROID_SIGNING_SECRET -in signing/admission-upload.keystore.enc -out "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Test and build patched source
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Verify patched APK
        shell: bash
        run: |
          set -euo pipefail
          SRC=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$SRC" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$SRC" | tee patched-badging.txt
          grep -q "versionCode='109180'" patched-badging.txt
          grep -q "versionName='0.9.18'" patched-badging.txt
          grep -q "application-label:'Admission Collector v0.9.18 Auth Proof Resume Gate'" patched-badging.txt

      - name: Commit v0.9.18 source
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/admissionhub/collector/MainActivity.kt \
                  app/build.gradle.kts app/src/main/AndroidManifest.xml
          git commit -m "Implement v0.9.18 Auth Proof Resume Gate"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  independent-main-build:
    needs: patch-build-commit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Refresh exact committed main
        run: |
          git fetch origin main
          git reset --hard origin/main
          test "$(git rev-parse HEAD)" = "${{ needs.patch-build-commit.outputs.source_sha }}"

      - name: Reverify committed v0.9.18
        run: |
          python3 - <<'PY'
          from pathlib import Path
          m=Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt').read_text()
          g=Path('app/build.gradle.kts').read_text()
          assert 'private const val VERSION = "0.9.18"' in m
          assert 'versionCode = 109180' in g
          assert 'persistJinhakAuthProofCheckpoint' in m
          assert 'restoreJinhakAuthProofCheckpoint' in m
          assert 'jinhak-resume-real-auth-gate-required' in m
          assert 'activity-resume-auth-gate' in m
          assert 'auth-route-cycle-detected' in m
          assert 'quarantineJinhakTargetSpecificAuthRedirect' in m
          assert 'recoverOrStopJinhakMissionStall' in m
          print('committed v0.9.18 verified')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          STORE_FILE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ANDROID_SIGNING_SECRET -in signing/admission-upload.keystore.enc -out "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build committed main
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify and package final APK
        shell: bash
        run: |
          set -euo pipefail
          SRC=app/build/outputs/apk/debug/app-debug.apk
          OUT=Admission-Collector-v0.9.18-Auth-Proof-Resume-Gate.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$SRC" | tee apksigner.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$SRC" | tee badging.txt
          grep -q "versionCode='109180'" badging.txt
          grep -q "versionName='0.9.18'" badging.txt
          grep -q "application-label:'Admission Collector v0.9.18 Auth Proof Resume Gate'" badging.txt
          cp "$SRC" "$OUT"
          sha256sum "$OUT" | tee Admission-Collector-v0.9.18-Auth-Proof-Resume-Gate.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: admission-collector-main-v0.9.18-final
          path: |
            Admission-Collector-v0.9.18-Auth-Proof-Resume-Gate.apk
            Admission-Collector-v0.9.18-Auth-Proof-Resume-Gate.sha256
            apksigner.txt
            badging.txt
          retention-days: 14

      - name: Publish v0.9.18 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          NOTES="v0.9.18 addresses one observed v0.9.17 failure mode: the real Jinhak auth probe and protected-core verification succeeded, but after runtime/process recreation the volatile auth fields reverted to never-run/false while the SQLite mission ledger survived. This version persists only safe auth evidence (collector version, bounded result/evidence strings, timestamps, and sanitized host/path with no query), mirrors it into the session mission runtime checkpoint, and restores it after recreation. A resumed Jinhak session with a fresh protected-core proof performs protected-core revalidation before mission restart. If no fresh proof exists, the bounded real-site v0.9.17 auth probe runs before the preserved mission ledger resumes; it does not go through Jinhak home and cannot create a new unified session. Failed probes remain bounded/paused rather than entering a route loop. Successful protected-core checks synchronously refresh the safe checkpoint. No ID/password/cookie/token/localStorage/sessionStorage/form values are persisted or exported. Existing v0.9.17 real auth cycle detection, v0.9.16 target redirect quarantine, v0.9.15 mission stall fence, v0.9.14 renderer circuit, v0.9.13 same-card replay, v0.9.11 monotonic mission persistence, Susi-only traversal and same-card binding are preserved. Commit: $SHA"
          gh release create v0.9.18 Admission-Collector-v0.9.18-Auth-Proof-Resume-Gate.apk Admission-Collector-v0.9.18-Auth-Proof-Resume-Gate.sha256 --target "$SHA" --title "Admission Collector v0.9.18 — Auth Proof Resume Gate" --notes "$NOTES"
