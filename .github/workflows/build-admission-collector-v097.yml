name: Build Admission Collector v0.9.7 Verified Auth Susi Core

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-admission-collector-v097.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}
    outputs:
      source_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply v0.9.7 patch
        run: |
          # The storage-state annotation is diagnostic-only. The source line changed shape
          # during prior cumulative patches, so remove that optional patch block rather than
          # allowing a cosmetic anchor to block the auth/core safety release.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/patch_v097.py')
          s=p.read_text()
          a=s.index('# Mark core bootstrap when the storage page actually appears.')
          b=s.index('# Reset core-scope run counters at Jinhak batch start', a)
          p.write_text(s[:a]+s[b:])
          PY
          python3 .github/scripts/patch_v097.py
      - name: Verify v0.9.7 source invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          m=Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt').read_text()
          t=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakSiteTopology.kt').read_text()
          g=Path('app/build.gradle.kts').read_text()
          manifest=Path('app/src/main/AndroidManifest.xml').read_text()
          cred=Path('app/src/main/java/com/admissionhub/collector/session/CredentialVault.kt').read_text()
          snap=Path('app/src/main/java/com/admissionhub/collector/capture/SnapshotScript.kt').read_text()
          adapter=Path('app/src/main/java/com/admissionhub/collector/provider/JinhakAdapter.kt').read_text()
          year=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakReportYearGuard.kt').read_text()
          req={
            'version':'private const val VERSION = "0.9.7"' in m,
            'build':'private const val BUILD_CODE = 10970' in m,
            'gradle':'versionCode = 10970' in g and 'versionName = "0.9.7"' in g,
            'label':'Admission Collector v0.9.7 Verified Auth Susi Core' in manifest,
            'stored-session-must-verify':'startup-stored-session-verification-required' in m and 'stored-session-direct' not in m,
            'no-passive-ready-bypass':'passive-login-surface-ready' not in m,
            'protected-auth-probe':'jinhak-protected-auth-probe-start' in m and 'protected-route-authenticated' in m,
            'route-fallback-pause':'login-route-fallback-batch-pause' in m and 'loginRouteFallbackCredentialPrompts' in m,
            'core-queue-filter':'isJinhakDefaultCoreQueueUrl' in m and 'isDefaultSusiCoreTraversalUrl' in t,
            'strategy-seed-removed':'$ROOT/jh/high3/univ-entrance-info/ipsi-analysis/ipsi-strategy' not in t,
            'editorial-narrowed':'return lane(url, label) == JinhakMissionLane.UNIVERSITY_RESULT' in t,
            'no-forced-login-url':'webView.loadUrl(providerLoginUrl' not in m,
            'credential-vault':'AES/GCM/NoPadding' in cred and 'admission_collector_credentials_v1' in cred,
            'same-card':'unique-card-container' in snap,
            'jinhak-broad-off':'override val supportsBatchCrawl = false' in adapter,
            'year-guard':'historical-multi-year-or-unresolved' in year,
            'semantic-guard':'applicantAverageGrade' in adapter,
          }
          failed=[k for k,v in req.items() if not v]
          if failed: raise SystemExit('Missing invariant(s): '+', '.join(failed))
          if '.put("username", credentials.username)' in m or '.put("password", credentials.password)' in m:
            raise SystemExit('credential value leak into runtime JSON')
          print('v0.9.7 source invariants passed')
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_SECRET"
          STORE_FILE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ANDROID_SIGNING_SECRET -in signing/admission-upload.keystore.enc -out "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Test and build patched source
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify patched APK
        shell: bash
        run: |
          set -euo pipefail
          SRC=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$SRC" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$SRC" | tee patched-badging.txt
          grep -q "versionCode='10970'" patched-badging.txt
          grep -q "versionName='0.9.7'" patched-badging.txt
          grep -q "application-label:'Admission Collector v0.9.7 Verified Auth Susi Core'" patched-badging.txt
      - name: Commit v0.9.7 source
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/admissionhub/collector/MainActivity.kt app/src/main/java/com/admissionhub/collector/jinhak/JinhakSiteTopology.kt app/build.gradle.kts app/src/main/AndroidManifest.xml
          git commit -m "Implement v0.9.7 verified auth Susi core"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  independent-main-build:
    needs: patch-build-commit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Refresh exact committed main
        run: |
          git fetch origin main
          git reset --hard origin/main
          test "$(git rev-parse HEAD)" = "${{ needs.patch-build-commit.outputs.source_sha }}"
      - name: Reverify committed source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          m=Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt').read_text()
          t=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakSiteTopology.kt').read_text()
          assert 'private const val VERSION = "0.9.7"' in m
          assert 'startup-stored-session-verification-required' in m
          assert 'stored-session-direct' not in m
          assert 'passive-login-surface-ready' not in m
          assert 'login-route-fallback-batch-pause' in m
          assert 'isDefaultSusiCoreTraversalUrl' in t
          assert '$ROOT/jh/high3/univ-entrance-info/ipsi-analysis/ipsi-strategy' not in t
          print('committed v0.9.7 verified')
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          STORE_FILE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ANDROID_SIGNING_SECRET -in signing/admission-upload.keystore.enc -out "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build committed main
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify and package final APK
        shell: bash
        run: |
          set -euo pipefail
          SRC=app/build/outputs/apk/debug/app-debug.apk
          OUT=Admission-Collector-v0.9.7-Verified-Auth-Susi-Core.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$SRC" | tee apksigner.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$SRC" | tee badging.txt
          grep -q "versionCode='10970'" badging.txt
          grep -q "versionName='0.9.7'" badging.txt
          grep -q "application-label:'Admission Collector v0.9.7 Verified Auth Susi Core'" badging.txt
          cp "$SRC" "$OUT"
          sha256sum "$OUT" | tee Admission-Collector-v0.9.7-Verified-Auth-Susi-Core.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: admission-collector-main-v0.9.7-final
          path: |
            Admission-Collector-v0.9.7-Verified-Auth-Susi-Core.apk
            Admission-Collector-v0.9.7-Verified-Auth-Susi-Core.sha256
            apksigner.txt
            badging.txt
          retention-days: 14
      - name: Publish v0.9.7 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          NOTES="v0.9.7 is driven by the clean real-device v0.9.6 export. Restored encrypted session leases are no longer treated as authentication proof; Jinhak collection becomes ready only after actual auth evidence or a protected read-only Susi storage route loads without login redirect. A real provider login route that fails the rendered-form probe now pauses the batch while preserving the exact target and prompts for local encrypted credentials when none are stored, instead of snapshotting/skipping the protected page. Default Jinhak autonomous traversal is now Susi-core scoped: strategy, knowledge, recommendation, media and unknown lanes are not queued or re-imported from Cloud frontier, while raw parsing remains available for user-opened pages. Strategy is removed from mission seeds. Live/final diagnostics expose stale-session bypass prevention, login-route fallback pauses/prompts, auth gate state and blocked core-scope lanes without exporting credentials/cookies/tokens. Existing cross-version resume fence, same-card/unique-container binding, mission ledger, report bridge, Year Guard, applicantAverageGrade guard, Slow Lane and supportsBatchCrawl=false remain. Gradle test task/build/signature verification and independent committed-main rebuild passed. Real-device E2E remains to be verified. Commit: $SHA"
          gh release create v0.9.7 Admission-Collector-v0.9.7-Verified-Auth-Susi-Core.apk Admission-Collector-v0.9.7-Verified-Auth-Susi-Core.sha256 --target "$SHA" --title "Admission Collector v0.9.7 — Verified Auth Susi Core" --notes "$NOTES"
