name: Build Admission Collector v0.4.0 Local-First

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-admission-collector-v040.yml"
      - "scripts/apply_v040.py"
      - "scripts/fix_v040_compile.py"
      - "scripts/patch_v040_historical_mirror.py"
      - "MainActivity.kt"
      - "app/build.gradle.kts"
      - "app/src/main/AndroidManifest.xml"
      - "app/src/main/java/com/admissionhub/collector/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Prepare v0.4.0 local-first source
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'private const val VERSION = "0.4.0"' MainActivity.kt; then
            echo "v0.4.0 base source already persisted"
          else
            python3 scripts/apply_v040.py
            python3 scripts/fix_v040_compile.py
          fi
          python3 scripts/patch_v040_historical_mirror.py

      - name: Verify v0.4.0 source invariants
        shell: bash
        run: |
          set -euo pipefail
          cmp -s MainActivity.kt app/src/main/java/com/admissionhub/collector/MainActivity.kt
          grep -q 'private const val VERSION = "0.4.0"' MainActivity.kt
          grep -q 'private const val LOCAL_FIRST_BETA = true' MainActivity.kt
          grep -q 'cloudRequestsDuringBatch", 0' MainActivity.kt
          grep -q 'verifyLocalCompletionOrFinish' MainActivity.kt
          grep -q 'LocalCollectorStore' MainActivity.kt
          grep -q 'historicalMirrorUrl(url)?.let' MainActivity.kt
          grep -q 'withQueryParameter(url, "searchSyr", "2026")' MainActivity.kt
          grep -q 'historical-admission-result-table' app/src/main/java/com/admissionhub/collector/provider/AdigaAdapter.kt
          grep -q 'admission-search-summary' app/src/main/java/com/admissionhub/collector/provider/AdigaAdapter.kt
          grep -q 'numberOrNull(previousCompetition)' app/src/main/java/com/admissionhub/collector/provider/AdigaAdapter.kt
          grep -q 'numberOrNull(previousGrade)' app/src/main/java/com/admissionhub/collector/provider/AdigaAdapter.kt
          grep -q 'inferredUniversityDetailRoute' app/src/main/java/com/admissionhub/collector/capture/SnapshotScript.kt
          grep -q 'class LocalCollectorStore' app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt
          grep -q 'versionCode = 10400' app/build.gradle.kts
          grep -q 'versionName = "0.4.0"' app/build.gradle.kts
          grep -q 'android:label="Admission Collector v0.4.0 Local"' app/src/main/AndroidManifest.xml
          # v0.4.0 deliberately does not patch/deploy Cloudflare production.
          grep -q 'version: "0.3.9"' cloudflare/src/index.js

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_SECRET"
          test -f signing/admission-upload.keystore.enc
          STORE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -pass env:ANDROID_SIGNING_SECRET \
            -in signing/admission-upload.keystore.enc \
            -out "$STORE"
          keytool -list -keystore "$STORE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build v0.4.0 APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK signature and package metadata
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "versionCode='10400'" /tmp/badging.txt
          grep -q "versionName='0.4.0'" /tmp/badging.txt
          grep -q "application-label:'Admission Collector v0.4.0 Local'" /tmp/badging.txt
          sha256sum "$APK" | tee /tmp/apk.sha256

      - name: Persist generated v0.4.0 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MainActivity.kt app/build.gradle.kts app/src/main/AndroidManifest.xml \
            app/src/main/java/com/admissionhub/collector/MainActivity.kt \
            app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt \
            app/src/main/java/com/admissionhub/collector/provider/AdigaAdapter.kt \
            app/src/main/java/com/admissionhub/collector/capture/SnapshotScript.kt \
            scripts/apply_v040.py scripts/fix_v040_compile.py scripts/patch_v040_historical_mirror.py
          if git diff --cached --quiet; then
            echo "v0.4.0 source already persisted"
          else
            git commit -m "Apply v0.4.0 local-first Adiga collector [skip ci]"
            git push origin HEAD:main
          fi

      - name: Upload v0.4.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: admission-collector-v0.4.0-local-first-adiga-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
