name: Build Admission Collector v0.9.8 Auth Recovery KeepAlive

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-admission-collector-v098.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}
    outputs:
      source_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply v0.9.8 patch
        run: python3 .github/scripts/patch_v098.py
      - name: Verify v0.9.8 source invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          m=Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt').read_text()
          s=Path('app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt').read_text()
          svc=Path('app/src/main/java/com/admissionhub/collector/CollectionKeepAliveService.kt').read_text()
          t=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakSiteTopology.kt').read_text()
          g=Path('app/build.gradle.kts').read_text()
          manifest=Path('app/src/main/AndroidManifest.xml').read_text()
          cred=Path('app/src/main/java/com/admissionhub/collector/session/CredentialVault.kt').read_text()
          snap=Path('app/src/main/java/com/admissionhub/collector/capture/SnapshotScript.kt').read_text()
          adapter=Path('app/src/main/java/com/admissionhub/collector/provider/JinhakAdapter.kt').read_text()
          year=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakReportYearGuard.kt').read_text()
          req={
            'version':'private const val VERSION = "0.9.8"' in m,
            'build':'private const val BUILD_CODE = 10980' in m,
            'gradle':'versionCode = 10980' in g and 'versionName = "0.9.8"' in g,
            'label':'Admission Collector v0.9.8 Auth Recovery KeepAlive' in manifest,
            'surface-exit-not-auth':'success-login-surface-exited' not in m and 'submitted-awaiting-provider-verification' in m,
            'stable-core-auth':'JINHAK_CORE_AUTH_STABLE_PASSES = 2' in m and 'protected-core-stable' in m,
            'transition-revalidation':'transition-core-revalidate' in m and 'handleJinhakTransitionAuthGate' in m,
            'persistent-recovery':'pollJinhakLoginRecovery' in m and 'JINHAK_LOGIN_RECOVERY_POLL_MS' in m,
            'exact-target-resume':'resumeBatchAfterVerifiedJinhakAuth' in m and 'currentBatchTarget' in m,
            'background-keepalive':'jinhakSessionKeepAliveBackgroundTicks' in m and 'handler.postDelayed(sessionKeepAlive, 5_000L)' in m,
            'auth-export':'jinhakAuthDiagnosticsSummary' in s and 'JINHAK_AUTH_DIAGNOSTICS' in m,
            'service-copy':'target을 보존해 자동 재인증' in svc,
            'stored-session-must-verify':'startup-stored-session-verification-required' in m and 'stored-session-direct' not in m,
            'core-queue-filter':'isJinhakDefaultCoreQueueUrl' in m and 'isDefaultSusiCoreTraversalUrl' in t,
            'strategy-seed-removed':'$ROOT/jh/high3/univ-entrance-info/ipsi-analysis/ipsi-strategy' not in t,
            'credential-vault':'AES/GCM/NoPadding' in cred and 'admission_collector_credentials_v1' in cred,
            'same-card':'unique-card-container' in snap,
            'jinhak-broad-off':'override val supportsBatchCrawl = false' in adapter,
            'year-guard':'historical-multi-year-or-unresolved' in year,
            'semantic-guard':'applicantAverageGrade' in adapter,
          }
          failed=[k for k,v in req.items() if not v]
          if failed: raise SystemExit('Missing invariant(s): '+', '.join(failed))
          if '.put("username", credentials.username)' in m or '.put("password", credentials.password)' in m:
            raise SystemExit('credential value leak into runtime JSON')
          if 'webView.loadUrl(providerLoginUrl' in m:
            raise SystemExit('forced login navigation reintroduced')
          print('v0.9.8 source invariants passed')
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_SECRET"
          STORE_FILE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ANDROID_SIGNING_SECRET -in signing/admission-upload.keystore.enc -out "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Test and build patched source
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify patched APK
        shell: bash
        run: |
          set -euo pipefail
          SRC=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$SRC" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$SRC" | tee patched-badging.txt
          grep -q "versionCode='10980'" patched-badging.txt
          grep -q "versionName='0.9.8'" patched-badging.txt
          grep -q "application-label:'Admission Collector v0.9.8 Auth Recovery KeepAlive'" patched-badging.txt
      - name: Commit v0.9.8 source
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/admissionhub/collector/MainActivity.kt app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt app/src/main/java/com/admissionhub/collector/CollectionKeepAliveService.kt app/build.gradle.kts app/src/main/AndroidManifest.xml
          git commit -m "Implement v0.9.8 auth recovery keepalive"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  independent-main-build:
    needs: patch-build-commit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Refresh exact committed main
        run: |
          git fetch origin main
          git reset --hard origin/main
          test "$(git rev-parse HEAD)" = "${{ needs.patch-build-commit.outputs.source_sha }}"
      - name: Reverify committed source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          m=Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt').read_text()
          s=Path('app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt').read_text()
          assert 'private const val VERSION = "0.9.8"' in m
          assert 'submitted-awaiting-provider-verification' in m
          assert 'transition-core-revalidate' in m
          assert 'pollJinhakLoginRecovery' in m
          assert 'resumeBatchAfterVerifiedJinhakAuth' in m
          assert 'jinhakSessionKeepAliveBackgroundTicks' in m
          assert 'jinhakAuthDiagnosticsSummary' in s
          assert 'stored-session-direct' not in m
          print('committed v0.9.8 verified')
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          STORE_FILE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ANDROID_SIGNING_SECRET -in signing/admission-upload.keystore.enc -out "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build committed main
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify and package final APK
        shell: bash
        run: |
          set -euo pipefail
          SRC=app/build/outputs/apk/debug/app-debug.apk
          OUT=Admission-Collector-v0.9.8-Auth-Recovery-KeepAlive.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$SRC" | tee apksigner.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$SRC" | tee badging.txt
          grep -q "versionCode='10980'" badging.txt
          grep -q "versionName='0.9.8'" badging.txt
          grep -q "application-label:'Admission Collector v0.9.8 Auth Recovery KeepAlive'" badging.txt
          cp "$SRC" "$OUT"
          sha256sum "$OUT" | tee Admission-Collector-v0.9.8-Auth-Recovery-KeepAlive.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: admission-collector-main-v0.9.8-final
          path: |
            Admission-Collector-v0.9.8-Auth-Recovery-KeepAlive.apk
            Admission-Collector-v0.9.8-Auth-Recovery-KeepAlive.sha256
            apksigner.txt
            badging.txt
          retention-days: 14
      - name: Publish v0.9.8 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          NOTES="v0.9.8 is driven by the real-device v0.9.7 run that authenticated Jinhak during preflight but produced zero Jinhak captures after the Adiga-to-Jinhak transition and later remained on the login screen. The fix removes login-surface disappearance as authentication proof. Jinhak credentials remain pending until the protected Susi storage route is reachable for two consecutive verification probes. Jinhak authentication is revalidated immediately at the Adiga-to-Jinhak transition instead of trusting an earlier preflight session. Login recovery is persistent rather than four short DOM probes: a slow-hydrating login page is polled until credentials can be submitted, then the protected route is reverified and the exact preserved collection target is resumed. The browser session-extension runnable now stays scheduled while a run is active even when the Activity is backgrounded; the foreground service continues to keep process priority. Live JINHAK_AUTH_DIAGNOSTICS are persisted before any snapshot so zero-capture stalls are diagnosable, and unified exports expose the latest auth diagnostic summary. Existing Susi-core queue scope, no forced login URL navigation, same-card/unique-container binding, mission ledger, report bridge, Year Guard, applicantAverageGrade guard, Slow Lane, cross-version fence and supportsBatchCrawl=false remain. Gradle test task/build/signature verification and independent committed-main rebuild passed. Provider-side absolute session expiry cannot be prevented by the app, but v0.9.8 is designed to recover automatically by reauthentication and exact-target resume. Real-device E2E remains to be verified. Commit: $SHA"
          gh release create v0.9.8 Admission-Collector-v0.9.8-Auth-Recovery-KeepAlive.apk Admission-Collector-v0.9.8-Auth-Recovery-KeepAlive.sha256 --target "$SHA" --title "Admission Collector v0.9.8 — Auth Recovery KeepAlive" --notes "$NOTES"
