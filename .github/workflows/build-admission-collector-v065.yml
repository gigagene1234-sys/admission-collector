name: Build Admission Collector v0.6.5 Safe Jinhak Explorer

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-admission-collector-v065.yml"
      - "scripts/apply_v065.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply v0.6.5 patch
        run: python3 scripts/apply_v065.py

      - name: Verify v0.6.5 source invariants
        shell: bash
        run: |
          set -euo pipefail
          cmp -s MainActivity.kt app/src/main/java/com/admissionhub/collector/MainActivity.kt
          grep -q 'private const val VERSION = "0.6.5"' MainActivity.kt
          grep -q 'private const val BUILD_CODE = 10650' MainActivity.kt
          grep -q 'versionCode = 10650' app/build.gradle.kts
          grep -q 'versionName = "0.6.5"' app/build.gradle.kts
          grep -q 'Admission Collector v0.6.5 Safe Jinhak Explorer' app/src/main/AndroidManifest.xml
          grep -q 'jinhakDeepPage' app/src/main/java/com/admissionhub/collector/capture/SnapshotScript.kt
          grep -q 'jinhakCardStats.metricSeeds<650' app/src/main/java/com/admissionhub/collector/capture/SnapshotScript.kt
          grep -q 'maxCapturedTables' app/src/main/java/com/admissionhub/collector/capture/SnapshotScript.kt
          grep -q 'maxCapturedRows' app/src/main/java/com/admissionhub/collector/capture/SnapshotScript.kt
          grep -q 'maxCapturedBlocks' app/src/main/java/com/admissionhub/collector/capture/SnapshotScript.kt
          grep -q 'maxNavigationScan' app/src/main/java/com/admissionhub/collector/capture/SnapshotScript.kt
          grep -q '++jinhakStallWatchdogGeneration' MainActivity.kt
          grep -q 'override fun onRenderProcessGone' MainActivity.kt
          grep -q 'private fun installRuntimeCrashGuard' MainActivity.kt
          grep -q 'version: "0.3.9"' cloudflare/src/index.js

      - name: Verify parser and privacy boundaries
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          snap=Path('app/src/main/java/com/admissionhub/collector/capture/SnapshotScript.kt').read_text()
          aa=snap.index('    function departmentContextFor(el,rootText){')
          bb=snap.index('    function universityContextFor(el,rootText){', aa)
          section=snap[aa:bb]
          for forbidden in ['previousElementSibling','nextElementSibling','structuredCardText(prev','structuredCardText(next']:
              if forbidden in section:
                  raise SystemExit(f'cross-card department inheritance reintroduced: {forbidden}')
          for required in ['jinhakDeepPage','metricSeeds<650','maxCapturedTables','maxCapturedRows','maxCapturedBlocks']:
              if required not in snap:
                  raise SystemExit(f'missing safe snapshot guard: {required}')
          m=Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt').read_text()
          a=m.index('    private fun runtimeSafePath(')
          b=m.index('    private fun startUnifiedCollection()', a)
          runtime=m[a:b]
          for forbidden in ['queryParameter','CookieManager.getCookie','throwable.message','rawEvidence']:
              if forbidden in runtime:
                  raise SystemExit(f'forbidden runtime diagnostic source: {forbidden}')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_SECRET"
          STORE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -pass env:ANDROID_SIGNING_SECRET \
            -in signing/admission-upload.keystore.enc \
            -out "$STORE"
          keytool -list -keystore "$STORE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build v0.6.5 APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "versionCode='10650'" /tmp/badging.txt
          grep -q "versionName='0.6.5'" /tmp/badging.txt
          sha256sum "$APK" | tee /tmp/apk.sha256

      - name: Persist generated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MainActivity.kt app/build.gradle.kts app/src/main/AndroidManifest.xml \
            app/src/main/java/com/admissionhub/collector/MainActivity.kt \
            app/src/main/java/com/admissionhub/collector/capture/SnapshotScript.kt \
            scripts/apply_v065.py
          if git diff --cached --quiet; then
            echo "source already persisted"
          else
            git commit -m "Apply v0.6.5 safe Jinhak snapshot guard [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: admission-collector-v0.6.5-safe-jinhak-explorer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
