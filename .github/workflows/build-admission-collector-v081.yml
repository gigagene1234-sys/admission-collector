name: Build Admission Collector v0.8.1 Jinhak Mission Analyst

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-admission-collector-v081.yml"
      - "scripts/apply_v081_jinhak_mission.py"
      - "app/src/main/java/com/admissionhub/collector/jinhak/JinhakSiteTopology.kt"
      - "app/src/main/java/com/admissionhub/collector/jinhak/JinhakStrategyAnalyzer.kt"
      - "app/src/main/java/com/admissionhub/collector/jinhak/JinhakAgentNavigator.kt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.8.1 mission patch
        run: python3 scripts/apply_v081_jinhak_mission.py

      - name: Verify mission and safety invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          main=Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt').read_text()
          adapter=Path('app/src/main/java/com/admissionhub/collector/provider/JinhakAdapter.kt').read_text()
          topo=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakSiteTopology.kt').read_text()
          strategy=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakStrategyAnalyzer.kt').read_text()
          agent=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakAgentNavigator.kt').read_text()
          session=Path('app/src/main/java/com/admissionhub/collector/session/SecureSessionVault.kt').read_text()
          store=Path('app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt').read_text()
          gradle=Path('app/build.gradle.kts').read_text()
          manifest=Path('app/src/main/AndroidManifest.xml').read_text()
          snap=Path('app/src/main/java/com/admissionhub/collector/capture/SnapshotScript.kt').read_text()

          required = {
              'main-version': ('private const val VERSION = "0.8.1"', main),
              'main-build': ('private const val BUILD_CODE = 10810', main),
              'gradle-code': ('versionCode = 10810', gradle),
              'gradle-name': ('versionName = "0.8.1"', gradle),
              'manifest-label': ('Admission Collector v0.8.1 Jinhak Mission Analyst', manifest),
              'mission-seeds': ('JinhakSiteTopology.missionSeeds', adapter),
              'mission-priority': ('JinhakSiteTopology.isCoreMissionRoute', main),
              'queue-front': ('batchQueue.addFirst(url)', main),
              'strategy-record': ('jinhak-strategy-insight', strategy),
              'strategy-integration': ('JinhakStrategyAnalyzer.normalize', adapter),
              'strategy-evidence': ('evidenceBlocks', strategy),
              'keystore': ('AndroidKeyStore', session),
              'aes-gcm': ('AES/GCM/NoPadding', session),
              'observation-store': ('CREATE TABLE IF NOT EXISTS observations', store),
              'watchdog': ('JINHAK_ABSOLUTE_TARGET_MS = 35_000L', main),
              'state-dedupe': ('jinhakExpandedNavigationStates', main),
              'stream-export': ('localStore.writeUnifiedExport(streamSession, writer)', main),
          }
          for label,(token,text) in required.items():
              if token not in text:
                  raise SystemExit(f'missing invariant {label}: {token}')

          for lane in ['SAVED_APPLICATIONS','CURRENT_PREDICTION','MOCK_SUPPORT','ACTUAL_ADMIT','UNIVERSITY_RESULT','STRATEGY']:
              if lane not in topo:
                  raise SystemExit(f'missing mission lane: {lane}')
          for token in ['mentionedUniversities','mentionedAdmissionTypes','evidenceBlocks']:
              if token not in strategy:
                  raise SystemExit(f'missing strategy field: {token}')
          for token in ['실제','합격자','합격','예측','모의','지원','리포트','입시','결과','전략']:
              if token not in agent:
                  raise SystemExit(f'missing analysis navigation token: {token}')
          for token in ['원서','결제','저장','삭제','로그아웃','제출','확정','취소','신청']:
              if token not in agent:
                  raise SystemExit(f'missing mutation-block token: {token}')

          dept=snap.split('function departmentContextFor',1)[1].split('function universityContextFor',1)[0]
          if 'previousElementSibling' in dept or 'nextElementSibling' in dept:
              raise SystemExit('cross-card department inheritance reintroduced')
          # Mission topology itself must never transport browser secrets.
          forbidden=['document.cookie','cookieHeader','sessionStorage','localStorage','password=','passwd=']
          for token in forbidden:
              if token.lower() in topo.lower():
                  raise SystemExit(f'mission topology carries forbidden browser material: {token}')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_SECRET"
          STORE_FILE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -pass env:ANDROID_SIGNING_SECRET \
            -in signing/admission-upload.keystore.enc \
            -out "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build v0.8.1 APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "versionCode='10810'" /tmp/badging.txt
          grep -q "versionName='0.8.1'" /tmp/badging.txt
          grep -q "application-label:'Admission Collector v0.8.1 Jinhak Mission Analyst'" /tmp/badging.txt
          sha256sum "$APK" | tee /tmp/apk.sha256

      - name: Persist generated v0.8.1 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/admissionhub/collector/MainActivity.kt \
            app/src/main/java/com/admissionhub/collector/provider/JinhakAdapter.kt \
            app/build.gradle.kts \
            app/src/main/AndroidManifest.xml
          if ! git diff --cached --quiet; then
            git commit -m "Apply v0.8.1 Jinhak mission-first navigation"
            git push origin HEAD:main
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: admission-collector-v0.8.1-jinhak-mission-analyst-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
