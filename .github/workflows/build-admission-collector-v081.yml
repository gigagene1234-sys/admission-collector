name: Build Admission Collector v0.8.1 Jinhak Mission Analyst

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-admission-collector-v081.yml"
      - "scripts/apply_v081_jinhak_mission.py"
      - "app/src/main/java/com/admissionhub/collector/jinhak/JinhakSiteTopology.kt"
      - "app/src/main/java/com/admissionhub/collector/jinhak/JinhakStrategyAnalyzer.kt"
      - "app/src/main/java/com/admissionhub/collector/jinhak/JinhakAgentNavigator.kt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.8.1 mission patch
        run: python3 scripts/apply_v081_jinhak_mission.py

      - name: Verify mission and safety invariants
        shell: bash
        run: |
          set -euo pipefail
          MAIN=app/src/main/java/com/admissionhub/collector/MainActivity.kt
          ADAPTER=app/src/main/java/com/admissionhub/collector/provider/JinhakAdapter.kt
          TOPO=app/src/main/java/com/admissionhub/collector/jinhak/JinhakSiteTopology.kt
          STRATEGY=app/src/main/java/com/admissionhub/collector/jinhak/JinhakStrategyAnalyzer.kt
          AGENT=app/src/main/java/com/admissionhub/collector/jinhak/JinhakAgentNavigator.kt
          SESSION=app/src/main/java/com/admissionhub/collector/session/SecureSessionVault.kt
          STORE=app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt

          grep -q 'private const val VERSION = "0.8.1"' "$MAIN"
          grep -q 'private const val BUILD_CODE = 10810' "$MAIN"
          grep -q 'versionCode = 10810' app/build.gradle.kts
          grep -q 'versionName = "0.8.1"' app/build.gradle.kts
          grep -q 'Admission Collector v0.8.1 Jinhak Mission Analyst' app/src/main/AndroidManifest.xml

          # Mission topology must prioritize evidence lanes over editorial/media wandering.
          grep -q 'SAVED_APPLICATIONS' "$TOPO"
          grep -q 'CURRENT_PREDICTION' "$TOPO"
          grep -q 'MOCK_SUPPORT' "$TOPO"
          grep -q 'ACTUAL_ADMIT' "$TOPO"
          grep -q 'UNIVERSITY_RESULT' "$TOPO"
          grep -q 'STRATEGY' "$TOPO"
          grep -q 'JinhakSiteTopology.missionSeeds' "$ADAPTER"
          grep -q 'JinhakSiteTopology.isCoreMissionRoute' "$MAIN"
          grep -q 'batchQueue.addFirst(url)' "$MAIN"

          # Strategy pages become analysis-ready evidence instead of generic wandering.
          grep -q 'jinhak-strategy-insight' "$STRATEGY"
          grep -q 'mentionedUniversities' "$STRATEGY"
          grep -q 'mentionedAdmissionTypes' "$STRATEGY"
          grep -q 'evidenceBlocks' "$STRATEGY"
          grep -q 'JinhakStrategyAnalyzer.normalize' "$ADAPTER"

          # The read-only agent must prefer real report/result controls but never mutate account/application state.
          for token in '실제\\s*합격자' '합격\\s*예측\\s*리포트' '모의\\s*지원\\s*리포트' '입시\\s*결과' '입시\\s*전략'; do
            grep -q "$token" "$AGENT"
          done
          for token in 원서 접수 결제 저장 삭제 로그아웃 제출 확정 취소 신청; do
            grep -q "$token" "$AGENT"
          done

          # Existing privacy and parser boundaries must remain.
          grep -q 'AndroidKeyStore' "$SESSION"
          grep -q 'AES/GCM/NoPadding' "$SESSION"
          grep -q 'CREATE TABLE IF NOT EXISTS observations' "$STORE"
          grep -q 'JINHAK_ABSOLUTE_TARGET_MS = 35_000L' "$MAIN"
          grep -q 'jinhakExpandedNavigationStates' "$MAIN"
          grep -q 'localStore.writeUnifiedExport(streamSession, writer)' "$MAIN"
          python3 - <<'PY'
          from pathlib import Path
          snap=Path('app/src/main/java/com/admissionhub/collector/capture/SnapshotScript.kt').read_text()
          dept=snap.split('function departmentContextFor',1)[1].split('function universityContextFor',1)[0]
          if 'previousElementSibling' in dept or 'nextElementSibling' in dept:
              raise SystemExit('cross-card department inheritance reintroduced')
          topo=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakSiteTopology.kt').read_text()
          if 'password' in topo.lower() or 'cookie' in topo.lower():
              raise SystemExit('mission topology must not carry credentials/session material')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_SECRET"
          STORE_FILE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -pass env:ANDROID_SIGNING_SECRET \
            -in signing/admission-upload.keystore.enc \
            -out "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build v0.8.1 APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "versionCode='10810'" /tmp/badging.txt
          grep -q "versionName='0.8.1'" /tmp/badging.txt
          grep -q "application-label:'Admission Collector v0.8.1 Jinhak Mission Analyst'" /tmp/badging.txt
          sha256sum "$APK" | tee /tmp/apk.sha256

      - name: Persist generated v0.8.1 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/admissionhub/collector/MainActivity.kt \
            app/src/main/java/com/admissionhub/collector/provider/JinhakAdapter.kt \
            app/build.gradle.kts \
            app/src/main/AndroidManifest.xml
          if ! git diff --cached --quiet; then
            git commit -m "Apply v0.8.1 Jinhak mission-first navigation"
            git push origin HEAD:main
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: admission-collector-v0.8.1-jinhak-mission-analyst-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
