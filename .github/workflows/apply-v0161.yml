name: Apply Admission Hub v0.16.1 Device Evidence Fix

on:
  push:
    branches: [codex/v0160-dashboard-official-login]
    paths:
      - ".github/scripts/patch_v0161.py"
      - ".github/workflows/apply-v0161.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: admission-hub-v0161-apply
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v0160-dashboard-official-login
          fetch-depth: 0
      - name: Apply v0.16.1 device evidence patch
        run: python3 .github/scripts/patch_v0161.py
      - name: Commit product patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git commit -m "fix: v0.16.1 real-device high3 and score materialization"
          git push origin HEAD:codex/v0160-dashboard-official-login
