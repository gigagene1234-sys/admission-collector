name: Build Admission Collector v0.9.16 Target Auth Redirect Guard

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-admission-collector-v0916.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}
    outputs:
      source_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply v0.9.16 target auth redirect loop guard
        run: python3 .github/scripts/patch_v0916.py

      - name: Verify bounded change surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          allowed={
            'app/src/main/java/com/admissionhub/collector/MainActivity.kt',
            'app/build.gradle.kts',
            'app/src/main/AndroidManifest.xml',
          }
          extra=changed-allowed
          missing=allowed-changed
          if extra: raise SystemExit('Unexpected files changed: '+', '.join(sorted(extra)))
          if missing: raise SystemExit('Required files not changed: '+', '.join(sorted(missing)))
          print('v0.9.16 file boundary passed')
          PY

      - name: Verify v0.9.16 invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          m=Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt').read_text()
          p=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakSlowLanePool.kt').read_text()
          l=Path('app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt').read_text()
          s=Path('app/src/main/java/com/admissionhub/collector/capture/SnapshotScript.kt').read_text()
          g=Path('app/build.gradle.kts').read_text()
          manifest=Path('app/src/main/AndroidManifest.xml').read_text()
          req={
            'version':'private const val VERSION = "0.9.16"' in m and 'private const val BUILD_CODE = 109160' in m,
            'gradle':'versionCode = 109160' in g and 'versionName = "0.9.16"' in g,
            'label':'Admission Collector v0.9.16 Target Auth Redirect Guard' in manifest,
            'redirect-threshold':'MAX_JINHAK_TARGET_AUTH_REDIRECT_CYCLES = 2' in m,
            'redirect-episode':'noteJinhakTargetAuthRedirectEpisode' in m and 'jinhak-target-auth-redirect-episode' in m,
            'target-quarantine':'quarantineJinhakTargetSpecificAuthRedirect' in m and 'target-specific-auth-redirect' in m,
            'target-only':'globalAuthStillVerified' in m and 'protectedCoreVerified' in m,
            'redirect-persistence':'targetAuthRedirectCounts' in m and 'targetAuthRedirectEpisodeOpenKey' in m,
            'transient-clear':'clearJinhakTargetAuthRedirectAfterSuccessfulTarget' in m,
            'mission-stall-preserved':'recoverOrStopJinhakMissionStall' in m and 'MAX_JINHAK_MISSION_STALL_RECOVERIES = 2' in m,
            'renderer-circuit-preserved':'const val DEFAULT_MAX_WORKERS = 1' in p and 'rendererCircuitOpen' in p,
            'mission-persistence-preserved':'CREATE TABLE IF NOT EXISTS jinhak_mission_targets' in l and 'monotonicStateGuard' in l,
            'same-card-preserved':'same-card-action-not-found' in m and 'MAX_JINHAK_SAME_CARD_REPLAY_ATTEMPTS = 3' in m,
            'auth-preserved':'protected-core-stable' in m and 'scheduleJinhakLoginRecovery' in m,
            'susi-core-preserved':'isDefaultSusiCoreTraversalUrl' in m,
            'snapshot-privacy':'safeCloneText' in s and 'input,textarea,select,option,form' in s,
          }
          failed=[k for k,v in req.items() if not v]
          if failed: raise SystemExit('Missing invariant(s): '+', '.join(failed))
          if '.put("username", credentials.username)' in m or '.put("password", credentials.password)' in m:
              raise SystemExit('credential export invariant failed')
          print('v0.9.16 invariants passed')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_SECRET"
          STORE_FILE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ANDROID_SIGNING_SECRET -in signing/admission-upload.keystore.enc -out "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Test and build patched source
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Verify patched APK
        shell: bash
        run: |
          set -euo pipefail
          SRC=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$SRC" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$SRC" | tee patched-badging.txt
          grep -q "versionCode='109160'" patched-badging.txt
          grep -q "versionName='0.9.16'" patched-badging.txt
          grep -q "application-label:'Admission Collector v0.9.16 Target Auth Redirect Guard'" patched-badging.txt

      - name: Commit v0.9.16 source
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/admissionhub/collector/MainActivity.kt \
                  app/build.gradle.kts app/src/main/AndroidManifest.xml
          git commit -m "Implement v0.9.16 Target Auth Redirect Guard"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  independent-main-build:
    needs: patch-build-commit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Refresh exact committed main
        run: |
          git fetch origin main
          git reset --hard origin/main
          test "$(git rev-parse HEAD)" = "${{ needs.patch-build-commit.outputs.source_sha }}"

      - name: Reverify committed v0.9.16
        run: |
          python3 - <<'PY'
          from pathlib import Path
          m=Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt').read_text()
          p=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakSlowLanePool.kt').read_text()
          g=Path('app/build.gradle.kts').read_text()
          assert 'private const val VERSION = "0.9.16"' in m
          assert 'versionCode = 109160' in g
          assert 'MAX_JINHAK_TARGET_AUTH_REDIRECT_CYCLES = 2' in m
          assert 'quarantineJinhakTargetSpecificAuthRedirect' in m
          assert 'target-specific-auth-redirect' in m
          assert 'targetAuthRedirectCounts' in m
          assert 'recoverOrStopJinhakMissionStall' in m
          assert 'const val DEFAULT_MAX_WORKERS = 1' in p
          assert 'rendererCircuitOpen' in p
          print('committed v0.9.16 verified')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          STORE_FILE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ANDROID_SIGNING_SECRET -in signing/admission-upload.keystore.enc -out "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build committed main
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify and package final APK
        shell: bash
        run: |
          set -euo pipefail
          SRC=app/build/outputs/apk/debug/app-debug.apk
          OUT=Admission-Collector-v0.9.16-Target-Auth-Redirect-Guard.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$SRC" | tee apksigner.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$SRC" | tee badging.txt
          grep -q "versionCode='109160'" badging.txt
          grep -q "versionName='0.9.16'" badging.txt
          grep -q "application-label:'Admission Collector v0.9.16 Target Auth Redirect Guard'" badging.txt
          cp "$SRC" "$OUT"
          sha256sum "$OUT" | tee Admission-Collector-v0.9.16-Target-Auth-Redirect-Guard.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: admission-collector-main-v0.9.16-final
          path: |
            Admission-Collector-v0.9.16-Target-Auth-Redirect-Guard.apk
            Admission-Collector-v0.9.16-Target-Auth-Redirect-Guard.sha256
            apksigner.txt
            badging.txt
          retention-days: 14

      - name: Publish v0.9.16 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          NOTES="v0.9.16 fixes one real-device issue from admission-unified-v0.9.15-1788525544096.json: a target-specific auth redirect loop where a target redirected to /member/login, the protected saved-application library still verified the provider session as authenticated, and the collector then retried the same target until it redirected to login again. v0.9.16 allows one normal recovery cycle for a genuine session expiry. If the same non-core target enters a second distinct login redirect episode and the protected core re-verifies successfully, only that target is quarantined as target-specific-auth-redirect; global Jinhak auth remains verified and collection advances to the next target. Per-target redirect counts are persisted in the existing mission runtime checkpoint using SHA-256 target keys so Activity/process recovery cannot reset the loop guard. A successfully loaded target clears its local redirect count. New diagnostics expose redirect episodes, quarantines, tracked-target count, maximum cycles, threshold and last safe host/path. This release intentionally does not change login DOM selectors, mission identity rules, same-card replay, renderer circuit behavior, mission-stall fences, privacy guards or Susi-only routing. Commit: $SHA"
          gh release create v0.9.16 Admission-Collector-v0.9.16-Target-Auth-Redirect-Guard.apk Admission-Collector-v0.9.16-Target-Auth-Redirect-Guard.sha256 --target "$SHA" --title "Admission Collector v0.9.16 — Target Auth Redirect Guard" --notes "$NOTES"
