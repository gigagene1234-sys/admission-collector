name: Build Admission Hub v0.18.7 True Passive Manual Browser

on:
  push:
    branches: [codex/v0187-true-passive-manual-browser]
    paths:
      - ".github/workflows/build-admission-hub-v0187-true-passive-manual-browser.yml"
      - ".github/scripts/patch_v0187_true_passive_manual_browser.py"
      - ".github/scripts/verify_v0187_true_passive_manual_browser.py"
      - ".github/scripts/verify_apk_v0187.sh"
      - "app/src/main/java/com/admissionhub/collector/MainActivity.kt"
      - "app/src/main/java/com/admissionhub/collector/jinhak/JinhakPassiveBrowserSurfacePolicy.kt"
      - "app/src/test/java/com/admissionhub/collector/jinhak/JinhakPassiveBrowserSurfacePolicyTest.kt"
      - "docs/releases/v0.18.7.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: admission-hub-v0187-true-passive-manual-browser
  cancel-in-progress: true

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}
      APK_NAME: Admission-Hub-v0.18.7-True-Passive-Manual-Browser.apk
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/v0187-true-passive-manual-browser

      - name: Apply v0.18.7 real-device runtime repair
        run: |
          set -euo pipefail
          python3 .github/scripts/patch_v0187_true_passive_manual_browser.py
          git diff --check

      - name: Verify source contracts before commit
        run: python3 .github/scripts/verify_v0187_true_passive_manual_browser.py

      - name: Commit exact v0.18.7 product source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts app/src/main/AndroidManifest.xml app/src/main/java/com/admissionhub/collector/MainActivity.kt
          if ! git diff --cached --quiet; then
            git commit -m 'Admission Hub v0.18.7 true passive manual browser runtime repair'
            git push origin HEAD:codex/v0187-true-passive-manual-browser
          fi
          echo "PRODUCT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify committed source clean
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_v0187_true_passive_manual_browser.py
          git diff --check
          git diff --exit-code
          git diff --cached --exit-code

      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}

      - name: Restore stable signing key
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_SECRET"
          STORE_FILE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ANDROID_SIGNING_SECRET -in signing/admission-upload.keystore.enc -out "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.7', cache-read-only: true}

      - name: Test all contracts
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace testDebugUnitTest
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          fs=list(pathlib.Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'))
          if not fs: raise SystemExit('no tests')
          t=f=e=s=0
          for p in fs:
              r=ET.parse(p).getroot(); t+=int(r.attrib.get('tests',0)); f+=int(r.attrib.get('failures',0)); e+=int(r.attrib.get('errors',0)); s+=int(r.attrib.get('skipped',0))
          print({'tests':t,'failures':f,'errors':e,'skipped':s})
          if f or e or s or t < 186: raise SystemExit('tests not clean')
          PY

      - name: Compile signed product
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK metadata and signer
        run: bash .github/scripts/verify_apk_v0187.sh

      - name: Clean rebuild and retest exact committed source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_COMMIT"
          git diff --exit-code
          gradle --no-daemon clean testDebugUnitTest assembleDebug
          python3 .github/scripts/verify_v0187_true_passive_manual_browser.py
          bash .github/scripts/verify_apk_v0187.sh
          git diff --exit-code

      - name: Package release
        run: |
          set -euo pipefail
          mkdir -p release-v0187
          cp app/build/outputs/apk/debug/app-debug.apk "release-v0187/$APK_NAME"
          APK_SHA="$(sha256sum "release-v0187/$APK_NAME" | awk '{print $1}')"
          echo "$APK_SHA  $APK_NAME" > "release-v0187/$APK_NAME.sha256"
          SIGNER="$(apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print tolower($2); exit}')"
          TESTS="$(python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          print(sum(int(ET.parse(p).getroot().attrib.get('tests',0)) for p in pathlib.Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml')))
          PY
          )"
          cat > release-v0187/verification-v0.18.7.json <<EOF
          {"versionName":"0.18.7","versionCode":118700,"sourceCommit":"$PRODUCT_COMMIT","tests":$TESTS,"apkSha256":"$APK_SHA","signerSha256":"$SIGNER","jinhakAuthOwnership":"user-browser-only","manualBrowserInterference":false,"manualBrowserDefaultWebViewUserAgent":true,"manualBrowserMultipleWindows":false,"manualBrowserPopupHandoff":false,"providerCookiesFlushed":true,"providerCookiesExported":false,"legacyHigh3ClassifierBeforeStorage":false,"automationStartGate":"visible-susi-storage","storagePath":"/jh/high3/early/four-year-university/library","navigationModel":"application-card-report-only","scopeDepartureAction":"stop-only-no-webview-stopLoading","exactPinnedLocalRebind":true,"similarityRebind":false,"reviewIdentityYearPreserved":true,"jinhakPromotedToOfficial":false,"probabilityInferredByRelease":false,"deviceAcceptance":"PENDING_V0187_REAL_GALAXY_RUN"}
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: admission-hub-v0.18.7-true-passive-manual-browser
          path: release-v0187/*

      - name: Publish verified release
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          set -euo pipefail
          gh release view v0.18.7 >/dev/null 2>&1 && gh release delete v0.18.7 --yes --cleanup-tag || true
          gh release create v0.18.7 release-v0187/* --target "$PRODUCT_COMMIT" --title 'Admission Hub v0.18.7 — True Passive Manual Browser' --notes-file docs/releases/v0.18.7.md
