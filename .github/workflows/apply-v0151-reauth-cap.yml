name: Apply v0.15.1 Jinhak Reauth Cap

on:
  push:
    branches: [codex/v0151-wide-xls-high3-fence]
    paths:
      - ".github/scripts/patch_v0151_reauth_cap.py"
      - ".github/workflows/apply-v0151-reauth-cap.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: admission-hub-v0151-reauth-cap
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v0151-wide-xls-high3-fence
          fetch-depth: 0
      - name: Apply finite reauth circuit breaker
        run: python3 .github/scripts/patch_v0151_reauth_cap.py
      - name: Commit product patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/admissionhub/collector/MainActivity.kt
          git commit -m "fix: cap Jinhak reauth loops at three cycles"
          git push origin HEAD:codex/v0151-wide-xls-high3-fence
