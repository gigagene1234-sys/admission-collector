name: Build Admission Hub v0.10.0 Canonical Six Graph Retry

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-admission-hub-v0100-retry.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}
      APK_NAME: Admission-Hub-v0.10.0-Canonical-Six-Graph.apk

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.10.0 patch and compile hotfix
        run: |
          python3 .github/scripts/patch_v0100.py
          python3 .github/scripts/patch_v0100_compile_hotfix.py

      - name: Verify roadmap, user-control and safety invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          main=Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt').read_text()
          store=Path('app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt').read_text()
          canon=Path('app/src/main/java/com/admissionhub/collector/canonical/CanonicalSixApplicationGraph.kt').read_text()
          adapter=Path('app/src/main/java/com/admissionhub/collector/provider/JinhakAdapter.kt').read_text()
          mission=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakApplicationMission.kt').read_text()
          cell=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakMissionCellSupervisor.kt').read_text()
          checks={
            'version': 'private const val VERSION = "0.10.0"' in main and 'private const val BUILD_CODE = 110000' in main,
            'canonical-db': all(x in store for x in ['canonical_applications','hub_application_slots','hub_quality_audits']),
            'graph-builder': 'object CanonicalSixApplicationGraph' in canon and 'missionApplications' in canon,
            'semantic-separation': 'predictionDoesNotOverwriteHistoricalActual' in store and 'officialBaseline' in store,
            'six-slot-user-control': 'userControlsAddChangeReplaceOrder' in store and 'externalCollectionAutoSelection' in main,
            'six-slot-editor-wired': 'fun setHubApplicationSlot(' in store and 'showHubCandidatePicker' in main and 'localStore.setHubApplicationSlot' in main,
            'slot-title-compile-fix': '${slot}번 지원안 선택' in main,
            'quality-audit': 'UnifiedSyncState.QUALITY_AUDIT.name' in main and 'refreshCanonicalQualityAudit' in store,
            'hub-publish': 'UnifiedSyncState.HUB_PUBLISH.name' in main,
            'batch-crawl-disabled': 'override val supportsBatchCrawl = false' in adapter,
            'user-session-mission': 'override val supportsUserSessionMissionTraversal = true' in adapter,
            'mission-cell': 'JinhakMissionCellSupervisor' in main and 'LATE_CALLBACK_IGNORED' in cell,
            'same-card': 'same-card-action-not-found' in main,
            'no-invented-rail-dept': '철도차량시스템공학과' not in mission,
            'privacy': 'credentialStored' in store and 'sessionSecretStored' in store,
          }
          failed=[k for k,v in checks.items() if not v]
          if failed: raise SystemExit('v0.10.0 invariant failure: '+', '.join(failed))
          for banned in ['autoSelectTopSix','autoReplaceHubSlot','inferMissingDepartment','inferMissingAdmission']:
              if banned in canon or banned in store or banned in main:
                  raise SystemExit('forbidden automatic inference/slot mutation: '+banned)
          print('v0.10.0 roadmap + safety invariants passed')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_SECRET"
          STORE_FILE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ANDROID_SIGNING_SECRET -in signing/admission-upload.keystore.enc -out "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compile patched source
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify patched APK metadata and signer
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -Fq "versionCode='110000'" /tmp/badging.txt
          grep -Fq "versionName='0.10.0'" /tmp/badging.txt
          grep -Fq "application-label:'Admission Hub v0.10.0 Canonical Six Graph'" /tmp/badging.txt
          grep -qi 'db6cd5efceda108657662d06f857e5f0277301cb6ab97a75c8a01994c96e4995' /tmp/apksigner.txt

      - name: Commit v0.10.0 product source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/admissionhub/collector/MainActivity.kt \
            app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt \
            app/src/main/java/com/admissionhub/collector/canonical/CanonicalSixApplicationGraph.kt \
            app/build.gradle.kts \
            app/src/main/AndroidManifest.xml
          git commit -m "Implement v0.10.0 Canonical Six Application Graph and Quality Audit"
          git push origin HEAD:main
          PRODUCT_SHA=$(git rev-parse HEAD)
          echo "PRODUCT_SHA=$PRODUCT_SHA" >> "$GITHUB_ENV"
          echo "Product commit: $PRODUCT_SHA"

      - name: Rebuild exact committed product source
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$PRODUCT_SHA"
          rm -rf app/build
          gradle --no-daemon :app:assembleDebug
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/final-apksigner.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/final-badging.txt
          grep -Fq "versionCode='110000'" /tmp/final-badging.txt
          grep -Fq "versionName='0.10.0'" /tmp/final-badging.txt
          grep -qi 'db6cd5efceda108657662d06f857e5f0277301cb6ab97a75c8a01994c96e4995' /tmp/final-apksigner.txt

      - name: Package final APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/$APK_NAME"
          sha256sum "dist/$APK_NAME" | tee "dist/$APK_NAME.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: admission-hub-v0.10.0-canonical-six-graph
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish v0.10.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete v0.10.0 --yes --cleanup-tag >/dev/null 2>&1 || true
          git tag -f v0.10.0 "$PRODUCT_SHA"
          git push origin -f v0.10.0
          gh release create v0.10.0 \
            "dist/$APK_NAME" "dist/$APK_NAME.sha256" \
            --target "$PRODUCT_SHA" \
            --title "Admission Hub v0.10.0 — Canonical Six Application Graph + Quality Audit" \
            --notes "Roadmap transition from collector hardening to Canonical Merge / Quality Audit / Hub Publish. Builds a conservative canonical candidate graph from persisted same-card Jinhak application identities and official Adiga baseline matches without inventing missing department/admission bindings. Adds persistent six application slots controlled only by the user; external collection never auto-selects, replaces or reorders them. Adds quality audit states, accepted/provisional/provider-only binding classes, 5-lane coverage checks, Hub readiness, startup rebuild from existing v0.9.26 SQLite data, and a simple in-app six-slot manager. Preserves Jinhak mission safety, observation-first evidence, prediction-vs-historical semantic separation, crash-safe checkpointing, terminal seal, and the stable package/signer. Product commit: $PRODUCT_SHA"
