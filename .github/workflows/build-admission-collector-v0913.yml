name: Build Admission Collector v0.9.13 Same-Card Mission Replay Recovery

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-admission-collector-v0913.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}
    outputs:
      source_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply v0.9.13 same-card replay patch
        run: python3 .github/scripts/patch_v0913.py

      - name: Verify bounded change surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          allowed={
            'app/src/main/java/com/admissionhub/collector/MainActivity.kt',
            'app/src/main/java/com/admissionhub/collector/jinhak/JinhakAgentNavigator.kt',
            'app/src/main/java/com/admissionhub/collector/jinhak/JinhakMissionTargetLedger.kt',
            'app/build.gradle.kts',
            'app/src/main/AndroidManifest.xml',
          }
          extra=changed-allowed
          missing=allowed-changed
          if extra: raise SystemExit('Unexpected files changed: '+', '.join(sorted(extra)))
          if missing: raise SystemExit('Required files not changed: '+', '.join(sorted(missing)))
          print('v0.9.13 file boundary passed')
          PY

      - name: Verify v0.9.13 invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          m=Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt').read_text()
          n=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakAgentNavigator.kt').read_text()
          l=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakMissionTargetLedger.kt').read_text()
          store=Path('app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt').read_text()
          snap=Path('app/src/main/java/com/admissionhub/collector/capture/SnapshotScript.kt').read_text()
          g=Path('app/build.gradle.kts').read_text()
          manifest=Path('app/src/main/AndroidManifest.xml').read_text()
          req={
            'version':'private const val VERSION = "0.9.13"' in m and 'private const val BUILD_CODE = 109130' in m,
            'gradle':'versionCode = 109130' in g and 'versionName = "0.9.13"' in g,
            'label':'Admission Collector v0.9.13 Same-Card Mission Replay Recovery' in manifest,
            'bounded-replay':'MAX_JINHAK_SAME_CARD_REPLAY_ATTEMPTS = 3' in m,
            'retryable-pending':'fun markRetryableFailure' in l and 'target.state != State.PENDING' in l,
            'replay-event':'jinhak-same-card-replay-scheduled' in m,
            'replay-telemetry':'sameCardReplayRetries' in m and 'sameCardReplayRecovered' in m and 'sameCardReplayTerminalFailures' in m,
            'capacity-proof':'unique-card-capacity' in n and 'metricCount>1' in n,
            'unique-action-proof':'matchingActionCount(cur)!==1' in n,
            'bounded-context-fallback':'bounded-context-fallback' in n,
            'exact-label':'labelOf(el)!==expected' in n,
            'no-sibling-replay':'previousElementSibling' not in n and 'nextElementSibling' not in n,
            'persistence-preserved':'CREATE TABLE IF NOT EXISTS jinhak_mission_targets' in store and 'state_rank' in store,
            'bootstrap-preserved':'jinhak-bootstrap-no-success' in m and 'MAX_JINHAK_BOOTSTRAP_PAGE_RETRIES = 2' in m,
            'strict-500-preserved':'titleServerError' in snap and 'bodyServerError' in snap,
            'renderer-preserved':'webview-renderer-recovered-in-place' in m,
            'auth-preserved':'protected-core-stable' in m and 'scheduleJinhakLoginRecovery' in m,
            'susi-core-preserved':'isDefaultSusiCoreTraversalUrl' in m,
          }
          failed=[k for k,v in req.items() if not v]
          if failed: raise SystemExit('Missing invariant(s): '+', '.join(failed))
          if 'handler.postDelayed({ recreate() }, 250L)' in m:
            raise SystemExit('renderer recovery regressed')
          if '.put("username", credentials.username)' in m or '.put("password", credentials.password)' in m:
            raise SystemExit('credential export invariant failed')
          if 'document.body' in n and 'sameCard' in n:
            # Body may not be used as a card ownership fallback in the execution resolver.
            section=n[n.index('fun executionScript'):n.index('private fun isSafeReadNavigationLabel')]
            if "tag==='BODY'||tag==='HTML'" not in section:
              raise SystemExit('bounded card resolver body fence missing')
          print('v0.9.13 invariants passed')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_SECRET"
          STORE_FILE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ANDROID_SIGNING_SECRET -in signing/admission-upload.keystore.enc -out "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Test and build patched source
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Verify patched APK
        shell: bash
        run: |
          set -euo pipefail
          SRC=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$SRC" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$SRC" | tee patched-badging.txt
          grep -q "versionCode='109130'" patched-badging.txt
          grep -q "versionName='0.9.13'" patched-badging.txt
          grep -q "application-label:'Admission Collector v0.9.13 Same-Card Mission Replay Recovery'" patched-badging.txt

      - name: Commit v0.9.13 source
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/admissionhub/collector/MainActivity.kt \
                  app/src/main/java/com/admissionhub/collector/jinhak/JinhakAgentNavigator.kt \
                  app/src/main/java/com/admissionhub/collector/jinhak/JinhakMissionTargetLedger.kt \
                  app/build.gradle.kts app/src/main/AndroidManifest.xml
          git commit -m "Implement v0.9.13 same-card mission replay recovery"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  independent-main-build:
    needs: patch-build-commit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Refresh exact committed main
        run: |
          git fetch origin main
          git reset --hard origin/main
          test "$(git rev-parse HEAD)" = "${{ needs.patch-build-commit.outputs.source_sha }}"

      - name: Reverify committed v0.9.13
        run: |
          python3 - <<'PY'
          from pathlib import Path
          m=Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt').read_text()
          n=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakAgentNavigator.kt').read_text()
          l=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakMissionTargetLedger.kt').read_text()
          g=Path('app/build.gradle.kts').read_text()
          assert 'private const val VERSION = "0.9.13"' in m
          assert 'versionCode = 109130' in g
          assert 'MAX_JINHAK_SAME_CARD_REPLAY_ATTEMPTS = 3' in m
          assert 'jinhak-same-card-replay-scheduled' in m
          assert 'fun markRetryableFailure' in l
          assert 'unique-card-capacity' in n
          assert 'bounded-context-fallback' in n
          assert 'jinhak-bootstrap-no-success' in m
          assert 'webview-renderer-recovered-in-place' in m
          print('committed v0.9.13 verified')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          STORE_FILE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ANDROID_SIGNING_SECRET -in signing/admission-upload.keystore.enc -out "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build committed main
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify and package final APK
        shell: bash
        run: |
          set -euo pipefail
          SRC=app/build/outputs/apk/debug/app-debug.apk
          OUT=Admission-Collector-v0.9.13-Same-Card-Mission-Replay-Recovery.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$SRC" | tee apksigner.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$SRC" | tee badging.txt
          grep -q "versionCode='109130'" badging.txt
          grep -q "versionName='0.9.13'" badging.txt
          grep -q "application-label:'Admission Collector v0.9.13 Same-Card Mission Replay Recovery'" badging.txt
          cp "$SRC" "$OUT"
          sha256sum "$OUT" | tee Admission-Collector-v0.9.13-Same-Card-Mission-Replay-Recovery.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: admission-collector-main-v0.9.13-final
          path: |
            Admission-Collector-v0.9.13-Same-Card-Mission-Replay-Recovery.apk
            Admission-Collector-v0.9.13-Same-Card-Mission-Replay-Recovery.sha256
            apksigner.txt
            badging.txt
          retention-days: 14

      - name: Publish v0.9.13 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          NOTES="v0.9.13 is a bounded same-card mission replay recovery release based on the real-device v0.9.12 export admission-unified-v0.9.12-1788487177796.json. v0.9.12 successfully bootstrapped Jinhak (66 snapshot attempts, 65 successes), discovered 30 saved-application identities and persisted 30 mission targets, proving the bootstrap/persistence path now reaches real mission execution. The remaining primary failure was 28/30 current-prediction targets terminating as same-card-action-not-found, with only 2 confirmed. v0.9.13 keeps exact-label and same-card ownership requirements, adds normalized bounded card reproving using university+department plus a unique local capacity marker (or admission fallback when capacity is unavailable), rejects ancestors spanning multiple card metrics or multiple matching actions, and retries same-card-action-not-found at most three attempts before terminal failure. Replay attempts remain PENDING and are persisted without weakening the monotonic state guard. New aggregate replay telemetry reports retries, recoveries, terminal failures and successful resolution modes. No sibling/nearest-card/page-wide target binding, extra slow workers, proactive login navigation, credential export or state-changing admission actions are introduced. Existing v0.9.12 bootstrap recovery, v0.9.11 SQLite mission persistence, v0.9.10 renderer recovery, authentication and Susi-only routing invariants are preserved. Commit: $SHA"
          gh release create v0.9.13 Admission-Collector-v0.9.13-Same-Card-Mission-Replay-Recovery.apk Admission-Collector-v0.9.13-Same-Card-Mission-Replay-Recovery.sha256 --target "$SHA" --title "Admission Collector v0.9.13 — Same-Card Mission Replay Recovery" --notes "$NOTES"
