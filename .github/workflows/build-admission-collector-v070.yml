name: Build Admission Collector v0.7.0 Observation Foundation

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-admission-collector-v070.yml"
      - "scripts/apply_v070_foundation.py"
      - "scripts/fix_v070_generated.py"
      - "app/src/main/java/com/admissionhub/collector/provider/ProviderCapability.kt"
      - "app/src/main/java/com/admissionhub/collector/sync/UnifiedSyncState.kt"
      - "app/src/main/java/com/admissionhub/collector/observation/ObservationEvidence.kt"
      - "app/src/main/java/com/admissionhub/collector/adiga/AdigaDeterministicPlanner.kt"
      - "app/src/main/java/com/admissionhub/collector/canonical/CanonicalAdmissionsGraph.kt"
      - "app/src/main/java/com/admissionhub/collector/jinhak/JinhakAuthorizedConnector.kt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply one-time v0.7.0 foundation migration
        run: |
          python3 scripts/apply_v070_foundation.py
          python3 scripts/fix_v070_generated.py

      - name: Verify v0.7.0 architecture invariants
        shell: bash
        run: |
          set -euo pipefail
          MAIN=app/src/main/java/com/admissionhub/collector/MainActivity.kt
          STORE=app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt
          grep -q 'private const val VERSION = "0.7.0"' "$MAIN"
          grep -q 'private const val BUILD_CODE = 10700' "$MAIN"
          grep -q 'versionCode = 10700' app/build.gradle.kts
          grep -q 'versionName = "0.7.0"' app/build.gradle.kts
          grep -q 'Admission Collector v0.7.0 Observation Foundation' app/src/main/AndroidManifest.xml
          grep -q 'PUBLIC_DETERMINISTIC_COLLECTION' app/src/main/java/com/admissionhub/collector/provider/ProviderCapability.kt
          grep -q 'JINHAK_CAPABILITY_DISCOVERY' app/src/main/java/com/admissionhub/collector/sync/UnifiedSyncState.kt
          grep -q 'class LocalCollectorStore' "$STORE"
          grep -q 'CREATE TABLE IF NOT EXISTS observations' "$STORE"
          grep -q 'content_fingerprint' "$STORE"
          grep -q 'context_fingerprint' "$STORE"
          grep -q 'CREATE TABLE IF NOT EXISTS canonical_entities' "$STORE"
          grep -q 'CREATE TABLE IF NOT EXISTS provider_entity_mappings' "$STORE"
          grep -q 'CREATE TABLE IF NOT EXISTS adiga_plan_tasks' "$STORE"
          grep -q 'CREATE TABLE IF NOT EXISTS provider_capability_evidence' "$STORE"
          grep -q 'CREATE TABLE IF NOT EXISTS sync_state_events' "$STORE"
          grep -q 'fun storeObservationEvidence' "$STORE"
          grep -q 'fun writeObservations' "$STORE"
          grep -q 'observationEvidence' "$STORE"
          grep -q 'jinhak-unclassified-observation-preserved' "$MAIN"
          ! grep -q 'jinhak-nonadmission-page-skipped' "$MAIN"
          grep -q 'unclassified-potential-value' "$MAIN"
          grep -q 'probeJinhakOfficialCapabilities' "$MAIN"
          grep -q 'JinhakCapabilityProbe.javascript' "$MAIN"
          grep -q 'override val supportsBatchCrawl = false' app/src/main/java/com/admissionhub/collector/provider/JinhakAdapter.kt
          grep -q 'override fun isBatchNavigable(url: String): Boolean = false' app/src/main/java/com/admissionhub/collector/provider/JinhakAdapter.kt
          grep -q 'version: "0.3.9"' cloudflare/src/index.js

      - name: Verify observation preservation and safety boundaries
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main=Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt').read_text()
          store=Path('app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt').read_text()
          probe=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakAuthorizedConnector.kt').read_text()
          obs=Path('app/src/main/java/com/admissionhub/collector/observation/ObservationEvidence.kt').read_text()
          adapter=Path('app/src/main/java/com/admissionhub/collector/provider/JinhakAdapter.kt').read_text()

          if 'return@collectSnapshot' in main[main.index('val knownStructuredType'):main.index('val records = normalizeSnapshot', main.index('val knownStructuredType'))]:
              raise SystemExit('unknown Jinhak pages are still discarded before observation persistence')
          if 'unifiedJinhakCapturedPages.contains(pageKey)' in main:
              raise SystemExit('URL-only Jinhak dedupe still active')
          if 'idx_unified_capture_page ON' in store and 'DROP INDEX IF EXISTS idx_unified_capture_page' not in store:
              raise SystemExit('legacy route-only capture index was not retired')
          for required in ['safeRouteKey','contentFingerprint','contextFingerprint','seen_count','reprocess_state']:
              if required not in store and required not in obs:
                  raise SystemExit(f'observation field missing: {required}')
          forbidden_probe = ['document.cookie','localStorage','sessionStorage','input.value','location.href','fetch(','XMLHttpRequest']
          for token in forbidden_probe:
              if token in probe:
                  raise SystemExit(f'capability probe reads forbidden material: {token}')
          if 'supportsBatchCrawl = true' in adapter or 'isBatchNavigable(url: String): Boolean = true' in adapter:
              raise SystemExit('protected Jinhak batch crawler re-enabled')

          snap=Path('app/src/main/java/com/admissionhub/collector/capture/SnapshotScript.kt').read_text()
          a=snap.index('    function departmentContextFor(el,rootText){')
          b=snap.index('    function universityContextFor(el,rootText){', a)
          section=snap[a:b]
          for forbidden in ['previousElementSibling','nextElementSibling','structuredCardText(prev','structuredCardText(next']:
              if forbidden in section:
                  raise SystemExit(f'cross-card department inheritance reintroduced: {forbidden}')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_SECRET"
          STORE_FILE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -pass env:ANDROID_SIGNING_SECRET \
            -in signing/admission-upload.keystore.enc \
            -out "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build v0.7.0 APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "versionCode='10700'" /tmp/badging.txt
          grep -q "versionName='0.7.0'" /tmp/badging.txt
          sha256sum "$APK" | tee /tmp/apk.sha256

      - name: Persist generated v0.7.0 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/admissionhub/collector/MainActivity.kt \
            app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt \
            app/build.gradle.kts app/src/main/AndroidManifest.xml
          if git diff --cached --quiet; then
            echo "source already persisted"
          else
            git commit -m "Apply v0.7.0 observation foundation [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: admission-collector-v0.7.0-observation-foundation-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
