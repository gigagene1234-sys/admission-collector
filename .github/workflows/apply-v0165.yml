name: Apply Admission Hub v0.16.5 Login Handoff

on:
  push:
    branches: [codex/v0165-auth-exit-dashboard-gates]
    paths:
      - ".github/scripts/patch_v0165.py"
      - ".github/workflows/apply-v0165.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: admission-hub-v0165-apply
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v0165-auth-exit-dashboard-gates
          fetch-depth: 0
      - name: Apply v0.16.5 stable site-login handoff patch
        run: python3 .github/scripts/patch_v0165.py
      - name: Commit product patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git commit -m "fix: keep Jinhak site login stable and close probe on protected core"
          git push origin HEAD:codex/v0165-auth-exit-dashboard-gates
