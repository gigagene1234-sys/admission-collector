name: Build Admission Hub v0.11 Six-Card Dashboard

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-admission-hub-v0110.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}
      APK_NAME: Admission-Hub-v0.11-Six-Card-Dashboard.apk

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.11.0 dashboard patch
        run: python3 .github/scripts/patch_v0110.py

      - name: Verify cumulative safety and dashboard invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          main=Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt').read_text()
          model=Path('app/src/main/java/com/admissionhub/collector/hub/HubDashboardModel.kt').read_text()
          store=Path('app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt').read_text()
          adapter=Path('app/src/main/java/com/admissionhub/collector/provider/JinhakAdapter.kt').read_text()
          mission=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakApplicationMission.kt').read_text()
          cell=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakMissionCellSupervisor.kt').read_text()
          checks={
            'version': 'private const val VERSION = "0.11.0"' in main and 'private const val BUILD_CODE = 111000' in main,
            'six-card-dashboard': 'hubDashboardCards' in main and 'repeat(6)' in main and 'showHubDashboardCard' in main,
            'persisted-sync-status': 'localStore.unifiedStatus' in main and 'hubDashboardTicker' in main,
            'dashboard-pure-view': 'object HubDashboardModel' in model and 'fun build(' in model,
            'quality-visible': '공식 전형 연결 확인 필요' in model and 'provider-only' in model,
            'local-rebind-preserved': 'localRebindDecision' in main and 'runLocalRebindOnly' in main,
            'selected-six-preserved': 'startSelectedSixRecovery' in main,
            'batch-crawl-disabled': 'override val supportsBatchCrawl = false' in adapter,
            'user-session-mission': 'override val supportsUserSessionMissionTraversal = true' in adapter,
            'mission-cell': 'LATE_CALLBACK_IGNORED' in cell and 'expireStaleOwnership' in cell,
            'privacy': 'credentialExported' in main and 'sessionSecretExported' in main,
            'no-invented-rail-dept': '철도차량시스템공학과' not in mission,
            'observations-preserved': 'CREATE TABLE IF NOT EXISTS observations' in store,
          }
          failed=[k for k,v in checks.items() if not v]
          if failed: raise SystemExit('v0.11.0 invariant failure: '+', '.join(failed))
          if 'autoSelectTopSix' in main or 'inferMissingAdmission' in model:
              raise SystemExit('dashboard must not mutate/infer application identity')
          print('v0.11.0 dashboard + cumulative safety invariants passed')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_SECRET"
          STORE_FILE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ANDROID_SIGNING_SECRET -in signing/admission-upload.keystore.enc -out "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run dashboard Mission Lab tests
        run: gradle --no-daemon :app:testDebugUnitTest --tests "com.admissionhub.collector.hub.HubDashboardModelTest"

      - name: Compile patched source
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify patched APK metadata and signer
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -Fq "versionCode='111000'" /tmp/badging.txt
          grep -Fq "versionName='0.11.0'" /tmp/badging.txt
          grep -Fq "application-label:'Admission Hub v0.11 Six-Card Dashboard'" /tmp/badging.txt
          grep -qi 'db6cd5efceda108657662d06f857e5f0277301cb6ab97a75c8a01994c96e4995' /tmp/apksigner.txt

      - name: Commit v0.11.0 product source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/admissionhub/collector/MainActivity.kt \
            app/src/main/java/com/admissionhub/collector/hub/HubDashboardModel.kt \
            app/src/test/java/com/admissionhub/collector/hub/HubDashboardModelTest.kt \
            app/build.gradle.kts \
            app/src/main/AndroidManifest.xml
          git commit -m "Implement v0.11 Six-Card Dashboard and persisted sync status"
          git push origin HEAD:main
          PRODUCT_SHA=$(git rev-parse HEAD)
          echo "PRODUCT_SHA=$PRODUCT_SHA" >> "$GITHUB_ENV"
          echo "Product commit: $PRODUCT_SHA"

      - name: Rebuild and retest exact committed product source
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$PRODUCT_SHA"
          rm -rf app/build
          gradle --no-daemon :app:testDebugUnitTest --tests "com.admissionhub.collector.hub.HubDashboardModelTest"
          gradle --no-daemon :app:assembleDebug
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/final-apksigner.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/final-badging.txt
          grep -Fq "versionCode='111000'" /tmp/final-badging.txt
          grep -Fq "versionName='0.11.0'" /tmp/final-badging.txt
          grep -Fq "application-label:'Admission Hub v0.11 Six-Card Dashboard'" /tmp/final-badging.txt
          grep -qi 'db6cd5efceda108657662d06f857e5f0277301cb6ab97a75c8a01994c96e4995' /tmp/final-apksigner.txt

      - name: Package final APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/$APK_NAME"
          sha256sum "dist/$APK_NAME" | tee "dist/$APK_NAME.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: admission-hub-v0.11-six-card-dashboard
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish v0.11.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete v0.11.0 --yes --cleanup-tag >/dev/null 2>&1 || true
          git tag -f v0.11.0 "$PRODUCT_SHA"
          git push origin -f v0.11.0
          gh release create v0.11.0 \
            "dist/$APK_NAME" "dist/$APK_NAME.sha256" \
            --target "$PRODUCT_SHA" \
            --title "Admission Hub v0.11 — Six-Card Dashboard + Persisted Sync Status" \
            --notes "First user-facing Hub presentation release. Adds a horizontally scrollable six-application dashboard backed only by persisted canonical evidence; every card shows university, recruitment unit, admission, campus, capacity, Jinhak 5-lane coverage, and explicit accepted/provisional/provider-only quality. Adds persisted sync-state banner with login/check/recovery/provider-sync/complete states, Jinhak target progress, remaining count, and recent progress age when available. Card taps expose quality and official-binding evidence counts. Local rebind, selected-six recovery, auth-domain separation, mission-cell hard leases, observation-first storage, prediction-vs-historical separation, stable package/signer and privacy invariants are preserved. The dashboard never auto-selects or infers an application. Product commit: $PRODUCT_SHA"
