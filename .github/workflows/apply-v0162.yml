name: Apply Admission Hub v0.16.2 Jinhak Fail-Closed

on:
  push:
    branches: [codex/v0162-jinhak-failclosed]
    paths:
      - ".github/scripts/patch_v0162.py"
      - ".github/workflows/apply-v0162.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: admission-hub-v0162-apply
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v0162-jinhak-failclosed
          fetch-depth: 0
      - name: Apply v0.16.2 product patch
        run: python3 .github/scripts/patch_v0162.py
      - name: Verify recursive login retry was removed
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'jinhak-lower-grade-login-terminal-fence' app/src/main/java/com/admissionhub/collector/MainActivity.kt
          grep -F 'if (jinhakLowerGradeLoginFenceLatched) return' app/src/main/java/com/admissionhub/collector/MainActivity.kt
          ! grep -F 'installJinhakHigh3DomProductFence("unsafe-login-recheck")' app/src/main/java/com/admissionhub/collector/MainActivity.kt
          ! grep -F '고1·고2 리다이렉트 차단 · 로그인 재시도 없이 고3 보호경로로 복귀합니다.' app/src/main/java/com/admissionhub/collector/MainActivity.kt
      - name: Commit product patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git commit -m "fix: terminate Jinhak lower-grade login retry loop"
          git push origin HEAD:codex/v0162-jinhak-failclosed
