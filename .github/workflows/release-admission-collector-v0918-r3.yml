name: Release Admission Collector v0.9.18 Auth Resume Revalidation R3

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/release-admission-collector-v0918-r3.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      TAG: v0.9.18
      APK_NAME: Admission-Collector-v0.9.18-Auth-Resume-Revalidation.apk

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.9.18 patch
        run: |
          set -euo pipefail
          python3 scripts/patch_v0918_auth_resume_v2.py
          git diff --check

      - name: Verify exact change scope and auth-resume safety
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          expected = {
              '.github/workflows/build-admission-collector-main.yml',
              'app/build.gradle.kts',
              'app/src/main/AndroidManifest.xml',
              'app/src/main/java/com/admissionhub/collector/MainActivity.kt',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          if changed != expected:
              raise SystemExit(f'unexpected changed-file scope: {sorted(changed)}')

          main = Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt').read_text()
          adapter = Path('app/src/main/java/com/admissionhub/collector/provider/JinhakAdapter.kt').read_text()
          workflow = Path('.github/workflows/build-admission-collector-main.yml').read_text()
          gradle = Path('app/build.gradle.kts').read_text()
          manifest = Path('app/src/main/AndroidManifest.xml').read_text()

          checks = {
              'version': 'private const val VERSION = "0.9.18"' in main,
              'build code': 'private const val BUILD_CODE = 109180' in main,
              'gradle version': 'versionName = "0.9.18"' in gradle and 'versionCode = 109180' in gradle,
              'manifest label': 'Admission Collector v0.9.18 Auth Resume Revalidation' in manifest,
              'Jinhak batch crawl disabled': 'override val supportsBatchCrawl = false' in adapter,
              'user mission traversal retained': 'override val supportsUserSessionMissionTraversal = true' in adapter,
              'main CI batch guard corrected': "grep -q 'override val supportsBatchCrawl = false' \"$ADAPTER\"" in workflow,
              'mission persistence retained': 'restoreJinhakMissionPersistence' in main,
              'renderer recovery retained': 'onRenderProcessGone' in main,
              'same-card replay retained': 'jinhakSameCardReplayRetries' in main,
              'renderer circuit retained': 'slowLaneRendererCircuitOpen' in main,
              'stall fence retained': 'jinhakMissionStallFenceTrips' in main,
              'target redirect guard retained': 'target-specific-auth-redirect' in main,
              'real auth probe retained': 'finishJinhakRealAuthProbe' in main and 'protected-core-stable' in main,
          }
          missing=[name for name,ok in checks.items() if not ok]
          if missing:
              raise SystemExit('safety/cumulative checks failed: ' + ', '.join(missing))

          checkpoint = main.split('private fun persistJinhakAuthRuntimeEvidence',1)[1].split('private fun restoreJinhakAuthRuntimeEvidence',1)[0]
          for token in ['password','passwd','cookie','localStorage','sessionStorage','formValues','document.cookie','hidden']:
              if token.lower() in checkpoint.lower():
                  raise SystemExit('forbidden auth checkpoint material: ' + token)

          resume = main.split('private fun resumeInterruptedUnifiedSessionIfNeeded()',1)[1].split('private fun providerLoginUrl',1)[0]
          jinhak = resume.split('provider = ProviderId.JINHAK',1)[1]
          if 'unifiedPendingJinhakStart = true' in jinhak:
              raise SystemExit('resume still arms Jinhak batch before auth revalidation')
          for token in [
              'restoreJinhakAuthRuntimeEvidence()',
              'jinhakTransitionAuthGateActive = true',
              'jinhakAuthVerifiedForBatch = false',
              'jinhakProtectedCoreStablePasses = 0',
              'JinhakSiteTopology.missionSeeds().firstOrNull()',
              'activity-resume-auth-revalidation-start',
          ]:
              if token not in jinhak:
                  raise SystemExit('resume auth guard missing: ' + token)
          if 'currentBatchTarget = coreProbe' in jinhak:
              raise SystemExit('protected-core probe overwrites persisted mission target')

          print('v0.9.18 diff scope and safety checks passed')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable signing key
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_SECRET"
          STORE_FILE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ANDROID_SIGNING_SECRET -in signing/admission-upload.keystore.enc -out "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unit test and assemble patched source
        run: |
          set -euo pipefail
          gradle --no-daemon test :app:assembleDebug
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -Fq "versionCode='109180'" /tmp/badging.txt
          grep -Fq "versionName='0.9.18'" /tmp/badging.txt
          grep -Fq "application-label:'Admission Collector v0.9.18 Auth Resume Revalidation'" /tmp/badging.txt

      - name: Commit verified source to main
        id: commit
        run: |
          set -euo pipefail
          git config user.name "admission-collector-bot"
          git config user.email "admission-collector-bot@users.noreply.github.com"
          git add \
            app/src/main/java/com/admissionhub/collector/MainActivity.kt \
            app/build.gradle.kts \
            app/src/main/AndroidManifest.xml \
            .github/workflows/build-admission-collector-main.yml
          git diff --cached --check
          git commit -m "v0.9.18: revalidate Jinhak auth after activity resume"
          git push origin HEAD:main
          SOURCE_COMMIT=$(git rev-parse HEAD)
          echo "sha=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.commit.outputs.sha }}
          path: verify-source

      - name: Rebuild exact committed source
        run: |
          set -euo pipefail
          cd verify-source
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(grep -c 'private const val VERSION = \"0.9.18\"' app/src/main/java/com/admissionhub/collector/MainActivity.kt)" -eq 1
          gradle --no-daemon :app:assembleDebug
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/committed-badging.txt
          grep -Fq "versionCode='109180'" /tmp/committed-badging.txt
          grep -Fq "versionName='0.9.18'" /tmp/committed-badging.txt
          cp "$APK" "$GITHUB_WORKSPACE/$APK_NAME"
          cd "$GITHUB_WORKSPACE"
          APK_SHA256=$(sha256sum "$APK_NAME" | awk '{print $1}')
          echo "APK_SHA256=$APK_SHA256" >> "$GITHUB_ENV"
          printf '%s  %s\n' "$APK_SHA256" "$APK_NAME" > "$APK_NAME.sha256"

      - name: Publish v0.9.18 release
        run: |
          set -euo pipefail
          NOTES=$(cat <<EOF
          Admission Collector v0.9.18 — Auth Resume Revalidation

          The v0.9.17 real-device run reached Real Auth Probe result protected-core-stable, but later runtime continuity loss reset final auth diagnostics to never-run while the SQLite mission ledger survived. v0.9.18 makes that boundary explicit and safe.

          - Sanitized auth/probe evidence is persisted; credentials, cookies, storage values, hidden form data and tokens are not.
          - Restored verification is diagnostics only and cannot authorize crawling.
          - On Activity/process resume, the existing SQLite mission target is restored, protected Jinhak core is revalidated for two stable passes, and only then is that target resumed.
          - The protected-core probe does not replace currentBatchTarget.
          - Resume diagnostics expose restoration and revalidation counters.
          - Main CI now enforces JinhakAdapter.supportsBatchCrawl=false.

          Source commit: $SOURCE_COMMIT
          APK SHA-256: $APK_SHA256
          EOF
          )
          gh release create "$TAG" "$APK_NAME" "$APK_NAME.sha256" \
            --target "$SOURCE_COMMIT" \
            --title "Admission Collector v0.9.18 — Auth Resume Revalidation" \
            --notes "$NOTES"

      - name: Verify release publication
        run: |
          set -euo pipefail
          gh release view "$TAG" --json tagName,name,targetCommitish,isDraft,isPrerelease,assets,url > /tmp/release.json
          python3 - <<'PY'
          import json, os
          d=json.load(open('/tmp/release.json'))
          apk=os.environ['APK_NAME']
          assert d['tagName']=='v0.9.18'
          assert d['name']=='Admission Collector v0.9.18 — Auth Resume Revalidation'
          assert not d['isDraft'] and not d['isPrerelease']
          names={a['name'] for a in d['assets']}
          assert {apk, apk+'.sha256'} <= names
          print(json.dumps(d, ensure_ascii=False, indent=2))
          PY
