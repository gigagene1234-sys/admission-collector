name: Build Admission Collector v0.3.3

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply deterministic v0.3.3 patch
        run: python3 scripts/apply_v033.py

      - name: Verify v0.3.3 invariants
        shell: bash
        run: |
          set -euo pipefail
          cmp -s MainActivity.kt app/src/main/java/com/admissionhub/collector/MainActivity.kt
          test -f app/src/main/java/com/admissionhub/collector/CollectionKeepAliveService.kt
          grep -q 'private const val VERSION = "0.3.3"' MainActivity.kt
          grep -q 'versionName = "0.3.3"' app/build.gradle.kts
          grep -q 'versionCode = 10' app/build.gradle.kts
          grep -q 'collectorWebView' MainActivity.kt
          grep -q 'collectionTransport", "background-webview"' MainActivity.kt
          grep -q 'stabilizeBatchSnapshotContext' MainActivity.kt
          grep -q 'requestedYear ?: "unknown"' MainActivity.kt
          grep -q 'val requestedYear = queryYear(url) ?: return null' app/src/main/java/com/admissionhub/collector/provider/AdigaAdapter.kt
          grep -q 'FOREGROUND_SERVICE_DATA_SYNC' app/src/main/AndroidManifest.xml
          grep -q 'CollectionKeepAliveService' app/src/main/AndroidManifest.xml

      - name: Validate Cloudflare Worker source
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/src/index.js
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          sql = Path('cloudflare/migrations/0001_init.sql').read_text()
          db = sqlite3.connect(':memory:')
          db.executescript(sql)
          db.close()
          print('D1 schema syntax OK')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Persist generated v0.3.3 source on main
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            MainActivity.kt \
            app/build.gradle.kts \
            app/src/main/AndroidManifest.xml \
            app/src/main/java/com/admissionhub/collector/MainActivity.kt \
            app/src/main/java/com/admissionhub/collector/provider/AdigaAdapter.kt
          if git diff --cached --quiet; then
            echo "Generated v0.3.3 source already persisted"
          else
            git commit -m "Apply v0.3.3 background collector integration [skip ci]"
            git push origin HEAD:main
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: admission-collector-v0.3.3-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
