name: Build Admission Collector v0.8.3 Mission-First Report Recovery

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-admission-collector-v083.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout v0.8.2 committed source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.8.3 mission-first architecture
        run: python3 scripts/apply_v083_mission_first.py

      - name: Upgrade committed-source quality gates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/build-admission-collector-main.yml')
          s=p.read_text()
          s=s.replace('Verify architecture and v0.8.2 semantics','Verify architecture and v0.8.3 mission-first semantics')
          anchor="""          grep -q 'jinhak-admission-knowledge' \"$ADAPTER\"\n\n          python3 - <<'PY'\n"""
          repl="""          grep -q 'jinhak-admission-knowledge' \"$ADAPTER\"\n          grep -q 'mission-link-navigation' \"$SNAP\"\n          grep -q 'if(missionLinkBound) continue;' \"$SNAP\"\n          grep -q 'jinhak-ai-diagnosis-consent' \"$SNAP\"\n          grep -q 'JINHAK_USER_CONSENT_REQUIRED' \"$SYNC\"\n          grep -q 'jinhak-application-unbound-observation' \"$ADAPTER\"\n          grep -q 'stripCardUiPrefix' \"$MISSION\"\n          grep -q 'jinhakApplicationAnchorActionsExecuted' \"$MAIN\"\n          grep -q 'jinhakConsentGatesEncountered' \"$MAIN\"\n\n          python3 - <<'PY'\n"""
          if anchor not in s:
              raise SystemExit('main workflow gate anchor missing')
          s=s.replace(anchor,repl,1)
          py_anchor="""          for token in ['원서','접수','결제','저장','삭제','로그아웃','제출','확정']:\n              if token not in agent: raise SystemExit('agent safety boundary missing: '+token)\n"""
          py_repl="""          for token in ['원서','접수','결제','저장','삭제','로그아웃','제출','확정','동의','미동의']:\n              if token not in agent: raise SystemExit('agent safety boundary missing: '+token)\n          if 'mission-link-navigation' not in snap or 'applicationContextForAction(a)' not in snap:\n              raise SystemExit('same-card direct report anchors are not mission-bound')\n          if 'if(missionLinkBound) continue;' not in snap:\n              raise SystemExit('mission links can leak into generic navigation queue')\n          if 'jinhak-application-unbound-observation' not in adapter:\n              raise SystemExit('partial application identity can still masquerade as structured prediction')\n"""
          if py_anchor not in s:
              raise SystemExit('main workflow python anchor missing')
          s=s.replace(py_anchor,py_repl,1)
          p.write_text(s)
          PY

      - name: v0.8.3 architecture and privacy gates
        shell: bash
        run: |
          set -euo pipefail
          MAIN=app/src/main/java/com/admissionhub/collector/MainActivity.kt
          SNAP=app/src/main/java/com/admissionhub/collector/capture/SnapshotScript.kt
          MISSION=app/src/main/java/com/admissionhub/collector/jinhak/JinhakApplicationMission.kt
          ADAPTER=app/src/main/java/com/admissionhub/collector/provider/JinhakAdapter.kt
          AGENT=app/src/main/java/com/admissionhub/collector/jinhak/JinhakAgentNavigator.kt
          SYNC=app/src/main/java/com/admissionhub/collector/sync/UnifiedSyncState.kt

          grep -q 'private const val VERSION = "0.8.3"' "$MAIN"
          grep -q 'private const val BUILD_CODE = 10830' "$MAIN"
          grep -q 'mission-link-navigation' "$SNAP"
          grep -q 'if(missionLinkBound) continue;' "$SNAP"
          grep -q 'jinhak-ai-diagnosis-consent' "$SNAP"
          grep -q 'JINHAK_USER_CONSENT_REQUIRED' "$SYNC"
          grep -q 'jinhak-application-unbound-observation' "$ADAPTER"
          grep -q 'stripCardUiPrefix' "$MISSION"
          grep -q 'previousYearCompetition' "$MISSION"
          grep -q 'mockCompetition' "$MISSION"
          grep -q 'same-card-admission-capacity-boundary' "$MISSION"
          grep -q 'applicationAnchorActionsDiscovered' "$MAIN"
          grep -q 'secondsToFirstPopulatedStorage' "$MAIN"

          python3 - <<'PY'
          from pathlib import Path
          main=Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt').read_text()
          snap=Path('app/src/main/java/com/admissionhub/collector/capture/SnapshotScript.kt').read_text()
          mission=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakApplicationMission.kt').read_text()
          adapter=Path('app/src/main/java/com/admissionhub/collector/provider/JinhakAdapter.kt').read_text()
          agent=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakAgentNavigator.kt').read_text()
          probe=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakAuthorizedConnector.kt').read_text()

          # No new privacy regression in mission/consent logic.
          mission_ctx=snap.split('function applicationContextForAction',1)[1].split('var nav=[]',1)[0]
          for token in ['document.cookie','localStorage','sessionStorage','input.value','.value']:
              if token in mission_ctx: raise SystemExit('mission context reads forbidden material: '+token)
          for token in ['document.cookie','localStorage','sessionStorage','input.value','fetch(','XMLHttpRequest']:
              if token in probe: raise SystemExit('capability probe reads forbidden material: '+token)
          if '동의|미동의' not in agent:
              raise SystemExit('consent choices are not explicitly blocked from agent automation')
          if 'jinhakConsentGatePending' not in main or 'JINHAK_USER_CONSENT_REQUIRED' not in main:
              raise SystemExit('visible consent gate is not represented as a user-action state')
          if 'mission-link-navigation' not in snap or 'missionLinkBound=missionLink' not in snap:
              raise SystemExit('same-card anchor report mission binding missing')
          if 'if(missionLinkBound) continue;' not in snap:
              raise SystemExit('mission report anchor still leaks into generic URL queue')
          if 'jinhak-application-unbound-observation' not in adapter or 'same-card-application-identity-incomplete' not in adapter:
              raise SystemExit('partial identities are not preserved separately')
          if 'putNumber(metrics, "mockCompetition"' in adapter:
              raise SystemExit('broad competition-to-mock semantic corruption reintroduced')
          if '철도차량시스템공학과' in mission:
              raise SystemExit('raw department parser invents canonical suffix')
          dept=snap.split('function departmentContextFor',1)[1].split('function universityContextFor',1)[0]
          if 'previousElementSibling' in dept or 'nextElementSibling' in dept:
              raise SystemExit('cross-card department inheritance reintroduced')
          for token in ['JINHAK_ABSOLUTE_TARGET_MS = 35_000L','onRenderProcessGone','installRuntimeCrashGuard','onTrimMemory','localStore.writeUnifiedExport(streamSession, writer)']:
              if token not in main: raise SystemExit('runtime/memory guard missing: '+token)
          PY

      - name: Regression fixtures for v0.8.2 failures
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          # Identity normalization fixtures mirror the Kotlin grammar and assert the intended boundaries.
          def strip_ui(s):
              s=re.sub(r'\s+',' ',s).strip()
              s=re.sub(r'^(?:(?:닫기|열기)\s*)+','',s).strip()
              s=re.sub(r'^(?:[0-9]{1,2}\s*칸\s*)+','',s).strip()
              s=re.sub(r'^(?:(?:닫기|열기)\s*)+','',s).strip()
              return s
          assert strip_ui('닫기7칸건국대(GLOCAL)[교과]교과우수바이오메디컬공27명 내 점수858.108점').startswith('건국대(GLOCAL)[교과]')
          repeated='[교과]일반[교과][대전]안경광학20명 내 점수'
          parts=re.findall(r'^\[([^]]+)\]|\[([^]]+)\]', repeated)
          assert '[교과][대전]' in repeated

          # Semantic labels remain distinct by construction.
          s='전년도 경쟁률 5.33 모의지원 경쟁률 2.75'
          prev=float(re.search(r'전년도\s*경쟁률\s*([0-9.]+)',s).group(1))
          mock=float(re.search(r'모의지원\s*경쟁률\s*([0-9.]+)',s).group(1))
          assert prev==5.33 and mock==2.75 and prev!=mock

          # A consent gate must be a pause condition, never a click candidate.
          gate='학생부 AI진단 점수 활용 동의 동의 미동의 확인'
          assert '학생부 AI진단 점수 활용 동의' in gate and '미동의' in gate
          print('v0.8.3 regression fixtures passed')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_SECRET"
          STORE_FILE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ANDROID_SIGNING_SECRET \
            -in signing/admission-upload.keystore.enc -out "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build v0.8.3 APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -Fq "versionCode='10830'" /tmp/badging.txt
          grep -Fq "versionName='0.8.3'" /tmp/badging.txt
          grep -Fq "application-label:'Admission Collector v0.8.3 Mission-First Report Recovery'" /tmp/badging.txt
          sha256sum "$APK"

      - name: Persist generated v0.8.3 source and remove one-off transformer
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply_v083_mission_first.py .github/workflows/build-admission-collector-v083.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply v0.8.3 Mission-First Report Recovery'
          git push origin HEAD:main

      - name: Upload v0.8.3 APK
        uses: actions/upload-artifact@v4
        with:
          name: admission-collector-v0.8.3-mission-first-report-recovery-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
