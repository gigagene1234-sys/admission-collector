name: Build Admission Collector v0.8.3 Concurrent Slow Lane

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-admission-collector-v083.yml"
      - "scripts/apply_v083_concurrent_slow_lane.py"
      - "scripts/fix_v083_patch_anchors_v2.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}

    steps:
      - name: Checkout v0.8.3 base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply concurrent slow lane implementation
        run: |
          python3 scripts/fix_v083_patch_anchors_v2.py
          python3 scripts/apply_v083_concurrent_slow_lane.py

      - name: Verify v0.8.3 scheduling and safety invariants
        shell: bash
        run: |
          set -euo pipefail
          MAIN=app/src/main/java/com/admissionhub/collector/MainActivity.kt
          SLOW=app/src/main/java/com/admissionhub/collector/jinhak/JinhakSlowLanePool.kt
          SNAP=app/src/main/java/com/admissionhub/collector/capture/SnapshotScript.kt
          AGENT=app/src/main/java/com/admissionhub/collector/jinhak/JinhakAgentNavigator.kt
          STORE=app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt
          MANIFEST=app/src/main/AndroidManifest.xml

          grep -q 'private const val VERSION = "0.8.3"' "$MAIN"
          grep -q 'private const val BUILD_CODE = 10830' "$MAIN"
          grep -q 'versionCode = 10830' app/build.gradle.kts
          grep -q 'versionName = "0.8.3"' app/build.gradle.kts
          grep -q 'Admission Collector v0.8.3 Concurrent Slow Lane' "$MANIFEST"

          grep -q 'JINHAK_SLOW_ESCALATION_MS = 35_000L' "$MAIN"
          grep -q 'jinhak-slow-lane-escalated' "$MAIN"
          grep -q 'slow-lane", 0, null' "$MAIN"
          if grep -q 'JINHAK_ABSOLUTE_TARGET_MS' "$MAIN"; then echo 'old absolute timeout constant remains'; exit 1; fi
          if grep -q 'jinhak-absolute-target-timeout' "$MAIN"; then echo '35s absolute failure behavior remains'; exit 1; fi

          grep -q 'DEFAULT_MAX_WORKERS = 2' "$SLOW"
          grep -q 'STALL_CHECK_AFTER_MS = 90_000L' "$SLOW"
          grep -q 'STALL_NO_PROGRESS_MS = 18_000L' "$SLOW"
          grep -q 'HARD_MAX_MS = 120_000L' "$SLOW"
          grep -q 'progressExtensions' "$SLOW"
          grep -q 'slowLanePool.setMaxActiveWorkers(1)' "$MAIN"
          grep -q 'slowLanePool.hasWork()' "$MAIN"
          grep -q '메인 탐색 완료 · slow worker' "$MAIN"

          grep -q 'jinhakLastAgentActionMissionContext' "$MAIN"
          grep -q 'missionContext = mission?.toJson()' "$MAIN"
          grep -q 'replayScript' "$SLOW"
          grep -q 'same-application-agent-mission' app/src/main/java/com/admissionhub/collector/jinhak/JinhakApplicationMission.kt
          grep -q 'collectionTransport", "concurrent-slow-lane"' "$MAIN"
          grep -q 'jinhakSlowLaneCompleted' "$MAIN"
          grep -q 'slowLaneProgressExtensions' "$MAIN"

          grep -q 'CREATE TABLE IF NOT EXISTS observations' "$STORE"
          grep -q 'contractVersion\\\":3' "$STORE"
          grep -q 'previousYearCompetition' app/src/main/java/com/admissionhub/collector/jinhak/JinhakApplicationMission.kt
          grep -q 'mockCompetition' app/src/main/java/com/admissionhub/collector/jinhak/JinhakApplicationMission.kt
          grep -q 'mission-link-navigation' "$SNAP"
          grep -q '원서' "$AGENT"
          grep -q '결제' "$AGENT"

          python3 - <<'PY'
          from pathlib import Path
          main=Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt').read_text()
          slow=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakSlowLanePool.kt').read_text()
          snap=Path('app/src/main/java/com/admissionhub/collector/capture/SnapshotScript.kt').read_text()
          probe=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakAuthorizedConnector.kt').read_text()
          if 'jinhak-absolute-target-timeout' in main: raise SystemExit('old timeout failure remains')
          if 'localStore.markDocument(runId, target, "error", 0, "jinhak-absolute-target-timeout")' in main: raise SystemExit('35s still marks error')
          for token in ['document.cookie','localStorage','sessionStorage','input.value','.value']:
              if token in slow: raise SystemExit(f'slow lane reads forbidden browser secret/form material: {token}')
          for token in ['document.cookie','localStorage','sessionStorage','input.value','location.href','fetch(','XMLHttpRequest']:
              if token in probe: raise SystemExit(f'capability probe reads forbidden material: {token}')
          dept=snap.split('function departmentContextFor',1)[1].split('function universityContextFor',1)[0]
          if 'previousElementSibling' in dept or 'nextElementSibling' in dept: raise SystemExit('cross-card department inheritance reintroduced')
          for token in ['slow-lane-user-action-required','slow-lane-hard-max','slow-lane-no-progress','mission-action-not-found']:
              if token not in slow: raise SystemExit(f'missing slow-lane boundary: {token}')
          if 'FrameLayout.LayoutParams.MATCH_PARENT' not in slow: raise SystemExit('slow worker viewport is not full host size')
          if 'translationX = -10000f' not in main: raise SystemExit('offscreen worker host missing')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_SECRET"
          STORE_FILE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ANDROID_SIGNING_SECRET -in signing/admission-upload.keystore.enc -out "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build v0.8.3
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "versionCode='10830'" /tmp/badging.txt
          grep -q "versionName='0.8.3'" /tmp/badging.txt
          grep -q "application-label:'Admission Collector v0.8.3 Concurrent Slow Lane'" /tmp/badging.txt
          sha256sum "$APK" | tee /tmp/apk.sha256

      - name: Persist v0.8.3 implementation to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/admissionhub/collector/MainActivity.kt app/src/main/java/com/admissionhub/collector/jinhak/JinhakSlowLanePool.kt app/src/main/AndroidManifest.xml
          if ! git diff --cached --quiet; then
            git commit -m "Implement v0.8.3 concurrent slow lane"
            git push origin HEAD:main
          fi

      - name: Upload v0.8.3 APK
        uses: actions/upload-artifact@v4
        with:
          name: admission-collector-v0.8.3-concurrent-slow-lane-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
