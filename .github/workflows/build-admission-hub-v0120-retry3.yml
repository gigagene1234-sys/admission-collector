name: Build Admission Hub v0.12 Score Decision Retry 3

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-admission-hub-v0120-retry3.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_SIGNING_SECRET: ${{ secrets.ADMISSION_INGEST_TOKEN }}
      APK_NAME: Admission-Hub-v0.12-Score-Decision.apk
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Neutralize brittle UI matchers in patch helper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/patch_v0120.py')
          s=p.read_text()
          replacements={
            "main = replace_once(main, render_anchor, render_extra, 'decision summary render')":"main = main",
            "main = replace_once(main, card_old, card_new, 'score card text')":"main = main",
            "main = replace_once(main, show_detail_anchor, show_detail_new, 'score card detail')":"main = main",
            "'decision-panel': 'hubDecisionSummary' in main and '검증 환산' in main,":"'decision-panel': 'hubDecisionSummary' in main,",
            "'score-card': '대학 환산: 미확인' in main and '공식 입결: 미확인' in main and '종합: 판정 보류' in main,":"'score-card': True,",
          }
          for old,new in replacements.items():
              if old not in s: raise SystemExit('missing helper token: '+old[:80])
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Apply v0.12 core patch
        run: python3 .github/scripts/patch_v0120.py
      - name: Apply robust v0.12 UI integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt')
          s=p.read_text()

          # Authoritative score summary banner, inserted before the legacy mirror.
          anchor='        if (::sessionState.isInitialized) {'
          if s.count(anchor)!=1: raise SystemExit(f'session mirror anchor count={s.count(anchor)}')
          block='''        if (::hubDecisionSummary.isInitialized) {
              val profile = model.optJSONObject("studentScoreProfile") ?: JSONObject()
              val profileText = if (profile.optString("status") == "IMPORTED") "성적 프로필 등록" else "성적 프로필 미등록"
              hubDecisionSummary.text = "$profileText · 검증 환산 ${summary.optInt("verifiedConversions", 0)}/6 · 공식 입결 ${summary.optInt("officialOutcomeAvailable", 0)}/6 · 비교 가능 ${summary.optInt("comparableDecisions", 0)}/6 · 판정보류 ${summary.optInt("decisionHolds", 0)} · 진학사 예측자료 ${summary.optInt("predictionCollected", 0)}/6"
          }
          '''
          s=s.replace(anchor, block+anchor,1)

          # Score lines on each card; source stores literal backslash-n sequences.
          official_line='                    val official = card.optString("qualityLabel", "데이터 품질 확인 필요")\n'
          if s.count(official_line)!=1: raise SystemExit(f'official card line count={s.count(official_line)}')
          vars='''                    val scoreDecision = card.optJSONObject("scoreDecision") ?: JSONObject()
                    val conversion = scoreDecision.optString("conversionLabel", "대학 환산: 미확인")
                    val officialOutcome = scoreDecision.optString("officialOutcomeLabel", "공식 입결: 미확인")
                    val prediction = scoreDecision.optString("predictionLabel", "진학사 예측: 미확인")
                    val decision = scoreDecision.optString("decisionLabel", "종합: 판정 보류")
'''
          s=s.replace(official_line, official_line+vars,1)
          old_return=r'                    "${index + 1}. $university\n$department\n$subtitle\n\n$capacity\n$coverage\n$official"'
          new_return=r'                    "${index + 1}. $university\n$department\n$subtitle\n\n$capacity · $coverage\n$official\n$conversion\n$officialOutcome\n$prediction\n$decision"'
          if s.count(old_return)!=1: raise SystemExit(f'card return count={s.count(old_return)}')
          s=s.replace(old_return,new_return,1)

          # Detail dialog score block before canonical timestamp.
          detail_anchor='            val updated = card.optString("updatedAt")'
          if s.count(detail_anchor)!=1: raise SystemExit(f'detail updated anchor count={s.count(detail_anchor)}')
          detail='''            val scoreDecision = card.optJSONObject("scoreDecision") ?: JSONObject()
            append("\\n[성적·판정]\\n")
            append(scoreDecision.optString("conversionLabel", "대학 환산: 미확인")).append('\\n')
            append(scoreDecision.optString("officialOutcomeLabel", "공식 입결: 미확인")).append('\\n')
            append(scoreDecision.optString("predictionLabel", "진학사 예측: 미확인")).append('\\n')
            append(scoreDecision.optString("decisionLabel", "종합: 판정 보류")).append('\\n')
            val evaluation = scoreDecision.optJSONObject("evaluation")
            if (evaluation != null) append("판정 코드: ").append(evaluation.optString("decisionCode", "UNKNOWN")).append('\\n')
'''
          s=s.replace(detail_anchor, detail+detail_anchor,1)
          p.write_text(s)
          PY
      - name: Verify cumulative safety and score invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          main=Path('app/src/main/java/com/admissionhub/collector/MainActivity.kt').read_text()
          store=Path('app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt').read_text()
          model=Path('app/src/main/java/com/admissionhub/collector/hub/HubDashboardModel.kt').read_text()
          layout=Path('app/src/main/java/com/admissionhub/collector/hub/HubFirstLayoutPolicy.kt').read_text()
          engine=Path('app/src/main/java/com/admissionhub/collector/score/ScoreDecisionEngine.kt').read_text()
          adapter=Path('app/src/main/java/com/admissionhub/collector/provider/JinhakAdapter.kt').read_text()
          cell=Path('app/src/main/java/com/admissionhub/collector/jinhak/JinhakMissionCellSupervisor.kt').read_text()
          checks={
            'version': 'private const val VERSION = "0.12.0"' in main and 'private const val BUILD_CODE = 112000' in main,
            'db-v9': '\n    9\n) {' in store and 'score_student_profiles' in store and 'score_decision_assessments' in store,
            'score-engine': 'UNKNOWN_COMPARISON_DIRECTION' in engine and 'NO_COMPARABLE_OFFICIAL_OUTCOME' in engine,
            'no-invented-probability': 'probabilityInferred' in engine and 'unsupportedThresholdsUsed' in engine,
            'scale-guard': 'scoreScale' in engine and 'comparisonDirection' in engine,
            'dashboard-score': 'scoreDecisionSummary' in store and 'scoreDecision' in model and 'hubDecisionSummary' in main and '검증 환산' in main,
            'score-card': '대학 환산: 미확인' in main and '공식 입결: 미확인' in main and '종합: 판정 보류' in main,
            'responsive': 'widthDp >= 900 -> 3' in layout and '3 -> 236' in layout,
            'user-six': 'showHubSixManager' in main and 'startSelectedSixRecovery' in main,
            'batch-disabled': 'override val supportsBatchCrawl = false' in adapter,
            'mission-user-session': 'override val supportsUserSessionMissionTraversal = true' in adapter,
            'hard-lease': 'expireStaleOwnership' in cell and 'LATE_CALLBACK_IGNORED' in cell,
            'prediction-history': 'predictionDoesNotOverwriteHistoricalActual' in store,
            'privacy': 'credentialExported' in main and 'sessionSecretExported' in main,
          }
          failed=[k for k,v in checks.items() if not v]
          if failed: raise SystemExit('v0.12 invariant failure: '+', '.join(failed))
          print('v0.12 cumulative invariants passed')
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore stable signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_SECRET"
          STORE_FILE="$RUNNER_TEMP/admission-upload.jks"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:ANDROID_SIGNING_SECRET -in signing/admission-upload.keystore.enc -out "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$ANDROID_SIGNING_SECRET" -alias admission >/dev/null
          echo "ADMISSION_SIGNING_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
          echo "ADMISSION_SIGNING_PASSWORD=$ANDROID_SIGNING_SECRET" >> "$GITHUB_ENV"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Run Score Decision Mission Lab tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Compile product
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK metadata and stable signer
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -Fq "versionCode='112000'" /tmp/badging.txt
          grep -Fq "versionName='0.12.0'" /tmp/badging.txt
          grep -Fq "application-label:'Admission Hub v0.12 Score Decision'" /tmp/badging.txt
          grep -qi 'db6cd5efceda108657662d06f857e5f0277301cb6ab97a75c8a01994c96e4995' /tmp/apksigner.txt
      - name: Commit v0.12 product source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/admissionhub/collector/MainActivity.kt \
                  app/src/main/java/com/admissionhub/collector/local/LocalCollectorStore.kt \
                  app/src/main/java/com/admissionhub/collector/hub/HubDashboardModel.kt \
                  app/src/main/java/com/admissionhub/collector/hub/HubFirstLayoutPolicy.kt \
                  app/src/main/java/com/admissionhub/collector/score/ScoreDecisionEngine.kt \
                  app/src/test/java/com/admissionhub/collector/score/ScoreDecisionEngineTest.kt \
                  app/src/test/java/com/admissionhub/collector/hub/HubScoreDecisionPresentationTest.kt \
                  app/build.gradle.kts app/src/main/AndroidManifest.xml
          git commit -m "Implement v0.12 evidence-safe Score and Decision model"
          git push origin HEAD:main
          PRODUCT_SHA=$(git rev-parse HEAD)
          echo "PRODUCT_SHA=$PRODUCT_SHA" >> "$GITHUB_ENV"
      - name: Rebuild and retest exact committed source
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$PRODUCT_SHA"
          rm -rf app/build
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/final-apksigner.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/final-badging.txt
          grep -Fq "versionCode='112000'" /tmp/final-badging.txt
          grep -Fq "versionName='0.12.0'" /tmp/final-badging.txt
          grep -Fq "application-label:'Admission Hub v0.12 Score Decision'" /tmp/final-badging.txt
          grep -qi 'db6cd5efceda108657662d06f857e5f0277301cb6ab97a75c8a01994c96e4995' /tmp/final-apksigner.txt
      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/$APK_NAME"
          sha256sum "dist/$APK_NAME" | tee "dist/$APK_NAME.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: admission-hub-v0.12-score-decision
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish v0.12 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete v0.12.0 --yes --cleanup-tag >/dev/null 2>&1 || true
          git tag -f v0.12.0 "$PRODUCT_SHA"
          git push origin -f v0.12.0
          gh release create v0.12.0 "dist/$APK_NAME" "dist/$APK_NAME.sha256" \
            --target "$PRODUCT_SHA" \
            --title "Admission Hub v0.12 — Evidence-Safe Score & Decision Model" \
            --notes "Adds the persistent score-decision evidence layer without inventing missing admissions data. SQLite v9 separates student score profiles, university conversion results, official historical outcomes, Jinhak prediction snapshots and decision assessments. Comparisons require a verified formula, explicit score scale, comparison direction, verified application binding, and exactly one compatible official reference; otherwise the result is explicitly held. No admission probability or unsupported safe/target/reach threshold is inferred. Existing current-prediction mission coverage is surfaced only as collected-unstructured evidence until a numeric snapshot is verified. The 3x2 cards now expose university conversion, official outcome, Jinhak prediction readiness and decision state, while all v0.11.1 collection, auth, local-rebind, six-slot ownership, hard-lease, prediction/history separation and privacy invariants remain intact. Product commit: $PRODUCT_SHA"
